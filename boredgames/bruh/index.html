<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bruh... · Bored Games · Neon Bread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2bd6;--cyan:#00e5ff;--yellow:#ffe14d;--purple:#b04bff;--pc:#ff2bd6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07010f;color:#fff;font-family:'Press Start 2P',monospace;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% 0%,#2a1250 0%,#0d0320 58%,#07010f 100%)}
#scan{position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px)}
/* ---------- game layout: board + side panel ---------- */
#game{position:fixed;inset:0;display:none;align-items:center;justify-content:center;gap:2.4vmin;padding:2vmin}
#game.on{display:flex}
#board{display:block;background:#0f0522;border:3px solid #3a2272;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 0 40px rgba(176,75,255,.3),0 20px 50px rgba(0,0,0,.6);touch-action:none}
#side{display:flex;flex-direction:column;gap:12px;width:min(460px,34vw);max-height:96vh}
body.port #game{flex-direction:column;justify-content:flex-start}
body.port #side{width:min(96vw,640px);max-height:none;flex:1;min-height:0}
.panel{border-radius:14px;background:linear-gradient(180deg,rgba(36,16,72,.92),rgba(14,5,32,.94));border:2px solid #3a2a6a;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#turn{padding:14px 12px;text-align:center;font-size:clamp(11px,1.15vw,20px);line-height:1.6;border-color:var(--pc);color:#fff;text-shadow:0 0 10px var(--pc);box-shadow:0 0 22px -6px var(--pc),0 8px 24px rgba(0,0,0,.45)}
#turn small{display:block;font-size:.6em;color:#d8d0ff;text-shadow:none;margin-top:6px}
#cardWrap{display:flex;align-items:center;gap:14px}
#card{--cw:clamp(96px,8.4vw,150px);position:relative;flex:0 0 auto;width:var(--cw);min-width:var(--cw);height:calc(var(--cw) * 1.4);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:calc(var(--cw) * .1);background:linear-gradient(155deg,#fffaf0 0%,#f6ead0 60%,#ecdcb8 100%);color:#2a1650;box-shadow:0 0 0 3px var(--pc),0 0 22px var(--pc),0 10px 22px rgba(0,0,0,.55);cursor:pointer;text-align:center;padding:8px}
#card::before{content:'';position:absolute;inset:calc(var(--cw) * .05);border:2px solid rgba(42,22,80,.18);border-radius:calc(var(--cw) * .07);pointer-events:none}
#card.back{background:radial-gradient(circle at 50% 42%,#5a2fa0 0%,#2a1356 55%,#170a33 100%);box-shadow:0 0 0 3px #b04bff,0 0 22px #b04bff,0 10px 22px rgba(0,0,0,.55);color:#fff}
#card.back::before{border-color:rgba(255,211,246,.35);background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px)}
#card b{position:relative;font-weight:normal;font-size:calc(var(--cw) * .36);line-height:1;color:#2a1650;text-shadow:0 2px 0 rgba(42,22,80,.15)}
#card b.red{color:#e8264a}
#card b.word{font-size:calc(var(--cw) * .11);color:#e8264a}
#card.back b{font-size:calc(var(--cw) * .1);color:#ffd3f6;text-shadow:0 0 6px #ff2bd6,0 0 14px #ff2bd6}
#card span{position:relative;font-size:calc(var(--cw) * .072);line-height:1.6;margin-top:calc(var(--cw) * .08)}
#card .ci{position:absolute;font-style:normal;font-size:calc(var(--cw) * .1);line-height:1;color:#2a1650}
#card .ci.red{color:#e8264a}
#card .tl{top:calc(var(--cw) * .09);left:calc(var(--cw) * .1)}
#card .br{bottom:calc(var(--cw) * .09);right:calc(var(--cw) * .1);transform:rotate(180deg)}
#card.flip{animation:flip .3s cubic-bezier(.4,0,.2,1)}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0) translateY(-6px)}100%{transform:scaleX(1)}}
#cardText{font-size:clamp(9px,.95vw,15px);line-height:1.9;color:#d8d0ff}
#opts{display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:0;flex:1;padding:4px}
.opt{display:flex;align-items:center;gap:6px;font-family:inherit;font-size:clamp(9px,.95vw,15px);line-height:1.6;text-align:left;padding:11px 12px;border-radius:12px;background:linear-gradient(180deg,rgba(32,14,64,.94),rgba(16,6,36,.94));color:#e8e0ff;border:2px solid #3a2a6a;cursor:pointer;outline:none;transition:border-color .12s,box-shadow .12s,transform .12s}
.opt .t{flex:1}
.opt .ar{font-family:inherit;font-size:clamp(10px,.8vw,13px);padding:7px 9px;border-radius:8px;background:#2a1650;color:#fff;border:2px solid #5a4a9a;cursor:pointer}
.opt.foc{border-color:var(--pc);color:#fff;box-shadow:0 0 16px -2px var(--pc);background:linear-gradient(180deg,rgba(52,22,96,.96),rgba(22,8,46,.96));transform:translateX(3px)}
.opt.big{justify-content:center;font-size:clamp(10px,1.1vw,17px);padding:15px}
#hint{font-size:clamp(8px,.75vw,12px);line-height:1.8;color:#8d82c8;text-align:center}
#topbtns{display:flex;gap:8px}
#topbtns button{flex:1;font-family:inherit;font-size:clamp(9px,.7vw,12px);padding:9px 6px;border-radius:10px;background:rgba(20,8,42,.7);color:#cfc6ff;border:2px solid #3a2a6a;cursor:pointer}
#topbtns button.on{color:var(--yellow);border-color:var(--yellow);box-shadow:0 0 10px -2px var(--yellow)}
/* ---------- menus ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;z-index:20;text-align:center;overflow-y:auto}
.screen.on{display:flex}
.screen.dim{background:rgba(6,1,13,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.logo{font-size:clamp(34px,10.5vw,128px);color:#ffd3f6;letter-spacing:.04em;white-space:nowrap;text-shadow:0 0 6px #fff,0 0 16px var(--pink),0 0 40px var(--pink),0 0 80px var(--pink);animation:buzz 6s infinite}
@keyframes buzz{0%,91%,93%,95%,100%{opacity:1}92%,94%{opacity:.35}}
.tagl{font-size:clamp(9px,1.3vw,16px);color:var(--yellow);line-height:1.8;max-width:760px;text-shadow:0 0 10px rgba(255,225,77,.5)}
.h{font-size:clamp(16px,2.6vw,32px);color:#fff;text-shadow:0 0 12px var(--pc)}
.menu{display:flex;flex-direction:column;gap:10px;min-width:min(440px,90vw)}
.btn{font-family:inherit;font-size:clamp(10px,1.2vw,16px);padding:15px 18px;border-radius:14px;background:linear-gradient(180deg,rgba(36,16,72,.92),rgba(14,5,32,.94));color:#fff;border:2px solid #5a4a9a;cursor:pointer;outline:none;transition:transform .12s,box-shadow .12s}
.btn.foc{border-color:#ff8af0;background:linear-gradient(180deg,#ff5fe4,#d61fb4);color:#14031f;box-shadow:0 0 22px var(--pink);transform:scale(1.02)}
.btn.mint{border-color:#2a6a5a}
.btn.mint.foc{border-color:#a8ffe4;background:linear-gradient(180deg,#7ff0cb,#3cc59a);box-shadow:0 0 22px #5fe0b7}
#picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;width:min(860px,94vw)}
.pk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;font-family:inherit;font-size:clamp(8px,.7vw,11px);line-height:1.5;color:#fff;border-radius:14px;background:linear-gradient(180deg,rgba(36,16,72,.92),rgba(14,5,32,.94));border:2px solid var(--c);cursor:pointer;outline:none;transition:transform .12s,box-shadow .12s}
.pk canvas{width:72px;height:72px}
.pk.taken{opacity:.25;cursor:default}
.pk.foc{box-shadow:0 0 20px var(--c);background:linear-gradient(180deg,rgba(56,24,104,.96),rgba(24,8,50,.96));transform:translateY(-4px)}
.how{max-width:800px;font-size:clamp(8px,.95vw,13px);line-height:2.1;color:#d8d0ff;text-align:left;padding:18px 22px;border-radius:16px;background:rgba(20,8,42,.7);border:2px solid #3a2a6a}
.how b{color:var(--yellow);font-weight:normal}
#mhint{font-size:clamp(8px,.7vw,11px);color:#8d82c8;line-height:1.8}
.credit{font-size:8px;color:#5a4f8a;margin-top:10px}
#winArt{width:144px;height:144px;filter:drop-shadow(0 0 18px var(--pc))}
#bro{position:fixed;left:50%;top:42%;z-index:30;transform:translate(-50%,-50%) scale(0);font-size:clamp(34px,9vw,110px);white-space:nowrap;color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--pc),0 0 60px var(--pc);pointer-events:none;opacity:0}
#bro.go{animation:bro 1s ease-out}
@keyframes bro{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:25;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="game">
  <canvas id="board" width="1140" height="1140"></canvas>
  <div id="side">
    <div id="topbtns"><button id="bSpeed">SPEED: NORMAL</button><button id="bSound">SOUND: ON</button><button id="bPause">PAUSE</button></div>
    <div id="turn" class="panel">-</div>
    <div id="cardWrap"><div id="card" class="back"><b>BRUH...</b><span>DRAW</span></div><div id="cardText"></div></div>
    <div id="opts"></div>
    <div id="hint"></div>
  </div>
</div>
<div class="screen on" id="sTitle">
  <div class="logo">BRUH...</div>
  <div class="tagl">BUMP YOUR BUDDIES FROM BEHIND AND SEND THEM HOME</div>
  <div class="menu" id="mTitle"></div>
  <div id="mhint"></div>
  <div class="credit">NEON BREAD STUDIOS &copy; 2026</div>
</div>
<div class="screen" id="sMenu"><div class="h" id="mHead"></div><div class="tagl" id="mSub"></div><div class="menu" id="mList"></div></div>
<div class="screen" id="sPick"><div class="h" id="pHead"></div><div class="tagl" id="pSub"></div><div id="picks"></div><div class="menu" id="pBack"></div></div>
<div class="screen dim" id="sHow"><div class="h">HOW TO PLAY</div><div class="how" id="howText"></div><div class="menu" id="howMenu"></div></div>
<div class="screen dim" id="sPause"><div class="h">PAUSED</div><div class="menu" id="pauseMenu"></div></div>
<div class="screen dim" id="sWin"><div class="h" id="winHead"></div><canvas id="winArt" width="288" height="288"></canvas><div class="tagl" id="winSub"></div><div class="menu" id="winMenu"></div></div>
<canvas id="confetti"></canvas>
<div id="bro">BRUH...</div>
<div id="scan"></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const TAU = Math.PI * 2;

// =====================================================================
// COLOUR + SHAPE HELPERS
// =====================================================================
function shade(hex, k) { const v = parseInt(hex.slice(1), 16); const f = c => Math.max(0, Math.min(255, Math.round(k > 1 ? c + (255 - c) * (k - 1) : c * k))); return '#' + [f(v >> 16), f((v >> 8) & 255), f(v & 255)].map(n => n.toString(16).padStart(2, '0')).join(''); }
function rgba(hex, a) { const v = parseInt(hex.slice(1), 16); return 'rgba(' + (v >> 16) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + a + ')'; }
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function lin(g, x0, y0, x1, y1, cols) { const gr = g.createLinearGradient(x0, y0, x1, y1); cols.forEach((c, i) => gr.addColorStop(i / (cols.length - 1), c)); return gr; }
function rad(g, x, y, r, c0, c1) { const gr = g.createRadialGradient(x - r * .35, y - r * .45, r * .08, x, y, r * 1.05); gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr; }

// =====================================================================
// PIECES — 11 character portraits, drawn in code (100x100 space)
// =====================================================================
const OL = '#170a26';
// fill + outline one shape: build() adds the path
function S(g, fill, lw, build) { g.beginPath(); build(); if (fill) { g.fillStyle = fill; g.fill(); } if (lw) { g.lineWidth = lw; g.strokeStyle = OL; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); } }
const E = (g, x, y, rx, ry, rot) => () => g.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
const R = (g, x, y, w, h, r) => () => { rr(g, x, y, w, h, r); };
function stroke(g, col, lw, build) { g.beginPath(); build(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); }
function shine(g, x, y, r) { S(g, '#fff', 0, E(g, x, y, r, r)); }
function glow(g, col, blur, fn) { g.save(); g.shadowColor = col; g.shadowBlur = blur; fn(); g.restore(); }
function torso(g, fill, top) { S(g, fill, 3, () => { g.moveTo(10, 106); g.bezierCurveTo(12, top + 6, 30, top, 50, top); g.bezierCurveTo(70, top, 88, top + 6, 90, 106); g.closePath(); }); }

const CHARS = [
  { id: 'chonx', name: 'CHONX', col: '#b04bff', art: g => {
    torso(g, lin(g, 0, 70, 0, 100, ['#a56af5', '#5a2aa8']), 72);
    S(g, lin(g, 0, 70, 0, 80, ['#6ff7ea', '#1fb8ab']), 3, E(g, 50, 75, 25, 6));
    [26, 74].forEach(x => { S(g, rad(g, x, 22, 11, '#f7b56c', '#c46f24'), 3, E(g, x, 23, 10.5, 10.5)); S(g, '#ff9fb6', 0, E(g, x, 24, 5.5, 5.5)); });
    S(g, rad(g, 50, 46, 31, '#f9bb76', '#cf7628'), 3, E(g, 50, 46, 31, 28));
    S(g, rad(g, 33, 57, 13, '#fff3dc', '#f1cf9e'), 2.5, E(g, 33, 57, 13, 11));
    S(g, rad(g, 67, 57, 13, '#fff3dc', '#f1cf9e'), 2.5, E(g, 67, 57, 13, 11));
    S(g, '#fbe2bc', 0, E(g, 50, 59, 9, 8));
    S(g, 'rgba(255,110,150,.45)', 0, E(g, 27, 55, 5, 3)); S(g, 'rgba(255,110,150,.45)', 0, E(g, 73, 55, 5, 3));
    [38, 62].forEach(x => { S(g, '#14081f', 0, E(g, x, 42, 4.6, 5.6)); shine(g, x - 1.5, 40, 1.7); });
    S(g, '#ff6f8f', 2, E(g, 50, 51, 3.8, 2.7));
    stroke(g, OL, 2, () => { g.moveTo(43, 56); g.quadraticCurveTo(46.5, 59.5, 50, 55); g.quadraticCurveTo(53.5, 59.5, 57, 56); });
    S(g, '#fff', 1.6, R(g, 47, 57, 6, 6, 1.5)); stroke(g, OL, 1.2, () => { g.moveTo(50, 57.5); g.lineTo(50, 62.5); });
  } },
  { id: 'baby', name: 'THE BABY', col: '#ff6b9d', art: g => {
    torso(g, lin(g, 0, 72, 0, 100, ['#ffffff', '#dcd0ee']), 76);
    S(g, '#ffb3cf', 2.5, R(g, 40, 80, 20, 6, 3));
    [19, 81].forEach(x => S(g, '#f2bd8c', 3, E(g, x, 49, 5, 7)));
    S(g, rad(g, 50, 46, 32, '#ffe0bd', '#eeae78'), 3, E(g, 50, 46, 32, 31));
    stroke(g, OL, 5, () => { g.moveTo(50, 17); g.bezierCurveTo(43, 7, 59, 4, 57, 13); });
    stroke(g, '#b9803d', 2.6, () => { g.moveTo(50, 17); g.bezierCurveTo(43, 7, 59, 4, 57, 13); });
    [39, 61].forEach(x => { S(g, '#fff', 2, E(g, x, 45, 6.5, 7.5)); S(g, '#4a2a14', 0, E(g, x + .5, 46, 4.3, 5)); S(g, '#14081f', 0, E(g, x + .5, 46.5, 2.2, 2.6)); shine(g, x - 1.2, 43.5, 1.6); });
    stroke(g, OL, 1.8, () => { g.moveTo(33, 36); g.quadraticCurveTo(39, 33, 44, 36); g.moveTo(56, 36); g.quadraticCurveTo(61, 33, 67, 36); });
    S(g, 'rgba(255,110,150,.5)', 0, E(g, 28, 56, 5.5, 3.5)); S(g, 'rgba(255,110,150,.5)', 0, E(g, 72, 56, 5.5, 3.5));
    stroke(g, '#ff6b9d', 3, () => { g.arc(50, 69, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); });
    S(g, lin(g, 0, 56, 0, 68, ['#ff9cc0', '#ff4f8e']), 2.5, E(g, 50, 62, 10, 6.5));
    S(g, '#ffd3e6', 2, E(g, 50, 62, 4, 3));
  } },
  { id: 'grandma', name: 'GRANDMA', col: '#ffcc4d', art: g => {
    torso(g, lin(g, 0, 70, 0, 100, ['#b48af0', '#6c3fb0']), 74);
    S(g, '#fff', 2.5, () => { g.moveTo(36, 74); g.lineTo(50, 86); g.lineTo(40, 90); g.closePath(); });
    S(g, '#fff', 2.5, () => { g.moveTo(64, 74); g.lineTo(50, 86); g.lineTo(60, 90); g.closePath(); });
    for (let i = 0; i < 7; i++) { const a = Math.PI * (.18 + i * .107); S(g, '#fffaf0', 1.2, E(g, 50 + Math.cos(a) * 15, 70 + Math.sin(a) * 9, 2.2, 2.2)); }
    S(g, rad(g, 50, 18, 12, '#ffffff', '#c9c3dc'), 3, E(g, 50, 17, 12, 9));
    S(g, rad(g, 50, 38, 32, '#ffffff', '#bdb6d4'), 3, E(g, 50, 39, 31, 25));
    S(g, rad(g, 50, 52, 22, '#fcd8b8', '#e2a77e'), 3, E(g, 50, 52, 21, 23));
    [[36, 32], [44, 29], [52, 29], [60, 31], [66, 35]].forEach(([x, y]) => S(g, rad(g, x, y, 6, '#ffffff', '#d4cee6'), 2, E(g, x, y, 5.5, 5)));
    [41, 59].forEach(x => { S(g, 'rgba(200,230,255,.35)', 3, E(g, x, 51, 7.5, 7)); S(g, '#2a1f2e', 0, E(g, x, 51.5, 2.3, 2.6)); shine(g, x - .8, 50.5, .9); });
    stroke(g, OL, 3, () => { g.moveTo(48.5, 50); g.quadraticCurveTo(50, 48, 51.5, 50); });
    S(g, 'rgba(255,110,140,.45)', 0, E(g, 33, 60, 4.5, 3)); S(g, 'rgba(255,110,140,.45)', 0, E(g, 67, 60, 4.5, 3));
    S(g, '#e0566e', 2, () => { g.moveTo(43, 63); g.quadraticCurveTo(50, 70, 57, 63); g.quadraticCurveTo(50, 65.5, 43, 63); });
    stroke(g, '#8a5a2e', 4, () => { g.moveTo(86, 64); g.lineTo(86, 104); g.moveTo(86, 64); g.quadraticCurveTo(86, 56, 79, 58); });
  } },
  { id: 'car', name: 'PED X-ING CAR', col: '#d4ff00', art: g => {
    [[20, 20], [72, 20], [20, 62], [72, 62]].forEach(([x, y]) => S(g, lin(g, x, 0, x + 8, 0, ['#3a3542', '#141018', '#3a3542']), 2, R(g, x, y, 8, 18, 3)));
    S(g, lin(g, 26, 0, 74, 0, ['#a81a26', '#ff4d4d', '#ff6a5e', '#ff4d4d', '#a81a26']), 3, R(g, 26, 10, 48, 82, 16));
    S(g, lin(g, 0, 28, 0, 44, ['#2c4a70', '#101a2c']), 2.5, R(g, 32, 28, 36, 15, 6));
    stroke(g, 'rgba(255,255,255,.45)', 2.5, () => { g.moveTo(37, 40); g.lineTo(46, 30); });
    S(g, lin(g, 0, 44, 0, 68, ['#ff7a6c', '#e8463c']), 2.5, R(g, 32, 44, 36, 24, 7));
    S(g, lin(g, 0, 68, 0, 80, ['#2c4a70', '#101a2c']), 2.5, R(g, 34, 69, 32, 10, 4));
    stroke(g, 'rgba(120,0,10,.55)', 2, () => { g.moveTo(42, 14); g.lineTo(42, 26); g.moveTo(58, 14); g.lineTo(58, 26); });
    glow(g, '#ffe14d', 8, () => { S(g, '#fff6a8', 2, E(g, 34, 14, 4, 2.6)); S(g, '#fff6a8', 2, E(g, 66, 14, 4, 2.6)); });
    S(g, '#ff1f3a', 2, R(g, 30, 85, 9, 4, 2)); S(g, '#ff1f3a', 2, R(g, 61, 85, 9, 4, 2));
    stroke(g, 'rgba(255,255,255,.35)', 3, () => { g.moveTo(31, 22); g.lineTo(31, 82); });
  } },
