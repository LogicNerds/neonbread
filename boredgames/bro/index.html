<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Bro! · Bored Games · Neon Bread</title>

<style>
:root{--pink:#ff2bd6;--cyan:#00e5ff;--yellow:#ffe14d;--purple:#b04bff;--pc:#ff2bd6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07010f;color:#fff;font-family:'Press Start 2P',monospace;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% 0%,#24103f 0%,#0b0218 60%,#07010f 100%)}
#scan{position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px)}
/* ---------- game layout: board + side panel ---------- */
#game{position:fixed;inset:0;display:none;align-items:center;justify-content:center;gap:2vmin;padding:2vmin}
#game.on{display:flex}
#board{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0f0522;border:4px solid #2a1650;box-shadow:0 0 30px rgba(176,75,255,.25);touch-action:none}
#side{display:flex;flex-direction:column;gap:12px;width:min(380px,34vw);max-height:96vh}
body.port #game{flex-direction:column;justify-content:flex-start}
body.port #side{width:min(96vw,640px);max-height:none;flex:1;min-height:0}
#turn{padding:12px;text-align:center;font-size:clamp(11px,1.4vw,16px);line-height:1.6;border:4px solid var(--pc);color:#fff;text-shadow:0 0 10px var(--pc);background:rgba(14,4,30,.9)}
#turn small{display:block;font-size:.62em;color:#cfc6ff;text-shadow:none;margin-top:4px}
#cardWrap{display:flex;align-items:center;gap:12px}
#card{flex:0 0 auto;width:clamp(86px,9vw,120px);min-width:clamp(86px,9vw,120px);height:clamp(120px,12.6vw,168px);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff6e0;color:#1a0f2e;border:4px solid #1a0f2e;box-shadow:0 0 0 3px var(--pc),0 0 18px var(--pc);cursor:pointer;text-align:center;padding:6px}
#card.back{background:repeating-linear-gradient(45deg,#2a1650 0 8px,#3a2272 8px 16px);box-shadow:0 0 0 3px #b04bff,0 0 18px #b04bff;color:#fff}
#card b{font-weight:normal;font-size:clamp(26px,3.2vw,44px);line-height:1}
#card b.word{font-size:clamp(12px,1.4vw,16px);color:#e8264a}
#card span{font-size:7px;line-height:1.6;margin-top:8px}
#card.flip{animation:flip .28s}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
#cardText{font-size:clamp(8px,.9vw,11px);line-height:1.9;color:#cfc6ff}
#opts{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;flex:1;padding:2px}
.opt{display:flex;align-items:center;gap:6px;font-family:inherit;font-size:clamp(8px,.9vw,11px);line-height:1.6;text-align:left;padding:10px;background:rgba(14,4,30,.92);color:#e8e0ff;border:3px solid #3a2a6a;cursor:pointer;outline:none}
.opt .t{flex:1}
.opt .ar{font-family:inherit;font-size:10px;padding:6px 8px;background:#2a1650;color:#fff;border:2px solid #5a4a9a;cursor:pointer}
.opt.foc{border-color:var(--pc);color:#fff;box-shadow:0 0 12px var(--pc)}
.opt.big{justify-content:center;font-size:clamp(10px,1.1vw,13px);padding:14px}
#hint{font-size:8px;line-height:1.8;color:#7d72b8;text-align:center}
#topbtns{display:flex;gap:8px}
#topbtns button{flex:1;font-family:inherit;font-size:9px;padding:8px;background:transparent;color:#cfc6ff;border:2px solid #3a2a6a;cursor:pointer}
#topbtns button.on{color:var(--yellow);border-color:var(--yellow)}
/* ---------- menus ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;z-index:20;text-align:center;overflow-y:auto}
.screen.on{display:flex}
.screen.dim{background:rgba(6,1,13,.86)}
.logo{font-size:clamp(46px,12vw,140px);color:#ffd3f6;letter-spacing:.06em;text-shadow:0 0 6px #fff,0 0 16px var(--pink),0 0 40px var(--pink),0 0 80px var(--pink);animation:buzz 6s infinite}
@keyframes buzz{0%,91%,93%,95%,100%{opacity:1}92%,94%{opacity:.35}}
.tagl{font-size:clamp(9px,1.4vw,15px);color:var(--yellow);line-height:1.8;max-width:760px;text-shadow:0 0 10px rgba(255,225,77,.5)}
.h{font-size:clamp(16px,3vw,30px);color:#fff;text-shadow:0 0 12px var(--pc)}
.menu{display:flex;flex-direction:column;gap:10px;min-width:min(420px,90vw)}
.btn{font-family:inherit;font-size:clamp(10px,1.3vw,14px);padding:14px 18px;background:rgba(14,4,30,.9);color:#fff;border:3px solid #5a4a9a;cursor:pointer;outline:none}
.btn.foc{border-color:var(--pink);background:var(--pink);color:#07010f;box-shadow:0 0 18px var(--pink)}
.btn.mint{border-color:#2a6a5a}
.btn.mint.foc{border-color:#5fe0b7;background:#5fe0b7;box-shadow:0 0 18px #5fe0b7}
#picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:min(820px,94vw)}
.pk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;font-family:inherit;font-size:8px;line-height:1.5;color:#fff;background:rgba(14,4,30,.9);border:3px solid var(--c);cursor:pointer;outline:none}
.pk canvas{width:64px;height:64px;image-rendering:pixelated}
.pk.taken{opacity:.25;cursor:default}
.pk.foc{box-shadow:0 0 18px var(--c);background:#1d0b3a;transform:translateY(-3px)}
.how{max-width:760px;font-size:clamp(8px,1vw,11px);line-height:2.1;color:#cfc6ff;text-align:left}
.how b{color:var(--yellow);font-weight:normal}
#mhint{font-size:8px;color:#7d72b8;line-height:1.8}
.credit{font-size:8px;color:#5a4f8a;margin-top:10px}
#bro{position:fixed;left:50%;top:42%;z-index:30;transform:translate(-50%,-50%) scale(0);font-size:clamp(40px,10vw,120px);color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--pc),0 0 60px var(--pc);pointer-events:none;opacity:0}

@keyframes bro{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg);opacity:1}70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
#rotate{display:none}
</style>

<body>
<div id="game">

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];

// =====================================================================
// PIECES — 11 character sets, pixel art drawn in code (16x16)
// =====================================================================
class PX {
  constructor(w, h) { this.w = w; this.h = h; this.p = new Array(w * h).fill(null); }
  set(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.p[y * this.w + x] = c; return this; }
  get(x, y) { return (x >= 0 && y >= 0 && x < this.w && y < this.h) ? this.p[y * this.w + x] : null; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  ell(cx, cy, rx, ry, c) { for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) this.set(x, y, c); } return this; }
  line(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) this.set(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c); return this; }
  outline(c) { const a = []; for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { if (this.get(x, y) !== null) continue; if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1)) a.push([x, y]); } a.forEach(([x, y]) => this.set(x, y, c)); return this; }
  canvas() { const c = document.createElement('canvas'); c.width = this.w; c.height = this.h; const x = c.getContext('2d'), img = x.createImageData(this.w, this.h); for (let i = 0; i < this.p.length; i++) { const col = this.p[i]; if (!col) continue; let r = col.slice(1); if (r.length === 3) r = r[0] + r[0] + r[1] + r[1] + r[2] + r[2]; const v = parseInt(r, 16); img.data[i * 4] = v >> 16; img.data[i * 4 + 1] = (v >> 8) & 255; img.data[i * 4 + 2] = v & 255; img.data[i * 4 + 3] = 255; } x.putImageData(img, 0, 0); return c; }
}
const CHARS = [
  { id: 'chonx', name: 'CHONX', col: '#b04bff', art: p => { p.rect(3, 9, 10, 6, '#7a3cc9'); p.rect(3, 9, 2, 6, '#5a2a99'); p.rect(3, 14, 10, 1, '#2ee6d6'); p.ell(9, 6, 4.6, 4.2, '#d9893b'); p.ell(10.8, 7.8, 2.2, 1.7, '#f6c98a'); p.ell(6, 2.2, 1.4, 1.5, '#d9893b'); p.ell(11.4, 2, 1.4, 1.5, '#d9893b'); p.set(6, 2, '#ff9fb0'); p.set(11, 2, '#ff9fb0'); p.set(10, 5, '#111'); p.set(13, 7, '#ff6f8f'); } },
  { id: 'baby', name: 'THE BABY', col: '#ff6b9d', art: p => { p.ell(8, 12, 4.5, 3.4, '#f6c48f'); p.ell(8, 13, 4.2, 2.4, '#ffffff'); p.ell(8.5, 6, 5, 4.8, '#f6c48f'); p.set(8, 1, '#c98a3a'); p.set(9, 1, '#c98a3a'); p.set(6, 6, '#111'); p.set(11, 6, '#111'); p.set(5, 8, '#ff8fa8'); p.set(12, 8, '#ff8fa8'); p.rect(8, 8, 2, 1, '#7a3b1a'); } },
  { id: 'grandma', name: 'GRANDMA', col: '#ffcc4d', art: p => { p.rect(4, 9, 8, 6, '#9b6bd6'); p.rect(4, 11, 8, 1, '#ffffff'); p.ell(8, 6, 3.8, 3.8, '#f2c39a'); p.ell(8, 3, 4.4, 2.4, '#e6e3ef'); p.ell(8, 1, 2, 1.4, '#e6e3ef'); p.rect(5, 6, 2, 1, '#2a1f2e'); p.rect(9, 6, 2, 1, '#2a1f2e'); p.set(7, 6, '#2a1f2e'); p.rect(7, 8, 2, 1, '#e06a7a'); p.line(13, 9, 13, 15, '#8a5a2e'); } },
  { id: 'car', name: 'PED X-ING CAR', col: '#d4ff00', art: p => { p.rect(3, 2, 10, 12, '#e53935'); p.rect(4, 3, 8, 3, '#16202e'); p.rect(4, 10, 8, 2, '#16202e'); p.rect(4, 6, 8, 4, '#ff6f61'); p.rect(2, 3, 1, 3, '#111'); p.rect(13, 3, 1, 3, '#111'); p.rect(2, 10, 1, 3, '#111'); p.rect(13, 10, 1, 3, '#111'); p.set(4, 14, '#ffe14d'); p.set(11, 14, '#ffe14d'); } },
  { id: 'karen', name: 'KAREN', col: '#00e5ff', art: p => { p.rect(4, 10, 8, 5, '#2f6fd1'); p.ell(8, 6, 5, 5, '#f2c14e'); p.ell(8, 7, 3.4, 4, '#f6c48f'); p.rect(5, 2, 6, 2, '#f2c14e'); p.line(5, 5, 7, 6, '#8a5a1a'); p.line(9, 6, 11, 5, '#8a5a1a'); p.set(6, 7, '#111'); p.set(10, 7, '#111'); p.rect(7, 9, 3, 2, '#7a1a1a'); } },
  { id: 'sling', name: 'SLINGSHOT', col: '#ff8a2b', art: p => { p.rect(7, 8, 3, 7, '#8b5a2b'); p.line(8, 9, 3, 2, '#8b5a2b'); p.line(9, 9, 13, 2, '#8b5a2b'); p.line(7, 9, 2, 3, '#a0692f'); p.line(10, 9, 14, 3, '#6b4423'); p.line(3, 2, 8, 6, '#ff2bd6'); p.line(13, 2, 8, 6, '#ff2bd6'); p.rect(7, 6, 3, 2, '#5a3a1a'); } },
  { id: 'brayn', name: 'BRAYN', col: '#e8264a', art: p => { p.ell(8, 6, 6.5, 5.5, '#e85a8a'); for (let k = 0; k < 3; k++) for (let x = 2; x < 15; x++) { const y = Math.round(2 + k * 3 + Math.sin(x * .8 + k)); if (p.get(x, y)) p.set(x, y, '#a8325f'); } p.ell(9, 11, 4, 3.6, '#efe6c8'); p.rect(7, 10, 1, 1, '#141414'); p.rect(10, 10, 1, 1, '#141414'); p.set(7, 10, '#7dff4a'); p.rect(7, 13, 4, 1, '#141414'); p.rect(10, 14, 1, 2, '#5dff3a'); } },
  { id: 'rat', name: '6-7 RAT', col: '#a8b0bc', art: p => { p.ell(8, 10, 5.5, 3.6, '#8a8f99'); p.ell(12.5, 7, 2.6, 2.4, '#8a8f99'); p.ell(10.5, 4.5, 1.4, 1.4, '#8a8f99'); p.set(10, 4, '#c98aa0'); p.set(13, 6, '#ff2a2a'); p.set(15, 8, '#c98aa0'); p.line(2, 11, 1, 7, '#c98aa0'); p.line(1, 7, 2, 5, '#c98aa0'); p.rect(6, 13, 1, 2, '#c98aa0'); p.rect(10, 13, 1, 2, '#c98aa0'); } },
  { id: 'clanker', name: 'CLANKER', col: '#3ddc97', art: p => { p.rect(3, 4, 10, 9, '#858c99'); p.rect(3, 4, 2, 9, '#6a707b'); p.rect(5, 7, 2, 2, '#ff2a2a'); p.rect(9, 7, 2, 2, '#ff2a2a'); p.rect(5, 11, 6, 1, '#2b2b2b'); p.rect(7, 1, 2, 3, '#cfd4de'); p.set(7, 0, '#ff2a2a'); p.set(8, 0, '#ff2a2a'); p.rect(1, 7, 2, 3, '#6a707b'); p.rect(13, 7, 2, 3, '#6a707b'); p.rect(5, 13, 2, 2, '#555'); p.rect(9, 13, 2, 2, '#555'); } },
  { id: 'van', name: 'GTA VAN', col: '#3b7bff', art: p => { p.rect(3, 1, 10, 14, '#ffcc4d'); p.rect(4, 2, 8, 3, '#9fe3ff'); p.rect(4, 6, 8, 7, '#fff3c4'); p.rect(4, 8, 8, 1, '#c0563c'); p.rect(4, 11, 8, 1, '#c0563c'); p.rect(2, 3, 1, 3, '#1c1820'); p.rect(13, 3, 1, 3, '#1c1820'); p.rect(2, 10, 1, 3, '#1c1820'); p.rect(13, 10, 1, 3, '#1c1820'); p.set(4, 15, '#ff4d4d'); p.set(11, 15, '#ff4d4d'); } },
  { id: 'manager', name: 'THE MANAGER', col: '#ff2bd6', art: p => { p.rect(3, 9, 10, 6, '#ffffff'); p.rect(7, 9, 2, 1, '#1565c0'); p.rect(7, 10, 2, 5, '#1565c0'); p.rect(10, 11, 2, 1, '#1565c0'); p.ell(8, 5.5, 3.8, 4, '#f6c48f'); p.ell(8, 2.4, 4, 2, '#5d4037'); p.rect(4, 2, 1, 4, '#5d4037'); p.rect(11, 2, 1, 4, '#5d4037'); p.set(6, 5, '#111'); p.set(10, 5, '#111'); p.rect(7, 7, 3, 1, '#7a1a1a'); } },
];
const SPR = {};
CHARS.forEach(c => { const p = new PX(16, 16); c.art(p); p.outline('#14081f'); SPR[c.id] = p.canvas(); });
const CH = id => CHARS.find(c => c.id === id);

// =====================================================================
// BOARD — 19x19 tiles, a 72-space loop round the edge, 6 seats
// =====================================================================
const N = 19, TS = 60, LOOP = 72, LANE = 5, SLIDE = 5;
const HOME = 100 + LANE + 1;       // pos codes: -1 start · 0..71 track (relative to your start) · 101..105 safety lane · 106 home
const tileXY = t => { t = ((t % LOOP) + LOOP) % LOOP; return t < 18 ? [t, 0] : t < 36 ? [18, t - 18] : t < 54 ? [18 - (t - 36), 18] : [0, 18 - (t - 54)]; };
const seatStart = s => 12 * s + 9;                   // the track tile a piece enters on
const absOf = (s, d) => (seatStart(s) + d) % LOOP;
const relOf = (s, abs) => ((abs - seatStart(s)) % LOOP + LOOP) % LOOP;
// per seat: which way the safety lane runs (inward), and where the start circle sits
const SEATS = [
  { lane: [0, 1], start: [10.5, 2.7] },     // top, x=9
  { lane: [-1, 0], start: [15.7, 4.6] },    // right, y=3
  { lane: [-1, 0], start: [15.7, 16.3] },   // right, y=15
  { lane: [0, -1], start: [8.5, 15.7] },    // bottom, x=9
  { lane: [1, 0], start: [3.3, 13.9] },     // left, y=15
  { lane: [1, 0], start: [3.3, 2.35] },      // left, y=3
];
function laneXY(s, k) { const [lx, ly] = tileXY(seatStart(s) - 2), [dx, dy] = SEATS[s].lane; return [lx + dx * k, ly + dy * k]; }   // k = 1..5, home at 6
// slides: one per stretch, starting 4 past each start, 5 tiles long. Everyone can use every slide.
const SLIDES = [0, 1, 2, 3, 4, 5].map(s => ({ s, from: (seatStart(s) + 4) % LOOP }));
const SLIDE_THEME = [
  { name: 'YEET THROW', a: '#ff6b9d', b: '#ffd3e6' }, { name: 'GTA ROAD', a: '#3a3a44', b: '#ffcc4d' }, { name: 'CLANKER CONVEYOR', a: '#5a6170', b: '#3ddc97' },
  { name: 'CROSSWALK', a: '#2a2a2a', b: '#ffffff' }, { name: 'CHECKOUT LANE', a: '#00a5b5', b: '#c9fbff' }, { name: 'BRAIN-ROT CHUTE', a: '#5dff3a', b: '#e85a8a' }];
const slideAt = abs => SLIDES.find(sl => sl.from === abs) || null;

// =====================================================================
// DECK — our own mix (45 cards)
// =====================================================================
const CARD_INFO = {
  1: 'LEAVE START, OR MOVE 1.', 2: 'LEAVE START, OR MOVE 2. THEN DRAW AGAIN.', 3: 'MOVE 3 FORWARD.', 4: 'MOVE 4 BACK.', 5: 'MOVE 5 FORWARD.',
  7: 'MOVE 7, OR SPLIT IT BETWEEN TWO PIECES.', 8: 'MOVE 8 FORWARD.', 10: 'MOVE 10 FORWARD, OR 1 BACK.', 11: 'MOVE 11 FORWARD, OR SWAP PLACES WITH ANY RIVAL PIECE.', 12: 'MOVE 12 FORWARD.',
  B: 'TAKE A PIECE OUT OF START AND DROP IT ON ANY RIVAL. THEY GO BACK TO START.',
};
function newDeck() { const d = []; const add = (c, n) => { for (let i = 0; i < n; i++) d.push(c); }; add(1, 5); [2, 3, 4, 5, 7, 8, 10, 11, 12, 'B'].forEach(c => add(c, 4)); return shuffle(d); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// =====================================================================
// RULES
// =====================================================================
const G = { state: 'title', mode: 'cpu', diff: 'normal', players: [], turn: 0, deck: [], card: null, opts: [], oi: 0, busy: false, fast: false, winner: null };
// one step along a player's path (null = can't)
function step(pos, dir) {
  if (pos < 0 || pos === HOME) return null;
  if (dir > 0) { if (pos > 100) return pos + 1 <= HOME ? pos + 1 : null; if (pos === 70) return 101; return pos === 71 ? 0 : pos + 1; }
  if (pos > 100) return pos === 101 ? 70 : pos - 1;
  return pos === 0 ? 71 : pos - 1;
}
function walk(pos, n) { const path = []; const dir = n > 0 ? 1 : -1; for (let i = 0; i < Math.abs(n); i++) { pos = step(pos, dir); if (pos == null) return null; path.push(pos); } return path; }

}
function cycle(d) { const r = G.opts[G.oi]; if (!r || !r.choices) return; r.ci = (r.ci + d + r.choices.length) % r.choices.length; Snd.sfx('nav'); renderOpts(); }

// animate the events on a working copy so the board shows each step

// character select: one player per character

// INPUT — keyboard, controller, mouse, touch

let lastDev = 'key', padPS = false;
function act(a) {
  Snd.unlock();

  }

    else if (a === 'd') { G.oi = (G.oi + 1) % G.opts.length; Snd.sfx('nav'); renderOpts(); }

addEventListener('keydown', e => {

  const k = e.key, m = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r', Enter: 'a', ' ': 'a', Escape: G.menu ? 'b' : 'p', Backspace: 'b', p: 'p', f: 'y' }[k];

// controller: edges only; anything held when the page opens is ignored until released

  else if (lastDev === 'touch') h = G.state === 'draw' ? 'TAP THE CARD OR THE BOARD TO DRAW' : 'TAP A MOVE TO PREVIEW IT, TAP AGAIN TO GO';
  else h = (G.state === 'draw' ? 'ENTER DRAW' : '&#9650;&#9660; PICK A MOVE &middot; &#9664;&#9654; CHANGE &middot; ENTER GO') + ' &middot; F SPEED &middot; ESC PAUSE';

// =====================================================================
// LAYOUT + LOOP
// =====================================================================

addEventListener('resize', layout);
let lastT = performance.now();

})();
