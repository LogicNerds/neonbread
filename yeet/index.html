<script id="nb-scores">
/* NB-SCORES START v1 — Neon Bread Arcade global leaderboards.
   Canonical copy: LogicNerds/neonbread/shared/nb-scores.js. Each game inlines this block
   between the NB-SCORES START / END markers so every game stays one self-contained file.
   Backend: Firestore (project neon-bread-arcade) over its REST API. No sign-in, no SDK. */
(function () {
  'use strict';
  if (window.NBScores) return;
  const PROJECT = 'neon-bread-arcade';
  const BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
  const GAMES = {
    chonx: { title: "CHONX '26", color: '#39ff6a' },
    yeet: { title: 'YEET THE BABY', color: '#ff6b9d' },
    gta: { title: 'GRANDMA THEFT AUTOMATIC', color: '#ffcc4d' },
    karen: { title: 'BODY THE KAREN', color: '#00e5ff' },
    cheekyops: { title: 'CHONX: CHEEKY OPS', color: '#ff2a3d' },
    pedxing: { title: 'PED X-ING', color: '#d4ff00' },
  };
  const ARCADE_URL = 'https://www.neonbreadent.com/';
  const NAME_LEN = 6;
  const CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const NAME_KEY = 'nb_name';

  // ---------------------------------------------------------------- name filter
  // Slurs are blocked; swearing is fine. Checked after undoing common letter swaps (0->O, 1->I ...).
  // The same lists live in the Firestore rules as a second line of defence.
  const SUB = ['nigg', 'nigr', 'niga', 'fagot', 'faggot', 'faggt', 'kike', 'kyke', 'trann', 'trany', 'retard', 'wetbac', 'beaner', 'raghea', 'chink'];
  const EXACT = ['nig', 'fag', 'fags', 'spic', 'spics', 'spick', 'coon', 'coons', 'gook', 'gooks', 'dyke', 'dykes', 'jap', 'japs', 'paki', 'pakis', 'wop', 'wops', 'kkk'];
  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '9': 'g' };
  function norm(s) { return s.toLowerCase().split('').map(c => LEET[c] || c).join(''); }
  function blocked(name) {
    const raw = name.toLowerCase(), n = norm(name), squeezed = n.replace(/(.)\1+/g, '$1');
    return [raw, n, squeezed].some(v => SUB.some(w => v.includes(w)) || EXACT.includes(v));
  }
  function clean(name) { return String(name || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_LEN); }

  // ---------------------------------------------------------------- weeks (reset Monday 00:00 Pacific)
  function weekKey(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' })
      .formatToParts(d || new Date()).forEach(x => { p[x.type] = x.value; });
    const back = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[p.weekday] || 0;
    const u = new Date(Date.UTC(+p.year, +p.month - 1, +p.day - back));
    return u.toISOString().slice(0, 10);
  }
  function weekLabel(k) {
    const [y, m, d] = k.split('-').map(Number);
    return 'WEEK OF ' + ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'][m - 1] + ' ' + d;
  }

  // ---------------------------------------------------------------- Firestore REST
  function req(path, body) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = ctl ? setTimeout(() => ctl.abort(), 9000) : 0;
    return fetch(BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(r => r.json().then(j => {
        clearTimeout(t);
        const err = j && (j.error || (Array.isArray(j) && j[0] && j[0].error));
        if (!r.ok || err) throw new Error((err && err.message) || ('HTTP ' + r.status));
        return j;
      }))
      .catch(e => { clearTimeout(t); throw e; });
  }
  const sv = v => ({ stringValue: v });
  const fEq = (f, v) => ({ fieldFilter: { field: { fieldPath: f }, op: 'EQUAL', value: sv(v) } });
  function whereFor(game, scope, above) {
    const fs = [fEq('game', game)];
    if (scope === 'week') fs.push(fEq('week', weekKey()));
    if (above != null) fs.push({ fieldFilter: { field: { fieldPath: 'score' }, op: 'GREATER_THAN', value: { integerValue: String(above) } } });
    return { compositeFilter: { op: 'AND', filters: fs } };
  }
  function newId() {
    const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; let s = '';
    const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(20)) : Array.from({ length: 20 }, () => Math.random() * 256);
    for (let i = 0; i < 20; i++) s += a[r[i] % a.length];
    return s;
  }
  function post(game, name, score) {
    const id = newId();
    return req(':commit', {
      writes: [{
        update: {
          name: 'projects/' + PROJECT + '/databases/(default)/documents/scores/' + id,
          fields: { game: sv(game), name: sv(name), score: { integerValue: String(score) }, week: sv(weekKey()) },
        },
        updateTransforms: [{ fieldPath: 'ts', setToServerValue: 'REQUEST_TIME' }],
        currentDocument: { exists: false },
      }],
    }).then(() => id);
  }
  function rowsOf(res) {
    return res.filter(r => r.document).map(r => {
      const f = r.document.fields || {};
      return { id: r.document.name.split('/').pop(), ref: r.document.name, name: (f.name && f.name.stringValue) || '???', score: +((f.score && f.score.integerValue) || 0) };
    });
  }
  function top(game, scope, limit) {
    return req(':runQuery', {
      structuredQuery: {
        from: [{ collectionId: 'scores' }], where: whereFor(game, scope),
        orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit: limit || 100,
      },
    }).then(rowsOf);
  }
  // Every all-time score, PAGE at a time. `after` is the last row of the previous page (cursor, so skipped rows aren't billed).
  const PAGE = 100;
  function page(game, after) {
    const q = {
      from: [{ collectionId: 'scores' }], where: whereFor(game, 'all'),
      orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }, { field: { fieldPath: '__name__' }, direction: 'DESCENDING' }],
      limit: PAGE,
    };
    if (after) q.startAt = { values: [{ integerValue: String(after.score) }, { referenceValue: after.ref }], before: false };
    return req(':runQuery', { structuredQuery: q }).then(rowsOf);
  }
  function rank(game, scope, score) {
    return req(':runAggregationQuery', {
      structuredAggregationQuery: { structuredQuery: { from: [{ collectionId: 'scores' }], where: whereFor(game, scope, score) }, aggregations: [{ alias: 'n', count: {} }] },
    }).then(r => 1 + +(((r[0] || {}).result || {}).aggregateFields || {}).n.integerValue || 0);
  }

  // ---------------------------------------------------------------- tickets
  // One wallet per device, shared by every game on neonbreadent.com (they all share localStorage).
  // A run pays score / rate (aiming for ~20-40 on an average run, min 5, max 150) plus bonuses.
  // Party mode never calls submit(), so party runs earn nothing.
  const TK_KEY = 'nb_tickets_v1';
  const TK_RATE = { chonx: 1000, cheekyops: 2000, yeet: 600, gta: 1500, karen: 400, pedxing: 1500 };
  const TK = { min: 5, max: 150, best: 25, top10: 50, firstToday: 10, golden: 500, goldenOdds: 1 / 40 };
  function pacificDay(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(d || new Date()).forEach(x => { p[x.type] = x.value; });
    return p.year + '-' + p.month + '-' + p.day;
  }
  function tkBlank() { return { v: 1, bal: 0, earned: 0, spent: 0, best: {}, day: {}, owned: {}, equip: {}, golden: 0, runs: 0 }; }
  function tkLoad() {
    try { const w = JSON.parse(localStorage.getItem(TK_KEY) || 'null'); if (w && typeof w.bal === 'number') return Object.assign(tkBlank(), w); } catch (e) { }
    return tkBlank();
  }
  function tkSave(w) { try { localStorage.setItem(TK_KEY, JSON.stringify(w)); } catch (e) { } tkFire(w); }
  const tkListeners = [];
  function tkFire(w) { tkListeners.forEach(f => { try { f(w); } catch (e) { } }); }
  // other tabs (the arcade open in one tab, a game in another) see changes too
  window.addEventListener('storage', e => { if (e.key === TK_KEY) tkFire(tkLoad()); });
  const Tickets = {
    rates: TK_RATE, rules: TK, today: pacificDay,
    wallet: tkLoad,
    balance() { return tkLoad().bal; },
    onChange(f) { tkListeners.push(f); },
    add(n) { const w = tkLoad(); n = Math.max(0, Math.floor(n)); w.bal += n; w.earned += n; tkSave(w); return w.bal; },
    spend(n) { const w = tkLoad(); n = Math.max(0, Math.floor(n)); if (w.bal < n) return false; w.bal -= n; w.spent += n; tkSave(w); return true; },
    owns(id) { return !!tkLoad().owned[id]; },
    // buy a prize: takes the tickets and records it in one save
    buy(id, price) { const w = tkLoad(); if (w.owned[id] || w.bal < price) return false; w.bal -= price; w.spent += price; w.owned[id] = Date.now(); tkSave(w); return true; },
    equipped(game, slot) { const e = tkLoad().equip[game] || {}; return slot ? e[slot] || null : e; },
    setEquip(game, slot, id) { const w = tkLoad(); w.equip[game] = w.equip[game] || {}; if (id) w.equip[game][slot] = id; else delete w.equip[game][slot]; tkSave(w); },
    // work out what a finished run pays (doesn't save)
    quote(game, score, ranks, feats) {
      const w = tkLoad(), lines = [];
      const base = Math.max(TK.min, Math.min(TK.max, Math.round(score / (TK_RATE[game] || 1000))));
      lines.push({ t: 'RUN PAYOUT', n: base });
      if (score > 0 && score > (w.best[game] || 0)) lines.push({ t: 'NEW PERSONAL BEST', n: TK.best });
      if (ranks && ranks.week && ranks.week <= 10) lines.push({ t: 'WEEKLY TOP 10', n: TK.top10 });
      if (w.day[game] !== pacificDay()) lines.push({ t: 'FIRST RUN TODAY', n: TK.firstToday });
      (feats || []).forEach(f => { if (f && f.n > 0) lines.push({ t: String(f.t), n: Math.floor(f.n) }); });
      if (Math.random() < TK.goldenOdds) lines.push({ t: 'GOLDEN TICKET!', n: TK.golden, gold: true });
      return { lines, total: lines.reduce((a, l) => a + l.n, 0) };
    },
    // pay it out: one save, so closing the page during the animation loses nothing
    payRun(game, score, q) {
      const w = tkLoad();
      w.bal += q.total; w.earned += q.total; w.runs++;
      w.best[game] = Math.max(w.best[game] || 0, score); w.day[game] = pacificDay();
      if (q.lines.some(l => l.gold)) w.golden++;
      tkSave(w); return w.bal;
    },
  };
  // ---- prize catalog (prices approved Nov 25 2026). Later stages add game cosmetics, cheat cards and seasonal items.
  // shelf: junk | collect | top. Every item here can be bought at the counter.
  Tickets.catalog = [
    { id: 'junk.spider', shelf: 'junk', name: 'SPIDER RING', price: 10 },
    { id: 'junk.trap', shelf: 'junk', name: 'FINGER TRAP', price: 15 },
    { id: 'junk.ball', shelf: 'junk', name: 'BOUNCY BALL', price: 20 },
    { id: 'junk.candy', shelf: 'junk', name: 'CANDY NECKLACE', price: 25 },
    { id: 'junk.pencil', shelf: 'junk', name: '"WORLD\'S OK-EST GAMER" PENCIL', price: 30 },
    { id: 'junk.sticky', shelf: 'junk', name: 'STICKY HAND', price: 35 },
    { id: 'junk.kazoo', shelf: 'junk', name: 'KAZOO', price: 40 },
    { id: 'junk.whoopee', shelf: 'junk', name: 'WHOOPEE CUSHION', price: 50 },
    { id: 'junk.slap', shelf: 'junk', name: 'SLAP BRACELET', price: 60 },
    { id: 'junk.mood', shelf: 'junk', name: 'MOOD RING', price: 75 },
    { id: 'junk.clanker', shelf: 'junk', name: 'MINI CLANKER KEYCHAIN', price: 120 },
    { id: 'junk.rat', shelf: 'junk', name: '6-7 RAT SQUISHY', price: 150 },
    { id: 'col.grandma', shelf: 'collect', name: 'GRANDMA KEYCHAIN', price: 400 },
    { id: 'col.brain', shelf: 'collect', name: 'BRAYN BRAIN STRESS BALL', price: 500 },
    { id: 'col.babybob', shelf: 'collect', name: 'BABY BOBBLEHEAD', price: 600 },
    { id: 'col.karenbob', shelf: 'collect', name: 'KAREN BOBBLEHEAD', price: 600 },
    { id: 'col.chonx', shelf: 'collect', name: 'CHONX PLUSH', price: 800 },
    { id: 'col.gerb', shelf: 'collect', name: 'GERB PLUSH', price: 900 },
    { id: 'col.mittens', shelf: 'collect', name: 'CHAIRMAN MITTENS PLUSH', price: 1200 },
    { id: 'top.giant', shelf: 'top', name: 'GIANT CHONX PLUSH', price: 10000 },
    { id: 'top.token', shelf: 'top', name: 'GOLD ARCADE TOKEN', price: 25000 },
  ];
  // game cosmetics: shelf = game id, slot = where it goes (one item per slot)
  const add = (game, slot, list) => list.forEach(([key, name, price]) => Tickets.catalog.push({ id: game + '.' + slot + '.' + key, shelf: game, game, slot, name, price }));
  add('yeet', 'hat', [['party', 'PARTY HAT', 150], ['beanie', 'PROPELLER BEANIE', 200], ['cap', 'BACKWARDS CAP', 200], ['helmet', 'BIKE HELMET', 250], ['chef', 'CHEF HAT', 300], ['cowboy', 'COWBOY HAT', 300], ['viking', 'VIKING HELMET', 600], ['crown', 'CROWN', 1000]]);
  add('yeet', 'face', [['shades', 'SUNGLASSES', 250], ['stache', 'FAKE MUSTACHE', 300], ['goggles', 'AVIATOR GOGGLES', 400], ['paci', 'BLING PACIFIER', 500]]);
  add('yeet', 'outfit', [['tutu', 'TUTU', 300], ['floaties', 'FLOATIES', 350], ['camo', 'CAMO DIAPER', 400], ['cape', 'SUPERHERO CAPE', 700], ['gold', 'GOLD DIAPER', 1500]]);
  add('yeet', 'trail', [['glitter', 'GLITTER TRAIL', 500], ['tp', 'TOILET-PAPER STREAMER', 600], ['rainbow', 'RAINBOW TRAIL', 800], ['fire', 'FIRE TRAIL', 1200]]);
  add('gta', 'hat', [['curlers', 'CURLERS', 200], ['visor', 'SUN VISOR', 200], ['helmet', 'BIKE HELMET', 250], ['church', 'FLOWERED CHURCH HAT', 300], ['tiara', 'TIARA', 800]]);
  add('gta', 'eyes', [['cateye', 'CAT-EYE GLASSES', 250]]);
  add('gta', 'feet', [['slippers', 'FUZZY SLIPPERS', 200]]);
  add('gta', 'neck', [['pearls', 'PEARLS', 300]]);
  add('gta', 'bag', [['handbag', 'GIANT HANDBAG', 350]]);

.nbs-foc{outline:5px solid #fff;outline-offset:5px}
.nbs-more{font-size:18px;color:#7d72b8;text-align:center;line-height:2.4}
.nbt-wrap{display:flex;gap:44px;align-items:flex-start;justify-content:center;width:100%}
.nbt-mach{display:flex;flex-direction:column;align-items:center;width:250px}
.nbt-slot{width:230px;height:34px;background:#05010e;border:6px solid #3a2f78;border-radius:8px;box-shadow:inset 0 6px 10px #000}
.nbt-strip{width:150px;height:0;overflow:hidden;margin-top:-10px;position:relative;border-left:4px dotted #06010d;border-right:4px dotted #06010d;
  background:repeating-linear-gradient(180deg,#ff8a2b 0 54px,#06010d 54px 56px,#ff8a2b 56px 60px)}
.nbt-strip span{display:block;height:60px;line-height:56px;font-size:13px;color:#5a1f00;letter-spacing:1px;text-align:center}
.nbt-strip.gold{background:repeating-linear-gradient(180deg,#ffe14d 0 54px,#06010d 54px 56px,#ffe14d 56px 60px)}
.nbt-side{display:flex;flex-direction:column;gap:18px;min-width:520px;text-align:left}
.nbt-count{font-size:84px;color:#ffe14d;text-shadow:0 0 22px #ffb000;text-align:left}
.nbt-lines{display:flex;flex-direction:column;gap:12px;min-height:260px}
.nbt-l{display:flex;justify-content:space-between;gap:24px;font-size:22px;color:#d9d0ff;opacity:0;transform:translateX(-20px);transition:opacity .2s,transform .2s}
.nbt-l.on{opacity:1;transform:none}
.nbt-l b{color:#ffe14d;font-weight:normal}
.nbt-l.gold{color:#ffe14d;text-shadow:0 0 14px #ffb000;font-size:26px}
.nbt-bal{font-size:20px;color:#00e5ff}
.nbp-list{width:100%;max-height:520px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:18px;text-align:left;scrollbar-width:thin;scrollbar-color:var(--nbc) transparent}
.nbp-t{font-size:18px;color:#00e5ff;margin-bottom:10px}
.nbp-items{display:flex;flex-wrap:wrap;gap:12px}
.nbp-i{display:flex;flex-direction:column;align-items:center;gap:8px;width:170px;padding:12px 8px;background:#140a32;border:4px solid #3a2f78;color:#e6deff;cursor:pointer;font-size:11px;line-height:1.6;text-align:center}
.nbp-i canvas{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges}
.nbp-i.on{border-color:#5fe0b7;background:#10302a}
.nbp-i b{font-weight:normal;font-size:10px;color:#5fe0b7}
.nbp-i em{font-style:normal;font-size:9px;color:#a99be0}
#nbsP.portrait .nbp-list{max-height:820px}
#nbsP.portrait .nbt-wrap{flex-direction:column;align-items:center;gap:24px}
#nbsP.portrait .nbt-side{min-width:0;width:100%}

<script>

// =====================================================================

// ---------------------------------------------------------------------
// PIXEL SPRITE BUILDER (same approach as Chonx '26): shapes are filled
// pixel-by-pixel, then auto-outlined, so everything reads as clean pixel art.
// ---------------------------------------------------------------------
class PX {
  constructor(w, h) { this.w = w; this.h = h; this.p = new Array(w * h).fill(null); }

const BG = {};
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function buildBackdrops() {
  // far: rolling hills, trees, neighbors' roofs (parallax 0.3)
  {
    const [c, x] = mkCanvas(VW, 90);
    const hill = (cx, r, col) => { x.fillStyle = col; for (let i = -r; i <= r; i++) { const hh = Math.round(Math.sqrt(r * r - i * i) * 0.45); x.fillRect(((cx + i) % VW + VW) % VW, 90 - hh, 1, hh); } };
    hill(40, 90, '#8fd18a'); hill(200, 110, '#7cc47a'); hill(330, 80, '#8fd18a');
    const roofs = [[60, '#c95f4f'], [150, '#5f7fc9'], [262, '#d18e3b'], [350, '#7a5fc9']];
    for (const [rx, rc] of roofs) {
      x.fillStyle = '#efe3c8'; x.fillRect(rx - 16, 58, 32, 24);
      x.fillStyle = rc; for (let i = 0; i < 14; i++) x.fillRect(rx - 18 + i, 58 - i, 36 - 2 * i, 1);
      x.fillStyle = '#7cc9ff'; x.fillRect(rx - 8, 64, 6, 6); x.fillRect(rx + 3, 64, 6, 6);
    }
    const tree = tx => { x.fillStyle = '#6b4423'; x.fillRect(tx - 1, 66, 3, 16); x.fillStyle = '#3f9a4a'; x.beginPath(); x.arc(tx, 60, 10, 0, 7); x.fill(); x.fillStyle = '#56b55e'; x.fillRect(tx - 5, 54, 4, 3); };
    [20, 105, 205, 240, 305, 372].forEach(tree);
    x.fillStyle = '#6fb86c'; x.fillRect(0, 80, VW, 10);
    BG.far = c;
  }
  // fence (parallax 0.7)
  {
    const [c, x] = mkCanvas(VW, 34);
    x.fillStyle = '#a8703c'; x.fillRect(0, 12, VW, 3); x.fillRect(0, 24, VW, 3);
    for (let px = 0; px < VW; px += 8) {
      x.fillStyle = '#1a0f08'; x.fillRect(px, 3, 7, 31);
      x.fillStyle = '#d99a5b'; x.fillRect(px + 1, 4, 5, 30); x.fillStyle = '#c4834a'; x.fillRect(px + 1, 4, 1, 30);
      x.fillStyle = '#1a0f08'; x.fillRect(px + 2, 1, 3, 2); x.fillStyle = '#d99a5b'; x.fillRect(px + 2, 2, 3, 2);
    }
    BG.fence = c;
  }
  // ground tile
  {
    const [c, x] = mkCanvas(32, 40);
    x.fillStyle = '#4caf50'; x.fillRect(0, 0, 32, 40);
    x.fillStyle = '#3e9443'; for (let i = 0; i < 18; i++) x.fillRect((i * 13) % 32, 8 + (i * 7) % 30, 2, 1);
    x.fillStyle = '#6fd36f'; x.fillRect(0, 0, 32, 2);
    x.fillStyle = '#6fd36f'; for (let i = 0; i < 32; i += 4) x.fillRect(i + (i % 8 ? 1 : 0), -1 + 0, 1, 1);
    x.fillStyle = '#2f7a35'; x.fillRect(0, 2, 32, 1);
    BG.ground = c;
  }
}

const Input = {
  keys: {}, pad: { on: false }, padPrev: {},
  edge: { yeet: false, pause: false },
  menu: { up: false, down: false, left: false, right: false, ok: false, back: false },
  touch: { left: false, right: false },
};
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  Input.keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') Input.edge.yeet = true;
  if (e.code === 'Escape' || e.code === 'KeyP') Input.edge.pause = true;
  if (e.code === 'KeyF') toggleFullscreen();
  if (e.code === 'ArrowUp' || e.code === 'KeyW') Input.menu.up = true;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') Input.menu.down = true;
  if (e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') Input.menu.ok = true;
  if (e.code === 'Escape' || e.code === 'Backspace') Input.menu.back = true;
  Audio2.unlock();
});
window.addEventListener('keyup', e => { Input.keys[e.code] = false; });
window.addEventListener('blur', () => { Input.keys = {}; releaseAllTouch(); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
// Only a real mouse click yeets on the game area. Taps there are ignored, so a thumb
// that slips off the YEET button can never fire an extra throw.
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  Input.edge.yeet = true; Audio2.unlock();
});

const DEAD = 0.5;
function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const p of pads) if (p && p.connected) { gp = p; break; }
  const P = Input.pad, prev = Input.padPrev;
  if (!gp) { P.on = false; return; }
  P.on = true;
  const bt = i => { const b = gp.buttons[i]; return !!b && (b.pressed || b.value > 0.35); };
  const ly = gp.axes[1] || 0, lx = gp.axes[0] || 0;
  P.lx = Math.abs(lx) > 0.25 ? lx : 0;
  P.left = bt(14); P.right = bt(15); P.lb = bt(4); P.rb = bt(5);
  const a = bt(0), b = bt(1), start = bt(9), back = bt(8);
  const vUp = bt(12) || ly < -DEAD, vDown = bt(13) || ly > DEAD, hL = bt(14) || lx < -DEAD, hR = bt(15) || lx > DEAD;
  if (a && !prev.a) { Input.edge.yeet = true; Input.menu.ok = true; }
  if (b && !prev.b) Input.menu.back = true;
  if (start && !prev.start) Input.edge.pause = true;
  if (vUp && !prev.vUp) Input.menu.up = true;
  if (vDown && !prev.vDown) Input.menu.down = true;
  if (hL && !prev.hL) Input.menu.left = true;
  if (hR && !prev.hR) Input.menu.right = true;
  if (a || b || start) Audio2.unlock();
  Input.padPrev = { a, b, start, back, vUp, vDown, hL, hR };
}

// ---- touch controls (pointer events, each control tracks its own pointer) ----
const touchHeld = {};
function bindTouch(id, onDown, onUp) {
  const el = $(id);
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (err) { }
    touchHeld[id] = e.pointerId; el.classList.add('down'); Audio2.unlock(); onDown();
  });
  const up = e => { if (touchHeld[id] !== e.pointerId) return; delete touchHeld[id]; el.classList.remove('down'); if (onUp) onUp(); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
function releaseAllTouch() { document.querySelectorAll('.tb.down').forEach(e => e.classList.remove('down')); for (const k in touchHeld) delete touchHeld[k]; Input.touch.left = Input.touch.right = false; }
function setupTouch() {
  bindTouch('tYeet', () => { Input.edge.yeet = true; });
  bindTouch('tPause', () => { Input.edge.pause = true; });
  bindTouch('tRestart', () => { if (G.state === 'playing') restartGame(); });
  $('cPause').addEventListener('click', e => { e.preventDefault(); if (G.state === 'playing') pauseGame(); });
  $('cRestart').addEventListener('click', e => { e.preventDefault(); if (G.state === 'playing') restartGame(); });
  $('nameDoneBtn').addEventListener('click', e => { e.preventDefault(); Audio2.unlock(); nameDone(); });
  $('nameBackBtn').addEventListener('click', e => { e.preventDefault(); Audio2.unlock(); nameBack(); });
}

// AUDIO — chiptune loop + SFX, all synthesized with Web Audio
// =====================================================================
const N = m => 440 * Math.pow(2, (m - 69) / 12);
const SONG = {
  bpm: 150,
  // 8 bars x 8 eighth-notes, MIDI (0 = rest)
  lead: [
    72, 0, 76, 79, 76, 0, 72, 74,   74, 0, 79, 83, 81, 79, 77, 74,
    76, 0, 72, 76, 81, 0, 79, 76,   77, 76, 74, 72, 74, 0, 0, 0,
    72, 74, 76, 79, 84, 0, 79, 76,  79, 77, 76, 74, 71, 0, 74, 0,
    77, 0, 81, 77, 76, 0, 79, 76,   74, 76, 74, 71, 67, 0, 0, 0,
  ],
  roots: [48, 43, 45, 41, 48, 43, 41, 43],
};
const Audio2 = {
  ctx: null, master: null, musicGain: null, unlocked: false,
  playing: false, nextTime: 0, stepIdx: 0, timer: null,
  unlock() {
    if (this.unlocked) { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.5; this.musicGain.connect(this.master);
      this.unlocked = true;
    } catch (e) { /* no web audio */ }
  },
  note(freq, t, dur, type, vol, dest) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.setValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  hat(t, vol) {
    const n = Math.floor(this.ctx.sampleRate * 0.04), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    s.connect(f); f.connect(g); g.connect(this.musicGain); s.start(t);
  },
  startMusic() {
    if (!this.ctx || this.playing) return;
    this.playing = true; this.stepIdx = 0; this.nextTime = this.ctx.currentTime + 0.08;
    this.timer = setInterval(() => this.schedule(), 25);
    this.setMusicVol(0.5);
  },
  stopMusic() { this.playing = false; clearInterval(this.timer); this.timer = null; },
  setMusicVol(v) { if (this.musicGain) this.musicGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05); },
  schedule() {
    if (!this.playing) return;
    const e8 = 60 / SONG.bpm / 2;
    while (this.nextTime < this.ctx.currentTime + 0.15) {
      const i = this.stepIdx % 64, bar = Math.floor(i / 8), t = this.nextTime;
      const m = SONG.lead[i];
      if (m) this.note(N(m), t, e8 * 0.9, 'square', 0.07, this.musicGain);
      const root = SONG.roots[bar];
      this.note(N(i % 2 ? root + 12 : root), t, e8 * 0.85, 'triangle', 0.2, this.musicGain);
      if (i % 2 === 1) this.hat(t, 0.05);
      if (i % 4 === 0) this.note(N(root + 19), t, e8 * 0.5, 'square', 0.025, this.musicGain); // sparkle
      this.nextTime += e8; this.stepIdx++;
    }
  },
  tone(f0, f1, dur, type = 'square', vol = 0.25, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.3, freq = 1200, delay = 0, type = 'lowpass') {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay, n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  sfx(name) {
    if (!this.ctx) return;
    switch (name) {
      case 'select': this.tone(660, 880, 0.06, 'square', 0.1); break;
      case 'lock': this.tone(520, 1040, 0.08, 'square', 0.14); break;
      case 'yeet': this.noise(0.35, 0.25, 2500, 0, 'bandpass'); this.tone(220, 900, 0.3, 'square', 0.14); break;
      case 'bonk': this.tone(900, 500, 0.06, 'square', 0.14); break;
      case 'splash': this.noise(0.5, 0.35, 1800); this.tone(600, 200, 0.2, 'sine', 0.12); break;
      case 'boing': this.tone(180, 700, 0.18, 'square', 0.16); this.tone(700, 300, 0.15, 'triangle', 0.12, 0.18); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.12, 'square', 0.14, 0.15 + i * 0.08)); break;
      case 'thud': this.noise(0.25, 0.4, 400); this.tone(140, 50, 0.25, 'square', 0.2); break;
      case 'roar': this.noise(0.7, 0.4, 500); this.tone(110, 60, 0.7, 'sawtooth', 0.22); break;
      case 'grab': this.tone(400, 1200, 0.15, 'square', 0.14); this.tone(1200, 300, 0.25, 'sawtooth', 0.1, 0.15); break;
      case 'chop': this.noise(0.06, 0.12, 300); break;
      case 'strike': this.tone(220, 110, 0.35, 'sawtooth', 0.22); this.tone(165, 82, 0.4, 'square', 0.12, 0.05); break;
      case 'round': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, f, 0.12, 'square', 0.14, i * 0.09)); break;
      case 'siren': for (let i = 0; i < 6; i++) this.tone(i % 2 ? 660 : 880, i % 2 ? 660 : 880, 0.24, 'square', 0.12, i * 0.25); break;
      case 'wind': this.noise(1.2, 0.15, 700, 0, 'bandpass'); break;
      case 'catch': [784, 988, 1175].forEach((f, i) => this.tone(f, f, 0.08, 'square', 0.13, i * 0.06)); break;
      case 'turn': [523, 784].forEach((f, i) => this.tone(f, f, 0.1, 'triangle', 0.16, i * 0.1)); break;
      case 'boom': this.noise(0.8, 0.5, 600); this.tone(120, 40, 0.6, 'square', 0.25); break;
      case 'rocket': this.noise(0.9, 0.2, 3000, 0, 'bandpass'); this.tone(400, 1600, 0.8, 'square', 0.08); break;
      case 'thump': this.noise(0.12, 0.25, 300); this.tone(120, 70, 0.12, 'square', 0.12); break;
      case 'boing2': this.tone(250, 900, 0.14, 'square', 0.15); this.tone(900, 1300, 0.08, 'triangle', 0.1, 0.12); break;
      case 'bark': this.tone(500, 260, 0.08, 'sawtooth', 0.18); this.tone(560, 280, 0.08, 'sawtooth', 0.16, 0.12); break;
      case 'rustle': this.noise(0.3, 0.2, 3500, 0, 'highpass'); break;
      case 'sizzle': this.noise(0.9, 0.22, 5000, 0, 'highpass'); this.tone(300, 120, 0.3, 'sawtooth', 0.12); break;
      case 'mulch': this.noise(0.7, 0.4, 900); this.tone(90, 60, 0.7, 'sawtooth', 0.22); break;
      case 'karen': [520, 470, 520, 470].forEach((f, i) => this.tone(f, f * 0.9, 0.12, 'sawtooth', 0.13, i * 0.13)); break;
      case 'honk': this.tone(420, 380, 0.12, 'sawtooth', 0.14); this.tone(400, 360, 0.12, 'sawtooth', 0.12, 0.15); break;
      case 'buzz': this.noise(0.05, 0.06, 2500, 0, 'bandpass'); break;

  }
};

const ITEM_NAMES = {
  trampoline: 'TRAMPOLINE', castle: 'BOUNCY CASTLE', dog: 'GOLDEN RETRIEVER', blower: 'LEAF BLOWER DAD', clothes: 'CLOTHESLINE', flamingo: 'FLAMINGO',
  diaper: 'DIAPER DETONATION', slide: "SLIP 'N SLIDE", ramp: 'KIDDIE RAMP', rocket: 'BOTTLE ROCKET',
  grill: 'BBQ GRILL', mower: 'ROBOT MOWER', tree: 'TREE', bear: 'BEAR', karen: 'HOA KAREN',
};
// half-width used for spacing (blower's air stream and the mower's patrol are included)
const ITEM_HALF = { trampoline: 17, castle: 22, dog: 13, blower: 12, clothes: 21, flamingo: 12, diaper: 9, slide: 36, ramp: 17, rocket: 6, grill: 11, mower: 34, tree: 28, bear: 16, karen: 10 };
const PTS_PER_FT = 10, PTS_PER_BOUNCE = 100;
const PERIL_CHANCE = 0.12;         // share of yard items that are peril
const AIR_DRAG = 0.996, MAX_VX = 8; // so bounce chains always wind down
const TIRED_STEPS = 60 * 18;        // after 18s of one throw, bouncers stop working

let items = [], flock = null, grabber = null, genX = 0;

// ---- identical conditions: every player's throw N uses the same seed (yard, random event, flamingo bounces) ----
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RNG = { yard: Math.random, ev: Math.random, phys: Math.random };
const sr = (g, a, b) => a + g() * (b - a);
const spick = (g, arr) => arr[Math.floor(g() * arr.length)];
function sshuffle(g, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(g() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const throwSeed = () => (G.seeds && G.seeds[G.round - 1]) || 1;
function newSeeds() { G.seeds = Array.from({ length: ROUNDS }, () => (Math.random() * 4294967296) >>> 0 || 1); }
// triangle wave in [-A, A], starting at 0 and rising (mower patrols / bear pacing, timed from the launch)
const tri = (u, A) => A - Math.abs((((u + A) % (4 * A)) + 4 * A) % (4 * A) - 2 * A);
const MAX_CATCHES = 3;

// pick this round's mix: 5 of the 10 bouncers + 3 of the 5 perils
function buildRound() {
  RNG.yard = mulberry32(throwSeed());
  G.mixB = sshuffle(RNG.yard, BOUNCERS).slice(0, 5);
  G.mixP = sshuffle(RNG.yard, PERILS).slice(0, 3);
  items = []; genX = P_X + 90;
  generateItems(P_X + 900);
}
function generateItems(toX) {
  while (genX < toX) {
    const peril = genX > P_X + 160 && RNG.yard() < PERIL_CHANCE;
    const kind = spick(RNG.yard, peril ? G.mixP : G.mixB);
    const hw = ITEM_HALF[kind];
    const x = Math.round(genX + hw);
    items.push(makeItem(kind, x));
    genX = x + hw + sr(RNG.yard, 36, 105);
  }
}
function makeItem(kind, x) {
  const it = { kind, x, cd: 0, anim: 0, used: false, inStream: false };
  if (kind === 'mower') { it.dir = 1; it.mx = x; }
  if (kind === 'bear') { it.home = x; it.d0 = RNG.yard() < 0.5 ? 1 : -1; it.dir = it.d0; }
  return it;
}

function resetBaby() {
  baby = { x: P_X + 1, y: GY - 40, vx: 0, vy: 0, rot: 0, spin: 0, r: 4, state: 'held', flash: 0, trail: 0, onGround: false, ride: 0, steps: 0 };
  parentFrame = 'ready';
  G.event = null; grabber = null; flock = null; G.bounces = 0; G.liveFt = 0;
}

function resetPlayerStats() { G.round = 1; G.throws = []; G.totalBounces = 0; G.score = 0; G.distance = 0; G.catches = 0; }
// SOLO, or (re)start a PARTY game with the same players. Fresh seeds every game.
function newGame() {
  hideScreens();
  G.state = 'playing'; G.nextRound = false; G.flashScreen = 0; G.best = Best.get();
  resetPlayerStats(); newSeeds();
  particles.length = 0; floaters.length = 0; G.caption = null; G.banner = null;
  Audio2.unlock(); Audio2.startMusic(); Audio2.setMusicVol(0.5);
  if (G.mode === 'party') {
    G.players.forEach(pl => { pl.throws = []; pl.score = 0; pl.distance = 0; pl.bounces = 0; pl.done = false; pl.posted = false; });
    G.cur = 0; showTurnCard();
  } else startRound(true);
  clearEdges(); setTouchUI(true);
}
function startSolo() { G.mode = 'solo'; G.players = null; newGame(); }
function restartGame() { Audio2.sfx('select'); newGame(); }

function startRound(first) {
  buildRound(); resetBaby(); G.catches = 0; G.flyT = 0;
  Cam.x = AIM_CAM_X; Cam.y = 0;
  const who = G.mode === 'party' ? curPlayer().name + ': ' : '';
  G.banner = { title: who + 'THROW ' + G.round + ' OF ' + ROUNDS, sub: 'GO AS FAR AS YOU CAN', list: 'IN THE YARD: ' + G.mixB.concat(G.mixP).map(k => ITEM_NAMES[k]).join(' · '), t: 150, max: 150 };
  if (!first) Audio2.sfx('round');
  startAim();
}
function startAim() {
  G.phase = 'power'; G.powerPos = 0; G.powerDir = 1; parentFrame = 'ready';
  baby.state = 'held';
}

// power -> distance on a gentle curve (soft tosses get more room on the meter); full power ~2.5 screens before bouncing
const RANGE_MIN = 40, RANGE_MAX = 960, POWER_CURVE = 1.35;
function launch() {
  const v = Math.sqrt(GRAV * (RANGE_MIN + (RANGE_MAX - RANGE_MIN) * Math.pow(G.powerValue / 100, POWER_CURVE)));
  const deg = 5 + G.angleValue * 0.8;                 // 5° (flat) .. 85° (steep)
  const a = deg * Math.PI / 180;
  baby.vx = Math.cos(a) * v; baby.vy = -Math.sin(a) * v;
  baby.state = 'fly'; baby.spin = rand(-0.18, 0.18) || 0.1;
  parentFrame = 'throw';
  G.phase = 'flying'; G.bounces = 0; G.flyT = 0; G.liveFt = 0;
  Audio2.sfx('yeet');
  showCaption(pick(launchCaptions));
  // random events (rolled at launch) — one per throw at most. Seeded per throw: every player, and every re-throw
  // after a catch, gets the same event in the same spot.
  const seed = throwSeed();
  RNG.ev = mulberry32(seed ^ 0x9e3779b9); RNG.phys = mulberry32(seed ^ 0x85ebca6b);
  const er = (a, b) => sr(RNG.ev, a, b);
  const roll = RNG.ev();
  const skyY = () => GY - er(60, 190);
  const P_DRONE = 1 / 12, P_GEESE = 1 / 6;
  if (roll < CHANCE_HELI) {
    G.event = { type: 'heli', name: 'HELICOPTER MOM', emoji: '🚁', t: 120 };
    grabber = { kind: 'heli', x: baby.x + er(160, 360), y: skyY(), vx: -er(0.8, 1.3), t: 0, grabbed: false };
  } else if (roll < CHANCE_HELI + P_DRONE) {
    G.event = { type: 'drone', name: 'DELIVERY DRONE', emoji: '📦', t: 120 };
    grabber = { kind: 'drone', x: baby.x + er(160, 360), y: skyY(), vx: -er(1.0, 1.5), t: 0, grabbed: false };
  } else if (roll < CHANCE_HELI + P_DRONE + P_GEESE) {
    G.event = { type: 'geese', name: 'ANGRY GEESE', emoji: '🪿', t: 120 };
    flock = { x: baby.x + er(180, 360), y: skyY(), vx: -1.5, t: 0, birds: [[0, 0], [9, -6], [9, 6], [18, -12], [18, 12]].map(([dx, dy]) => ({ dx, dy, hit: false })) };
  } else if (roll < CHANCE_HELI + P_DRONE + P_GEESE + CHANCE_WIND) {
    const f = (RNG.ev() < 0.5 ? -1 : 1) * er(0.01, 0.025);
    G.event = { type: 'wind', name: 'GUSTY WIND', emoji: '🌪️', t: 120, force: f };
    Audio2.sfx('wind');
  }
}

// circle (baby) vs axis-aligned box: push out + bounce
function collideBox(bx, by, bw, bh) {
  const cx = clamp(baby.x, bx, bx + bw), cy = clamp(baby.y, by, by + bh);
  let dx = baby.x - cx, dy = baby.y - cy, d2 = dx * dx + dy * dy;
  if (d2 >= baby.r * baby.r) return false;
  let d = Math.sqrt(d2);
  if (d < 0.0001) {
    const l = baby.x - bx, r = bx + bw - baby.x, t = baby.y - by;
    if (t <= l && t <= r) { dx = 0; dy = -1; } else if (l < r) { dx = -1; dy = 0; } else { dx = 1; dy = 0; }
    d = 0;
  } else { dx /= d; dy /= d; }
  baby.x += dx * (baby.r - d); baby.y += dy * (baby.r - d);
  const vn = baby.vx * dx + baby.vy * dy;
  if (vn < 0) { baby.vx -= 1.55 * vn * dx; baby.vy -= 1.55 * vn * dy; baby.vx *= 0.9; }
  baby.spin = -baby.spin * 0.8; baby.flash = 6; baby.onGround = false;
  if (Math.abs(vn) > 0.6) { Audio2.sfx('bonk'); burst(baby.x, baby.y, 6, ['#ffffff', '#ffe14d'], 1.4, 18); }
  return true;
}
const inBox = (x0, y0, x1, y1) => baby.x + baby.r > x0 && baby.x - baby.r < x1 && baby.y + baby.r > y0 && baby.y - baby.r < y1;

// a bouncer hit: +100 each, chained callouts
function bounced(it, label) {
  G.bounces++; it.anim = 24; baby.flash = 6; baby.onGround = false;
  floatText(baby.x, baby.y - 14, G.bounces > 1 ? G.bounces + 'X BOUNCE!' : label, '#ffe14d', 70);
  Audio2.sfx('boing2'); shake(2);
  burst(baby.x, baby.y + 3, 10, ['#ffffff', '#ffe14d', '#ff6b9d'], 1.8, 22);
}
// pop the baby upward off a bouncy surface (works whether it drops in from above or skids in along the grass)
function popUp(top, minUp, keep) {
  minUp *= Math.pow(0.93, G.bounces);        // each bounce in a chain gives a little less, so chains wind down
  baby.y = top - baby.r;
  baby.vy = -Math.max(Math.abs(baby.vy) * keep, minUp, Math.abs(baby.vx) * 0.6);
}

// returns true if the throw ended
function itemHit(it, py) {
  const x = it.x;
  if (it.cd > 0) return false;
  if (baby.steps > TIRED_STEPS && BOUNCERS.includes(it.kind)) return false;   // very long throws: let it come down
  switch (it.kind) {
    case 'trampoline': {
      const top = GY - 9;
      if (Math.abs(baby.x - x) < 15 && baby.y + baby.r >= top && (baby.vy >= 0 || baby.onGround)) { popUp(top, 4.6, 0.85); it.cd = 8; bounced(it, 'BOING!'); }
      return false;
    }
    case 'castle': {
      const top = GY - 22;
      if (Math.abs(baby.x - x) < 20 && baby.y + baby.r >= top && (baby.vy >= 0 || baby.onGround)) { popUp(top, 3.8, 0.8); baby.vx *= 0.95; it.cd = 8; bounced(it, 'BOUNCE!'); }
      return false;
    }
    case 'dog':
      if (!it.used && baby.vy >= 0 && Math.abs(baby.x - x) < 16 && baby.y > GY - 34) {
        it.used = true; baby.vy = -4.8; baby.vx = Math.max(baby.vx, 0) + 4; bounced(it, 'FETCH!'); Audio2.sfx('bark');
      }
      return false;
    case 'clothes': {
      const lineY = GY - 30;
      if (baby.vy > 0 && Math.abs(baby.x - x) < 18 && py <= lineY && baby.y >= lineY) {
        baby.y = lineY - 1; baby.vy = -Math.max(Math.abs(baby.vy) * 0.95, 4.2); baby.vx *= 1.05; it.cd = 10; bounced(it, 'SLINGSHOT!');
      }
      return false;
    }
    case 'flamingo': {
      const cx = x, cy = GY - 12, R = 10 + baby.r;
      let dx = baby.x - cx, dy = baby.y - cy; const d = Math.hypot(dx, dy);
      if (d < R) {
        dx /= d || 1; dy /= d || 1;
        baby.x = cx + dx * R; baby.y = cy + dy * R;
        const vn = baby.vx * dx + baby.vy * dy;
        if (vn < 0) { baby.vx -= 2 * vn * dx; baby.vy -= 2 * vn * dy; }
        const a = Math.atan2(baby.vy, baby.vx) + sr(RNG.phys, -0.6, 0.6), sp = Math.max(Math.hypot(baby.vx, baby.vy), 4.5);
        baby.vx = Math.cos(a) * sp; baby.vy = Math.sin(a) * sp;
        if (baby.vy > -1.5) baby.vy = -Math.abs(baby.vy) - 1.5;   // never slaps it straight into the dirt
        it.cd = 12; bounced(it, 'BOING?!');
      }
      return false;
    }
    case 'diaper':
      if (!it.used && Math.hypot(baby.x - x, baby.y - (GY - 7)) < 9 + baby.r) {
        it.used = true; baby.vy = -7.5; baby.vx = Math.max(baby.vx, 0) + 4.5;
        bounced(it, 'KABOOM!'); Audio2.sfx('boom'); shake(7); G.flashScreen = 6;
        burst(x, GY - 8, 40, ['#ffd23a', '#ff8a00', '#8b5a2b', '#ffffff'], 3.4, 40);
      }
      return false;
    case 'slide':     // handled on ground contact in updateFlight
      return false;
    case 'ramp': {
      const x0 = x - 16, surf = GY - 14 * clamp((baby.x - x0) / 32, 0, 1);
      if (baby.x > x0 && baby.x < x + 16 && baby.y + baby.r >= surf) {
        if (baby.vx > 0) {
          const sp = Math.max(Math.hypot(baby.vx, baby.vy), 3);
          baby.y = surf - baby.r; baby.vx = sp * 0.8; baby.vy = -sp * 0.6;
          it.cd = 15; bounced(it, 'RAMP!');
        } else collideBox(x + 14, GY - 14, 2, 14);
      }
      return false;
    }
    case 'rocket':
      if (!it.used && inBox(x - 4, GY - 20, x + 4, GY)) {
        it.used = true; baby.ride = 50; baby.state = 'fly'; bounced(it, 'BOTTLE ROCKET!'); Audio2.sfx('rocket');
      }
      return false;
    case 'grill':
      if (inBox(x - 8, GY - 19, x + 8, GY)) { endThrow('grill', it); return true; }
      return false;
    case 'mower':
      if (inBox(it.mx - 10, GY - 9, it.mx + 10, GY)) { endThrow('mower', it); return true; }
      return false;
    case 'karen':
      if (inBox(x - 6, GY - 31, x + 6, GY)) { endThrow('karen', it); return true; }
      return false;
    case 'bear':
      if (inBox(x - 10, GY - 30, x + 10, GY)) { endThrow('bear', it); return true; }
      return false;
    case 'tree': {
      collideBox(x - 4, GY - 42, 8, 42);
      const cx = x, cy = GY - 66, R = 24 + baby.r;
      let dx = baby.x - cx, dy = baby.y - cy; const d = Math.hypot(dx, dy);
      if (d < R && baby.y < cy) {                 // lower half of the leaves lets the baby fall through
        dx /= d || 1; dy /= d || 1;
        if (dy < -0.55 && baby.vy > 0) { endThrow('tree', it); return true; }   // came down into the leaves
        baby.x = cx + dx * R; baby.y = cy + dy * R;
        const vn = baby.vx * dx + baby.vy * dy;
        if (vn < 0) { baby.vx -= 1.6 * vn * dx; baby.vy -= 1.6 * vn * dy; }
        it.cd = 8; it.anim = 16; baby.flash = 6; Audio2.sfx('rustle');
        burst(baby.x, baby.y, 10, ['#3f9a4a', '#56b55e', '#2f7a35'], 1.6, 26);
      }
      return false;
    }
  }
  return false;
}

function onSlide() { for (const it of items) if (it.kind === 'slide' && Math.abs(baby.x - it.x) < 36) return it; return null; }

function updateFlight() {
  baby.steps++;
  generateItems(baby.x + 700);
  if (baby.ride > 0) {                     // riding a bottle rocket
    baby.ride--; baby.vx = 6.5; baby.vy = -0.7;
    particles.push({ x: baby.x - 5, y: baby.y + 2, vx: -1.5, vy: rand(-0.4, 0.4), life: 20, max: 20, c: pick(['#ffd23a', '#ff8a00', '#ffffff']), g: 0, s: 2 });
  } else baby.vy += GRAV;
  if (G.event && G.event.type === 'wind') baby.vx += G.event.force;
  if (!baby.onGround && baby.ride <= 0) baby.vx *= baby.steps > TIRED_STEPS ? 0.985 : AIR_DRAG;
  baby.vx = clamp(baby.vx, -MAX_VX, MAX_VX);
  for (const it of items) if (it.kind === 'blower') {
    const inside = baby.x > it.x + 8 && baby.x < it.x + 100 && baby.y > GY - 46 && baby.y < GY - 2;
    if (inside && (it.blowT = (it.blowT || 0) + 1) < 70) { baby.vx += 0.3; baby.vy -= 0.2; baby.onGround = false; if (!it.inStream) { it.inStream = true; bounced(it, 'BLOWN!'); } }
  }
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(baby.vx), Math.abs(baby.vy)) / 1.5));
  for (let i = 0; i < n; i++) {
    const py = baby.y;
    baby.x += baby.vx / n; baby.y += baby.vy / n;
    for (const it of items) if (Math.abs(it.x - baby.x) < 70 && itemHit(it, py)) return;
    // the parent catches it if it comes back to him from the belt up (legs are see-through)
    if (G.catches < MAX_CATCHES) {
      const upper = baby.x + baby.r > P_X - 8 && baby.x - baby.r < P_X + 8 && baby.y + baby.r > GY - 36 && baby.y - baby.r < GY - 13;
      if (!upper) baby.clear = true;
      else if (baby.clear) { caught(); return; }
    }
    if (grabber && !grabber.grabbed && Math.hypot(baby.x - (grabber.x - 4), baby.y - (grabber.y + 8)) < 12) { endThrow(grabber.kind); return; }
    if (flock) for (const b of flock.birds) {
      if (!b.hit && Math.hypot(baby.x - (flock.x + b.dx), baby.y - (flock.y + b.dy)) < 9) {
        b.hit = true; baby.vx = baby.vx * 0.5 - 1.5; baby.vy = Math.min(baby.vy, 0) - 2.2; baby.flash = 6; baby.ride = 0;
        floatText(baby.x, baby.y - 12, 'HONK!', '#ffffff', 60); Audio2.sfx('honk'); shake(2);
        burst(baby.x, baby.y, 12, ['#ffffff', '#cfcfcf', '#8a7a66'], 1.8, 26);
      }
    }
    // the grass: bounce, then skid to a stop
    if (baby.y + baby.r >= GY && baby.vy < 0) baby.y = GY - baby.r;   // just launched off the grass: don't cancel it
    else if (baby.y + baby.r >= GY) {
      baby.y = GY - baby.r;
      const slide = onSlide();
      if (baby.vy > 1.5 && !slide) {
        baby.vy = -baby.vy * 0.45; baby.vx *= 0.82; baby.spin = rand(-0.2, 0.2);
        Audio2.sfx('thump'); burst(baby.x, GY, 8, ['#8b5a2b', '#6fd36f'], 1.2, 20);
        if (Math.abs(baby.vy) > 2.5) shake(2);
      } else {
        baby.vy = 0; baby.onGround = true;
        if (slide && !slide.used) { slide.used = true; bounced(slide, "SLIP 'N SLIDE!"); baby.onGround = true; }
      }
    }
    if (baby.x < -170) { endThrow('rest'); return; }
  }
  if (baby.onGround) {
    const slide = onSlide();
    if (slide) {                             // speeds up instead of slowing down
      baby.vx = Math.min(baby.vx + 0.14, 9);
      if (G.t % 2 === 0) particles.push({ x: baby.x, y: GY - 1, vx: rand(-0.5, 0.2), vy: -rand(0.5, 1.4), life: 22, max: 22, c: '#9fe3ff', g: 0.08, s: 2 });
    } else {
      baby.vx *= 0.975; baby.vx -= Math.sign(baby.vx) * 0.015;
      if (G.t % 4 === 0 && Math.abs(baby.vx) > 0.6) particles.push({ x: baby.x, y: GY - 1, vx: -baby.vx * 0.2, vy: -0.4, life: 16, max: 16, c: '#6fd36f', g: 0.05, s: 2 });
    }
    baby.rot = lerp(baby.rot, 0, 0.1);
    if (Math.abs(baby.vx) < 0.1) { endThrow('rest'); return; }
  } else baby.rot += baby.spin;
  baby.still = (Math.abs(baby.vx) < 0.35 && baby.ride <= 0) ? (baby.still || 0) + 1 : 0;   // not getting anywhere
  if (baby.still > 150 || baby.steps > 60 * 30) { endThrow('rest'); return; }   // wedged somewhere / failsafe
  for (const it of items) if (it.cd > 0) it.cd--;
  if (baby.flash > 0) baby.flash--;
  G.liveFt = Math.max(0, Math.round((baby.x - P_X) / PX_PER_FT));
  if (!baby.onGround) { baby.trail++; trailParticle(); }
}

// NICE CATCH: same throw again — fresh yard (same seed), bounces wiped, both meter taps again
function caught() {
  G.catches++;
  showCaption('NICE CATCH!'); Audio2.sfx('catch');
  floatText(P_X, GY - 48, 'RE-THROW ' + G.catches + '/' + MAX_CATCHES, '#4ecdc4', 90);
  burst(P_X, GY - 36, 16, ['#ffffff', '#4ecdc4', '#ffe14d'], 1.8, 26);
  const c = G.catches;
  buildRound(); resetBaby(); G.catches = c; G.flyT = 0;
  G.phase = 'caught'; G.resT = 60;
}

// the throw is over: at rest, or stopped by peril. Distance counts wherever the baby is.
function endThrow(kind, it) {
  baby.vx = baby.vy = 0; baby.spin = 0; baby.ride = 0; baby.onGround = false;
  if (kind === 'rest') {
    baby.state = 'held'; baby.rot = 0;
    showCaption(pick(landingCaptions));
  } else {
    baby.state = 'cry'; parentFrame = 'panic';
    if (kind === 'bear') {
      showCaption('🐻 BEAR DELETED BABY! 🐻'); Audio2.sfx('roar'); shake(7);
      baby.x = it.x; baby.y = GY - 24; baby.hidden = true; it.anim = 60;
      burst(it.x, GY - 24, 30, ['#ffffff', '#c99a6b', '#8b5a2b'], 2.6, 36);
      G.flashScreen = 10;
    } else if (kind === 'heli' || kind === 'drone') {
      showCaption(kind === 'heli' ? '🚁 HELICOPTER MOM INTERCEPTED! 🚁' : '📦 PACKAGE DELIVERED 📦'); Audio2.sfx('grab'); shake(3);
      grabber.grabbed = true; grabber.vx = -0.6; baby.state = 'held';
    } else if (kind === 'grill') {
      showCaption('WELL DONE 🔥'); Audio2.sfx('sizzle'); shake(4);
      baby.x = it.x; baby.y = GY - 22; it.anim = 90;
      burst(it.x, GY - 22, 24, ['#ff8a00', '#ffd23a', '#888888'], 2, 40, -0.02);
    } else if (kind === 'mower') {
      showCaption('MULCHED 🌱'); Audio2.sfx('mulch'); shake(6); baby.hidden = true;
      burst(it.mx, GY - 6, 40, ['#6fd36f', '#4caf50', '#ffffff', '#8b5a2b'], 3, 40);
    } else if (kind === 'tree') {
      showCaption('STUCK IN A TREE 🌳'); Audio2.sfx('rustle'); it.anim = 30;
      baby.y = Math.min(baby.y, GY - 70); baby.x = clamp(baby.x, it.x - 14, it.x + 14);
      burst(baby.x, baby.y, 20, ['#3f9a4a', '#56b55e', '#2f7a35'], 2, 30);
    } else if (kind === 'karen') {
      showCaption('SHE WANTS TO SPEAK TO YOUR MANAGER'); Audio2.sfx('karen'); shake(4); it.anim = 120;
      baby.x = it.x - 10; baby.y = GY - baby.r;
    }
  }
  const ft = Math.max(0, Math.round((baby.x - P_X) / PX_PER_FT));
  const pts = ft * PTS_PER_FT + G.bounces * PTS_PER_BOUNCE;
  G.throws.push(ft); G.distance += ft; G.totalBounces += G.bounces; G.score += pts; G.liveFt = ft;
  floatText(baby.x, baby.y - 22, ft + ' FT', '#ffffff', 110);
  floatText(baby.x, baby.y - 34, '+' + pts, '#ffd700', 110);
  if (G.bounces) floatText(baby.x, baby.y - 46, G.bounces + 'X BOUNCE +' + G.bounces * PTS_PER_BOUNCE, '#ffe14d', 110);
  if (kind === 'rest') { Audio2.sfx('win'); burst(baby.x, baby.y, 18, ['#ffe14d', '#ffffff', '#ff6b9d'], 2, 36, 0.06); }
  Audio2.sfx(kind === 'rest' ? 'thud' : 'strike');
  G.phase = 'result'; G.result = kind; G.resT = 150;
}

function updateSky() {
  if (grabber) {
    const g = grabber; g.t++;
    if (g.t % (g.kind === 'heli' ? 7 : 4) === 0) Audio2.sfx(g.kind === 'heli' ? 'chop' : 'buzz');
    if (g.grabbed) { g.x += g.vx; g.y -= 1.4; baby.x = g.x - 4; baby.y = g.y + 12; }
    else { g.x += g.vx; g.y += Math.sin(g.t * 0.06) * 0.5; }
    if (!g.grabbed && (g.x < Cam.x - 80 || g.y < Cam.y - 80)) grabber = null;
  }
  if (flock) {
    flock.t++; flock.x += flock.vx; flock.y += Math.sin(flock.t * 0.05) * 0.3;
    if (flock.t % 40 === 1) Audio2.sfx('honk');
    if (flock.x < Cam.x - 80) flock = null;
  }
}
// things that move on the ground (mowers patrol, bears pace)
function updateGround() {
  const t = G.flyT || 0;
  for (const it of items) {
    if (it.kind === 'mower') { it.mx = it.x + tri(t * 0.4, 26); it.dir = tri(t * 0.4 + 0.4, 26) >= tri(t * 0.4, 26) ? 1 : -1; }
    if (it.kind === 'bear') { it.x = it.home + it.d0 * tri(t * 0.25, 8); it.dir = it.d0 * (tri(t * 0.25 + 0.25, 8) >= tri(t * 0.25, 8) ? 1 : -1); }
    if (it.anim > 0) it.anim--;
  }
}

function updateCamera() {
  let tx = AIM_CAM_X, ty = 0, kx = 0.08, ky = 0.08;
  if (G.phase === 'flying' || G.phase === 'result') {
    if (!(G.phase === 'result' && baby.hidden)) {
      tx = baby.x - 150; ty = Math.min(0, baby.y - 110);   // keeps the baby below the caption/banner area
    } else { tx = Cam.x; ty = Cam.y; }
    tx = Math.max(tx, AIM_CAM_X);
    kx = 0.12; ky = 0.22;
  } else if (G.phase === 'return') { kx = 0.1; ky = 0.12; }
  else if (G.phase === 'power' || G.phase === 'caught') { kx = 0.15; ky = 0.15; }
  Cam.x = lerp(Cam.x, tx, kx); Cam.y = lerp(Cam.y, ty, ky);
  if (Cam.y > 0) Cam.y = 0;
  if (Cam.shake > 0) { Cam.sx = rand(-Cam.shake, Cam.shake); Cam.sy = rand(-Cam.shake, Cam.shake); Cam.shake *= 0.85; if (Cam.shake < 0.3) Cam.shake = 0; }
  else { Cam.sx = Cam.sy = 0; }
}

function updatePlaying() {
  G.t++;
  if (Input.edge.pause) { pauseGame(); return; }
  switch (G.phase) {
    case 'return':
      // fast glide home after a long throw (distance can be thousands of px)
      if (Cam.x - AIM_CAM_X > 300) Cam.x -= (Cam.x - AIM_CAM_X) * 0.12;
      if (Math.abs(Cam.x - AIM_CAM_X) < 1.5 && Math.abs(Cam.y) < 1.5) {
        Cam.x = AIM_CAM_X; Cam.y = 0;
        if (G.pendingTurn) { G.pendingTurn = false; showTurnCard(); } else startRound(false);
      }
      break;
    case 'turn':                      // "PASS THE CONTROLLER" card: waits for a press
      if (G.resT > 0) G.resT--;
      else if (Input.edge.yeet) { Audio2.sfx('lock'); startRound(true); }
      break;
    case 'caught':
      if (--G.resT <= 0) startAim();
      break;
    case 'power':
      G.powerPos += G.powerDir * METER_SPEED;
      if (G.powerPos >= 100) { G.powerPos = 100; G.powerDir = -1; }
      if (G.powerPos <= 0) { G.powerPos = 0; G.powerDir = 1; }
      if (Input.edge.yeet) { G.powerValue = G.powerPos; G.phase = 'angle'; G.anglePos = 0; G.angleDir = 1; Audio2.sfx('lock'); }
      break;
    case 'angle':
      G.anglePos += G.angleDir * METER_SPEED;
      if (G.anglePos >= 100) { G.anglePos = 100; G.angleDir = -1; }
      if (G.anglePos <= 0) { G.anglePos = 0; G.angleDir = 1; }
      if (Input.edge.yeet) { G.angleValue = G.anglePos; Audio2.sfx('lock'); launch(); }
      break;
    case 'flying':
      G.flyT++;
      updateFlight();
      break;
    case 'result':
      if (!baby.hidden) G.flyT++;
      if (--G.resT <= 0) {
        if (G.round >= ROUNDS) {
          if (G.mode === 'party') { finishPlayer(); return; }
          showCPS(); return;
        }
        G.round++; resetBaby(); items = []; G.phase = 'return';
      }
      break;
  }
  if (G.event && G.event.t > 0) G.event.t--;
  if (G.event && G.event.type === 'wind' && G.phase === 'flying' && G.t % 2 === 0)
    particles.push({ x: Cam.x + (G.event.force > 0 ? -4 : VW + 4), y: Cam.y + rand(20, VH - 30), vx: G.event.force > 0 ? 5 : -5, vy: 0, life: 90, max: 90, c: 'rgba(255,255,255,0.7)', g: 0, s: 1, streak: true });
  for (const it of items) {
    if (Math.abs(it.x - Cam.x - VW / 2) > VW) continue;
    if (it.kind === 'grill' && G.t % 9 === 0) particles.push({ x: it.x + rand(-4, 4), y: GY - 20, vx: rand(-0.1, 0.1), vy: -0.35, life: 60, max: 60, c: 'rgba(200,200,200,0.6)', g: 0, s: 3 });
    if (it.kind === 'blower' && G.t % 3 === 0) particles.push({ x: it.x + 12, y: GY - rand(8, 42), vx: 2.4, vy: rand(-0.2, 0.2), life: 38, max: 38, c: 'rgba(255,255,255,0.55)', g: 0, s: 1, streak: true });
    if (it.kind === 'diaper' && !it.used && G.t % 5 === 0) particles.push({ x: it.x + 4, y: GY - 17, vx: rand(-0.3, 0.3), vy: -rand(0.3, 0.8), life: 14, max: 14, c: pick(['#ffd23a', '#ff8a00']), g: 0, s: 1 });
  }
  // forget items far behind the camera
  if (G.phase === 'flying' && items.length > 80) items = items.filter(it => it.x > Cam.x - 300);
  updateSky(); updateGround();
  updateParticles(); updateFloaters();
  if (G.banner && --G.banner.t <= 0) G.banner = null;
  if (G.caption && --G.caption.t <= 0) G.caption = null;
  if (G.flashScreen > 0) G.flashScreen--;
  updateCamera();
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; if (!p.streak) p.vx *= 0.98;
    if (--p.life <= 0) particles.splice(i, 1);
  }
  if (particles.length > 600) particles.splice(0, particles.length - 600);
}
function updateFloaters() { for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.y -= 0.3; if (--f.life <= 0) floaters.splice(i, 1); } }

function showCPS() {
  G.state = 'cps'; setTouchUI(false);
  Audio2.sfx('siren'); Audio2.setMusicVol(0.15);
  const newBest = G.score > G.best;
  if (newBest) { G.best = G.score; Best.set(G.score); }
  $('cpsStats').innerHTML = `Throws: ${G.throws.map(f => f + ' ft').join(' &middot; ')}<br>Total Distance: ${G.distance} ft<br>Bounces: ${G.totalBounces}<br>Final Score: ${G.score}` +
    (newBest && G.score > 0 ? `<br><span id="cpsBest">NEW BEST!</span>` : `<br>Best: ${G.best}`);
  showMenu('cps', 'cpsMenu', [
    { label: 'TRY AGAIN (LEGALLY)', action: newGame },
    { label: 'QUIT TO TITLE', action: showTitle },
  ]);
  // global leaderboard: name entry + board on top of the CPS screen
  const longest = Math.max(0, ...G.throws);
  const feats = longest >= 1000 ? [{ t: '1,000 FT THROW', n: 40 }] : longest >= 500 ? [{ t: '500 FT THROW', n: 15 }] : [];
  if (window.NBScores) NBScores.submit({ game: 'yeet', score: G.score, feats });
}


// =====================================================================
// PARTY MODE: 2–6 players pass the controller. Each player takes all 5 throws in a row,
// with identical conditions (same seeds). Results rank everyone; every score posts under its name.
// =====================================================================
const PARTY_COLORS = ['#ff6b9d', '#4ecdc4', '#ffd700', '#b18cff', '#ff9f43', '#54a0ff'];
const curPlayer = () => (G.players && G.players[G.cur]) || null;
const playerColor = () => (G.mode === 'party' && curPlayer()) ? curPlayer().color : null;

function showPartyCount() {
  G.state = 'menu';
  const items = [2, 3, 4, 5, 6].map(n => ({ label: n + ' PLAYERS', action: () => startNames(n) }));
  items.push({ label: 'BACK', action: showTitle, cls: 'mint' });
  showMenu('partyCount', 'partyCountMenu', items, showTitle);
}

// ---- name entry (one player at a time). Typing, ▲▼ per slot, controller D-pad.
const NAME_LEN = 6, NAME_CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const NE = { n: 0, i: 0, chars: [], cur: 0, fresh: true, err: '', names: [] };
function startNames(n) {
  NE.n = n; NE.i = 0; NE.names = [];
  beginName();
}
function beginName() {
  NE.chars = ('P' + (NE.i + 1)).padEnd(NAME_LEN, ' ').split(''); NE.cur = 0; NE.fresh = true; NE.err = '';
  hideScreens(); $('names').classList.add('on'); G.state = 'names'; setTouchUI(false);
  renderNames();
}
function renderNames() {
  const col = PARTY_COLORS[NE.i];
  $('namesTitle').innerHTML = `PLAYER ${NE.i + 1} OF ${NE.n}`;
  $('namesTitle').style.color = col; $('namesTitle').style.textShadow = `0 0 20px ${col}`;
  let h = '';
  for (let k = 0; k < NAME_LEN; k++) {
    h += `<div class="nslot"><button class="nar" data-up="${k}">&#9650;</button><div class="nch${k === NE.cur ? ' cur' : ''}" data-ch="${k}" style="${k === NE.cur ? 'border-color:' + col : ''}">${NE.chars[k] === ' ' ? '&middot;' : NE.chars[k]}</div><button class="nar" data-dn="${k}">&#9660;</button></div>`;
  }
  $('nameSlots').innerHTML = h;
  $('nameErr').textContent = NE.err;
  $('nameSlots').querySelectorAll('[data-up]').forEach(b => b.onclick = e => { e.preventDefault(); NE.cur = +b.dataset.up; nameCycle(1); });
  $('nameSlots').querySelectorAll('[data-dn]').forEach(b => b.onclick = e => { e.preventDefault(); NE.cur = +b.dataset.dn; nameCycle(-1); });
  $('nameSlots').querySelectorAll('[data-ch]').forEach(b => b.onclick = e => { e.preventDefault(); NE.cur = +b.dataset.ch; NE.fresh = false; renderNames(); });
  $('namesHint').innerHTML = isCoarse() && !Input.pad.on ? 'TAP &#9650; &#9660; TO PICK LETTERS, THEN DONE'
    : 'TYPE A NAME &middot; ENTER = DONE &middot; BACKSPACE = DELETE<br>CONTROLLER: D-PAD &#9650;&#9660; LETTER &middot; &#9664;&#9654; MOVE &middot; CROSS NEXT &middot; CIRCLE BACK &middot; OPTIONS DONE';
}
function nameCycle(d) {
  NE.fresh = false; let i = NAME_CHARS.indexOf(NE.chars[NE.cur]); if (i < 0) i = 0;
  NE.chars[NE.cur] = NAME_CHARS[(i + d + NAME_CHARS.length) % NAME_CHARS.length]; NE.err = ''; Audio2.sfx('select'); renderNames();
}
function nameType(c) {
  if (NE.fresh) { NE.chars = ' '.repeat(NAME_LEN).split(''); NE.cur = 0; NE.fresh = false; }
  NE.chars[NE.cur] = c; NE.err = ''; NE.cur = Math.min(NAME_LEN - 1, NE.cur + 1); Audio2.sfx('select'); renderNames();
}
function nameBackspace() {
  NE.fresh = false;
  if (NE.chars[NE.cur] === ' ' && NE.cur > 0) NE.cur--;
  NE.chars[NE.cur] = ' '; renderNames();
}
function nameDone() {
  const raw = NE.chars.join('').replace(/ /g, '');
  const clean = window.NBScores ? NBScores.clean(raw) : raw.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_LEN);
  if (!clean) { NE.err = 'PICK AT LEAST ONE LETTER'; Audio2.sfx('strike'); return renderNames(); }
  if (window.NBScores && NBScores.blocked(clean)) { NE.err = 'THAT NAME IS NOT ALLOWED'; Audio2.sfx('strike'); return renderNames(); }
  NE.names[NE.i] = clean; Audio2.sfx('lock');
  if (NE.i < NE.n - 1) { NE.i++; beginName(); return; }
  G.mode = 'party';
  G.players = NE.names.map((name, i) => ({ name, color: PARTY_COLORS[i], throws: [], score: 0, distance: 0, bounces: 0 }));
  newGame();
}
function nameBack() {
  if (NE.i > 0) { NE.i--; beginName(); NE.chars = NE.names[NE.i].padEnd(NAME_LEN, ' ').split(''); NE.fresh = false; renderNames(); }
  else showPartyCount();
}
function handleNames() {
  if (G.state !== 'names') return;
  if (Input.menu.up) nameCycle(1);
  if (Input.menu.down) nameCycle(-1);
  if (Input.menu.left) { NE.cur = Math.max(0, NE.cur - 1); NE.fresh = false; renderNames(); }
  if (Input.menu.right) { NE.cur = Math.min(NAME_LEN - 1, NE.cur + 1); NE.fresh = false; renderNames(); }
  if (Input.menu.ok) { if (NE.cur === NAME_LEN - 1) nameDone(); else { NE.cur++; NE.fresh = false; renderNames(); } }
  if (Input.menu.back) { if (NE.cur > 0) { NE.cur--; renderNames(); } else nameBack(); }
  if (Input.edge.pause) nameDone();
}
// keyboard typing on the name screen (handled before the normal game keys)
window.addEventListener('keydown', e => {
  if (G.state !== 'names' || (window.NBScores && NBScores.active)) return;
  const k = e.code;
  e.preventDefault(); e.stopImmediatePropagation(); Audio2.unlock();
  if (/^Key[A-Z]$/.test(k) || /^Digit[0-9]$/.test(k) || /^Numpad[0-9]$/.test(k)) { if (!e.repeat) nameType(k.slice(-1)); return; }
  if (k === 'Backspace') return nameBackspace();
  if (k === 'Enter' || k === 'NumpadEnter') return nameDone();
  if (k === 'Escape') return nameBack();
  if (k === 'ArrowLeft') { NE.cur = Math.max(0, NE.cur - 1); NE.fresh = false; return renderNames(); }
  if (k === 'ArrowRight' || k === 'Space') { NE.cur = Math.min(NAME_LEN - 1, NE.cur + 1); NE.fresh = false; return renderNames(); }
  if (k === 'ArrowUp') return nameCycle(1);
  if (k === 'ArrowDown') return nameCycle(-1);
}, true);

// ---- turns
function showTurnCard() {
  resetBaby(); items = []; buildRoundPreviewless();
  Cam.x = AIM_CAM_X; Cam.y = 0;
  G.phase = 'turn'; G.resT = 30; G.banner = null; G.caption = null;
  Audio2.sfx('turn');
}
function buildRoundPreviewless() { G.round = 1; buildRound(); }
function finishPlayer() {
  const pl = curPlayer();
  pl.throws = G.throws.slice(); pl.score = G.score; pl.distance = G.distance; pl.bounces = G.totalBounces; pl.done = true;
  if (G.cur < G.players.length - 1) {
    G.cur++; resetPlayerStats(); resetBaby(); items = [];
    G.pendingTurn = true; G.phase = 'return';
  } else showPartyResults();
}

// ---- results + posting
function partyRanking() {
  return G.players.slice().sort((a, b) => b.score - a.score || Math.max(0, ...b.throws) - Math.max(0, ...a.throws));
}
function showPartyResults() {
  G.state = 'results'; setTouchUI(false);
  Audio2.sfx('win'); Audio2.setMusicVol(0.2);
  const rk = partyRanking();
  const best = Math.max(...G.players.map(p => p.score));
  if (best > G.best) { G.best = best; Best.set(best); }
  G.banner = null; G.caption = null; G.event = null;
  const top = rk[0], second = rk[1];
  const longest = p => Math.max(0, ...p.throws);
  const tie = second && second.score === top.score;
  const tiedOut = rk.filter(p => p.score === top.score && longest(p) === longest(top));   // tied on score AND longest throw
  let rows = '';
  rk.forEach((p, i) => {
    rows += `<tr><td>${i + 1}</td><td style="color:${p.color}">${p.name}</td><td class="pt">${p.throws.map(f => f).join(' &middot; ')}</td><td>${longest(p)} FT</td><td class="ps">${p.score.toLocaleString('en-US')}</td><td class="pp" data-pp="${G.players.indexOf(p)}"></td></tr>`;
  });
  $('resTable').innerHTML = `<tr><th>#</th><th>NAME</th><th>THROWS (FT)</th><th>LONGEST</th><th>SCORE</th><th></th></tr>` + rows;
  $('resWinner').innerHTML = tiedOut.length > 1
    ? `&#127942; IT'S A TIE! ` + tiedOut.map(p => `<span style="color:${p.color}">${p.name}</span>`).join(' &amp; ') +
      `<div class="resTie">SAME SCORE AND SAME LONGEST THROW (${longest(top)} FT)</div>`
    : `&#127942; <span style="color:${top.color}">${top.name}</span> WINS!` +
      (tie ? `<div class="resTie">TIED ON SCORE: LONGEST THROW (${longest(top)} FT) DECIDES IT</div>` : '');
  showMenu('results', 'resMenu', [
    { label: 'PLAY AGAIN', action: newGame },
    { label: 'HIGH SCORES', action: () => { if (window.NBScores) NBScores.showBoard({ game: 'yeet', scope: 'week' }); }, cls: 'mint' },
    { label: 'QUIT TO TITLE', action: showTitle, cls: 'mint' },
  ]);
  postPartyScores();
}
// every player's score posts under the name they entered at the start
function postPartyScores() {
  if (!window.NBScores || !NBScores.post) { $('resPost').textContent = ''; return; }
  const todo = G.players.filter(p => !p.posted);
  if (!todo.length) return;
  $('resPost').innerHTML = 'POSTING SCORES...';
  const paint = () => G.players.forEach((p, i) => { const c = document.querySelector(`[data-pp="${i}"]`); if (c) c.innerHTML = p.posted ? '&#10003;' : p.postFail ? '&#10007;' : ''; });
  let chain = Promise.resolve(), fails = 0;
  todo.forEach(p => {
    chain = chain.then(() => NBScores.post('yeet', p.name, Math.max(0, Math.floor(p.score))))
      .then(() => { p.posted = true; p.postFail = false; paint(); })
      .catch(() => { p.postFail = true; fails++; paint(); });
  });
  chain.then(() => {
    if (G.state !== 'results') return;
    if (!fails) { $('resPost').innerHTML = 'SCORES POSTED TO THE GLOBAL BOARD'; return; }
    $('resPost').innerHTML = `NO SIGNAL: ${fails} SCORE${fails > 1 ? 'S' : ''} NOT POSTED <button class="chip" id="resRetry">RETRY</button>`;
    $('resRetry').onclick = e => { e.preventDefault(); postPartyScores(); };
  });
}

// ---- party HUD: everyone's totals, current player highlighted
function drawPartyStrip() {

function drawTurnCard() {

}

// =====================================================================
// RENDER
// =====================================================================
function skyColor(cy) {
  const k = clamp(-cy / 500, 0, 1);
  const a = [94, 200, 255], b = [38, 98, 214];
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
const CLOUDS = [];
for (let i = 0; i < 14; i++) CLOUDS.push({ x: i * 130 + Math.random() * 60, y: 20 - Math.random() * 420, s: Math.random() < 0.35 ? 1 : 0, spd: 0.04 + Math.random() * 0.06 });

function drawWorld(c, camX, camY, t) {
  // sky
  const g = c.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, skyColor(camY - 100)); g.addColorStop(1, skyColor(camY + 100));
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  // sun
  const sy = 30 - camY * 0.05;
  c.fillStyle = '#fff3a0'; c.beginPath(); c.arc(330, sy, 15, 0, 7); c.fill();
  c.fillStyle = '#ffe14d'; c.beginPath(); c.arc(330, sy, 12, 0, 7); c.fill();
  // clouds (parallax 0.2 / 0.5)
  for (const cl of CLOUDS) {
    const span = VW + 200;
    const x = ((cl.x - camX * 0.2 - t * cl.spd) % span + span) % span - 100;
    const y = cl.y - camY * 0.5;
    if (y > -40 && y < VH + 10) c.drawImage(S.clouds[cl.s].img, Math.round(x), Math.round(y));
  }
  // far hills + neighbors (parallax 0.3)
  const fy = Math.round(GY - 92 - camY * 0.55);
  if (fy < VH) { const fo = -Math.floor(((camX * 0.3) % VW + VW) % VW); c.drawImage(BG.far, fo, fy); c.drawImage(BG.far, fo + VW, fy); }
  // fence (parallax 0.7 horizontally, locked to the ground vertically)
  const gy = Math.round(GY - camY);
  if (gy - 34 < VH) { const no = -Math.floor(((camX * 0.7) % VW + VW) % VW); c.drawImage(BG.fence, no, gy - 32); c.drawImage(BG.fence, no + VW, gy - 32); }
  // house + back porch at the start of the yard
  drawSprite(c, S.house, Math.round(-104 - camX), gy + 2);
  // yard end: the neighbor's hedge
  const hx = Math.round(yardEnd - camX);
  if (hx < VW + 10 && hx > -60) {
    c.fillStyle = OL; c.fillRect(hx - 1, gy - 47, 52, 48);
    c.fillStyle = '#2f7a35'; c.fillRect(hx, gy - 46, 50, 46);
    c.fillStyle = '#3f9a4a'; for (let i = 0; i < 10; i++) c.fillRect(hx + (i * 11) % 46, gy - 44 + (i * 17) % 40, 4, 3);
  }
  // ground
  if (gy < VH) {
    const go = -Math.floor(((camX % 32) + 32) % 32);
    for (let x = go; x < VW; x += 32) for (let y = gy; y < VH; y += 40) c.drawImage(BG.ground, x, y);
    // distance stakes every 50 ft
    const ft0 = Math.max(50, Math.floor((camX - P_X) / PX_PER_FT / 50) * 50);
    for (let ft = ft0; ft <= ft0 + 150; ft += 50) {
      const sx = Math.round(P_X + ft * PX_PER_FT - camX);
      if (sx < -4 || sx > VW + 4) continue;
      c.fillStyle = OL; c.fillRect(sx - 1, gy - 7, 3, 9); c.fillStyle = '#ffffff'; c.fillRect(sx, gy - 6, 1, 7);
    }
  }
}

function drawItem(c, it, camX, gy) {
  const x = it.x - camX;
  if (x < -70 || x > VW + 70) return;
  switch (it.kind) {
    case 'trampoline': drawSprite(c, S.trampoline[it.anim > 14 ? 1 : 0], x, gy + 1); break;
    case 'castle': drawSprite(c, S.castle, x, gy + 1 + (it.anim > 0 && it.anim % 6 < 3 ? 1 : 0)); break;
    case 'dog': {
      const jump = it.anim > 0 ? Math.sin((24 - it.anim) / 24 * Math.PI) * 14 : 0;
      drawSprite(c, S.dog[it.anim > 0 ? 1 : 0], x, gy + 1 - jump);
      break;
    }
    case 'blower': drawSprite(c, S.blower, x, gy + 1); break;
    case 'clothes': {
      const sag = 3 + (it.anim > 0 ? Math.sin(it.anim * 0.8) * it.anim * 0.25 : 0);
      for (const px of [x - 19, x + 18]) { c.fillStyle = OL; c.fillRect(Math.round(px) - 1, gy - 33, 3, 34); c.fillStyle = '#a8703c'; c.fillRect(Math.round(px), gy - 32, 1, 32); }
      c.fillStyle = '#eeeeee';
      for (let i = -18; i <= 18; i++) c.fillRect(Math.round(x + i), Math.round(gy - 30 + sag * (1 - (i / 18) * (i / 18))), 1, 1);
      const hang = (hx, w, h, col) => { const hy = Math.round(gy - 30 + sag * (1 - ((hx - x) / 18) ** 2)); c.fillStyle = OL; c.fillRect(Math.round(hx) - 1, hy, w + 2, h + 1); c.fillStyle = col; c.fillRect(Math.round(hx), hy, w, h); };
      hang(x - 12, 7, 8, '#ff6b9d'); hang(x - 2, 3, 6, '#ffffff'); hang(x + 5, 8, 7, '#4ecdc4');
      break;
    }
    case 'flamingo': drawSprite(c, S.flamingo, x, gy + 1, { rot: it.anim > 0 ? Math.sin(it.anim * 0.7) * 0.25 : 0 }); break;
    case 'grill': drawSprite(c, S.grill[Math.floor(G.t / 8) % 2], x, gy + 1); break;
    case 'mower': drawSprite(c, S.mower[Math.floor(G.t / 15) % 2], (it.mx === undefined ? it.x : it.mx) - camX, gy + 1, { flip: it.dir < 0 }); break;
    case 'tree': drawSprite(c, S.tree, x + (it.anim > 0 ? (it.anim % 4 < 2 ? 1 : -1) : 0), gy + 1); break;
    case 'karen': drawSprite(c, S.karen[it.anim > 0 && Math.floor(G.t / 6) % 2 ? 1 : 0], x, gy + 1, { flip: true }); break;
    case 'bear': drawSprite(c, S.bear[Math.floor(G.t / 16) % 2], x, gy + 1, { flip: it.dir < 0 }); break;
    case 'diaper': drawSprite(c, it.used ? S.diaperBlown : S.diaper, x, gy + 1); break;
    case 'slide': drawSprite(c, S.slide, x, gy + 2); break;
    case 'ramp': drawSprite(c, S.ramp, x, gy + 1); break;
    case 'rocket': if (!it.used) drawSprite(c, S.rocket, x, gy + 1); break;
  }
}

function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
  const c = wctx;
  if (G.state === 'title' || G.state === 'boot' || G.state === 'menu' || G.state === 'names') { renderTitleBg(); return; }
  const camX = Math.round(Cam.x), camY = Math.round(Cam.y);
  drawWorld(c, camX, camY, G.t);
  const gy = GY - camY;
  // trees and slides behind everything else, then the rest
  for (const it of items) if (it.kind === 'tree' || it.kind === 'slide') drawItem(c, it, camX, gy);
  for (const it of items) if (it.kind !== 'tree' && it.kind !== 'slide') drawItem(c, it, camX, gy);
  // parent
  drawSprite(c, parentSprites()[parentFrame], P_X - camX, gy + 1);
  // baby
  if (baby && !baby.hidden) {
    const s = S.baby[baby.state] || S.baby.held;
    drawCentered(c, s, baby.x - camX, baby.y - camY, baby.state === 'fly' ? baby.rot : 0, baby.flash > 0 && baby.flash % 2 === 0);
  }
  // bottle rocket the baby is riding
  if (baby && baby.ride > 0) drawSprite(c, S.rocket, baby.x - camX - 2, baby.y - camY + 12, { rot: Math.PI / 2 });
  // sky events: helicopter mom / delivery drone / geese
  if (grabber) {
    if (grabber.kind === 'heli') drawSprite(c, S.heli[Math.floor(grabber.t / 3) % 2], grabber.x - camX, grabber.y - camY + 13);
    else drawSprite(c, S.drone[Math.floor(grabber.t / 2) % 2], grabber.x - camX, grabber.y - camY + 6);
  }
  if (flock) for (const b of flock.birds) drawSprite(c, S.goose[Math.floor((flock.t + b.dx) / 6) % 2], flock.x + b.dx - camX, flock.y + b.dy - camY + 6);
  // particles
  for (const p of particles) {
    c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.c;
    if (p.streak) c.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), 10, 1);
    else c.fillRect(Math.round(p.x - camX - p.s / 2), Math.round(p.y - camY - p.s / 2), p.s, p.s);
  }
  c.globalAlpha = 1;
  // blit the pixel world up to 1920x1080
  ctx.drawImage(world, Math.round(Cam.sx * SCALE), Math.round(Cam.sy * SCALE), 1920, 1080);
  if (G.flashScreen > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flashScreen / 14})`; ctx.fillRect(0, 0, 1920, 1080); }
  drawWorldLabels(camX, camY);
  drawFloaters(camX, camY);
  drawOffscreenBaby(camX, camY);
  drawHUD();
  drawPartyStrip();
  drawMeter();
  drawEventBanner();
  drawBanner();
  drawCaption();
  drawTurnCard();
}

function txt(s, x, y, size, color, align = 'left', outline = true) {

  if (outline) { ctx.fillStyle = '#000'; for (const [dx, dy] of [[-4, 0], [4, 0], [0, -4], [0, 4], [-3, -3], [3, 3], [-3, 3], [3, -3]]) ctx.fillText(s, x + dx * size / 34, y + dy * size / 34); }

function drawWorldLabels(camX, camY) {

function drawFloaters(camX, camY) {

function drawOffscreenBaby(camX, camY) {

    const x = clamp((baby.x - camX) * SCALE, 60, 1860);
    ctx.fillStyle = '#ff6b9d'; ctx.beginPath(); ctx.moveTo(x, 118); ctx.lineTo(x - 22, 150); ctx.lineTo(x + 22, 150); ctx.fill();

// party mode: the parent's shirt is the current player's color
function parentSprites() {
  const col = playerColor(); if (!col) return S.parent;
  if (!S.parentBy[col]) S.parentBy[col] = { idle: mkSprite(parentPX('idle', col)), ready: mkSprite(parentPX('ready', col)), throw: mkSprite(parentPX('throw', col)), panic: mkSprite(parentPX('panic', col)) };
  return S.parentBy[col];
}
function drawHUD() {

function drawMeter() {
  if (G.phase !== 'power' && G.phase !== 'angle') return;
  const x = 520, y = G.mode === 'party' ? 176 : 128, w = 880, h = 196;
  ctx.fillStyle = 'rgba(255,255,255,.94)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#ff6b9d'; ctx.lineWidth = 8; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x + 4, y + h + 4, w, 8);
  const power = G.phase === 'power';
  txt(power ? '⚡ YEET POWER ⚡' : '📐 YEET ANGLE 📐', x + w / 2, y + 48, 26, power ? '#ff6b9d' : '#2fb3aa', 'center', false);
  const labels = power ? ['WEAK', 'MEDIUM', 'STRONG'] : ['LOW', '45°', 'HIGH'];
  txt(labels[0], x + 40, y + 84, 16, '#666', 'left', false);
  txt(labels[1], x + w / 2, y + 84, 16, '#666', 'center', false);
  txt(labels[2], x + w - 40, y + 84, 16, '#666', 'right', false);
  const bx = x + 40, by = y + 96, bw = w - 80, bh = 44;
  const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  if (power) { grad.addColorStop(0, '#ffb6c1'); grad.addColorStop(0.5, '#ff69b4'); grad.addColorStop(1, '#ff1493'); }
  else { grad.addColorStop(0, '#4ecdc4'); grad.addColorStop(0.5, '#ffffff'); grad.addColorStop(1, '#ff6b9d'); }
  ctx.fillStyle = grad; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = power ? '#ff6b9d' : '#4ecdc4'; ctx.lineWidth = 5; ctx.strokeRect(bx, by, bw, bh);
  const pos = power ? G.powerPos : G.anglePos;
  const ix = bx + (bw - 14) * pos / 100;
  ctx.fillStyle = '#000'; ctx.fillRect(ix - 3, by - 10, 20, bh + 20);
  ctx.fillStyle = '#fff'; ctx.fillRect(ix, by - 7, 14, bh + 14);
  const hint = isCoarse() && !Input.pad.on ? 'TAP YEET!' : Input.pad.on ? 'PRESS A TO LOCK IT IN' : 'SPACE / ENTER / CLICK TO LOCK IT IN';
  txt(power ? '⬆️ Time your clicks carefully! ⬆️' : hint, x + w / 2, y + 178, 16, '#555', 'center', false);
}
function drawEventBanner() {
  const e = G.event; if (!e || e.t <= 0) return;
  const k = clamp(Math.min(e.t, 120 - e.t) / 10, 0, 1);
  ctx.globalAlpha = k;
  let label = e.emoji + ' ' + e.name + ' ' + e.emoji;
  const oy = G.mode === 'party' ? 50 : 0;
  txt(label, 960, 170 + oy, 40, '#ffffff', 'center');
  if (e.type === 'wind') txt(e.force > 0 ? '>>> TAILWIND >>>' : '<<< HEADWIND <<<', 960, 222 + oy, 26, '#9fe3ff', 'center');
  ctx.globalAlpha = 1;
}
function drawBanner() {
  const b = G.banner; if (!b || G.phase === 'flying') return;
  const k = clamp(Math.min((b.max - b.t) / 12, b.t / 12), 0, 1);
  ctx.globalAlpha = k;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 380, 1920, 220);
  ctx.fillStyle = '#ff6b9d'; ctx.fillRect(0, 380, 1920, 5); ctx.fillRect(0, 595, 1920, 5);

  txt(b.sub, 960, 548, 28, '#ffffff', 'center');

function drawCaption() {
  const cp = G.caption; if (!cp) return;
  const p = 1 - cp.t / cp.max;
  let sc = p < 0.12 ? lerp(0, 1.15, p / 0.12) : p < 0.22 ? lerp(1.15, 1, (p - 0.12) / 0.1) : p < 0.8 ? 1 : lerp(1, 0.9, (p - 0.8) / 0.2);
  const alpha = p < 0.8 ? 1 : 1 - (p - 0.8) / 0.2;
  ctx.save(); ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.translate(960, 330); ctx.scale(sc, sc);
  ctx.font = '36px "Press Start 2P", monospace';
  const w = ctx.measureText(cp.text).width + 80, h = 110;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(-w / 2 + 8, -h / 2 + 12, w, h);
  ctx.fillStyle = '#fff'; ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.strokeStyle = '#ff6b9d'; ctx.lineWidth = 10; ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.fillStyle = '#ff6b9d'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(cp.text, 0, 4);
  ctx.restore(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

// animated backyard behind the title + menus
function renderTitleBg() {
  if (!S.baby) return;

  drawCentered(wctx, S.baby[bounce > 0.4 ? 'fly' : 'held'], P_X + 1 - AIM_CAM_X + bounce * 6, GY - 40 - bounce * 60, bounce > 0.4 ? t * 0.12 : 0);
