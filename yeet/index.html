// =====================================================================
// SCREENS + MENUS (mouse, touch, keyboard and controller all work)
// =====================================================================
const Menu = { items: [], idx: 0, onBack: null };
const SCREENS = ['title', 'pause', 'cps', 'partyCount', 'names', 'results'];
function hideScreens() { SCREENS.forEach(s => $(s).classList.remove('on')); Menu.items = []; Menu.onBack = null; }
function showMenu(screen, boxId, items, onBack) {
  hideScreens();
  $(screen).classList.add('on');
  const box = $(boxId); box.innerHTML = '';
  Menu.items = items.map((it, i) => {
    const b = document.createElement('button'); b.className = 'btn' + (it.cls ? ' ' + it.cls : ''); b.textContent = it.label;
    b.addEventListener('click', e => { e.preventDefault(); Audio2.unlock(); Audio2.sfx('select'); it.action(); });
    b.addEventListener('mouseenter', () => { Menu.idx = i; markMenu(); });
    box.appendChild(b); return { el: b, action: it.action };
  });
  Menu.idx = 0; Menu.onBack = onBack || null; markMenu();
  setTouchUI(false);
}
function markMenu() { Menu.items.forEach((m, i) => m.el.classList.toggle('sel', i === Menu.idx)); }
function handleMenus() {
  if (window.NBScores && NBScores.active) return;
  if (!Menu.items.length || G.state === 'playing') return;
  if (Input.menu.up) { Menu.idx = (Menu.idx + Menu.items.length - 1) % Menu.items.length; markMenu(); Audio2.sfx('select'); }
  if (Input.menu.down) { Menu.idx = (Menu.idx + 1) % Menu.items.length; markMenu(); Audio2.sfx('select'); }
  if (Input.menu.ok) { Audio2.sfx('select'); const it = Menu.items[Menu.idx]; it && it.action(); clearEdges(); return; }
  if ((Input.menu.back || (G.state === 'paused' && Input.edge.pause)) && Menu.onBack) { Menu.onBack(); clearEdges(); }
}
function clearEdges() { Input.edge.yeet = Input.edge.pause = false; Input.menu.up = Input.menu.down = Input.menu.left = Input.menu.right = Input.menu.ok = Input.menu.back = false; }

function showTitle() {
  G.state = 'title'; Audio2.stopMusic(); G.mode = 'solo';
  G.best = Best.get();
  showMenu('title', 'titleMenu', [
    { label: 'START YEETING', action: startSolo },
    { label: 'PARTY MODE (PASS THE CONTROLLER)', action: showPartyCount },
    { label: 'PRIZES', action: openPrizes, cls: 'mint' },
    { label: 'FULLSCREEN', action: toggleFullscreen, cls: 'mint' },
    { label: 'EXIT TO ARCADE', action: exitToArcade, cls: 'mint' },
  ]);
  $('titleBest').textContent = G.best ? 'BEST: ' + G.best : '';
  $('titleHint').innerHTML = isCoarse()
    ? 'TAP YEET ONCE TO LOCK POWER, AGAIN TO LOCK ANGLE<br>5 THROWS. GET THE BABY AS FAR AS YOU CAN. BOUNCERS +100, PERIL STOPS YOU.'
    : 'SPACE / ENTER / CLICK = YEET &middot; ESC = PAUSE &middot; F = FULLSCREEN<br>CONTROLLER: A = YEET &middot; START = PAUSE<br>5 THROWS. GET THE BABY AS FAR AS YOU CAN. BOUNCERS +100, PERIL STOPS YOU.';
}
// PRIZES: equip what you've bought at the arcade's prize counter
function openPrizes() {

function pauseGame() {

function resumeGame() { hideScreens(); G.state = 'playing'; Audio2.setMusicVol(0.5); clearEdges(); setTouchUI(true); }

function setTouchUI(on) {

// =====================================================================
// FULLSCREEN + LAYOUT
// =====================================================================
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      if (r && r.catch) r.catch(() => { });
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { });
    } else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  } catch (e) { }
}
// On touch devices the game is narrowed just enough to leave a control column on each side,
// so the on-screen controls never cover the play area.
const TOUCH_COL_MIN = 150;
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let s = Math.min(vw / 1920, vh / 1080);
  if (isCoarse() && vw > vh) s = Math.min((vw - 2 * TOUCH_COL_MIN) / 1920, vh / 1080);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  document.documentElement.style.setProperty('--cw', Math.max(0, (vw - 1920 * s) / 2) + 'px');
  $('rotate').classList.toggle('on', isCoarse() && vh > vw);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

// =====================================================================
// MAIN LOOP + BOOT
// =====================================================================
function step() {
  if (G.state === 'playing') updatePlaying();
  Input.edge.yeet = false; Input.edge.pause = false;
}
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  pollGamepad();
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  handleMenus();
  if (!(window.NBScores && NBScores.active)) handleNames();
  Input.menu.up = Input.menu.down = Input.menu.left = Input.menu.right = Input.menu.ok = Input.menu.back = false;
  let n = 0;
  while (acc >= STEP && n < 8) { step(); acc -= STEP; n++; }
  if (n >= 8) acc = 0;
  render();
}
function boot() {
  buildSprites();
  const rc = $('rotateBaby').getContext('2d'); rc.drawImage(S.baby.fly.img, -BABY_PAD, -BABY_PAD);
  setupTouch();
  layout();
  showTitle();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const fontReady = document.fonts && document.fonts.load ? document.fonts.load('20px "Press Start 2P"').catch(() => { }) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 2500))]).then(boot);
</script>
