<script id="nb-scores">
/* NB-SCORES START v1 — Neon Bread Arcade global leaderboards.
   Canonical copy: LogicNerds/neonbread/shared/nb-scores.js. Each game inlines this block
   between the NB-SCORES START / END markers so every game stays one self-contained file.
   Backend: Firestore (project neon-bread-arcade) over its REST API. No sign-in, no SDK. */
(function () {
  'use strict';
  if (window.NBScores) return;
  const PROJECT = 'neon-bread-arcade';
  const BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
  const GAMES = {
    chonx: { title: "CHONX '26", color: '#39ff6a' },
    yeet: { title: 'YEET THE BABY', color: '#ff6b9d' },
    gta: { title: 'GRANDMA THEFT AUTOMATIC', color: '#ffcc4d' },
    karen: { title: 'BODY THE KAREN', color: '#00e5ff' },
    cheekyops: { title: 'CHONX: CHEEKY OPS', color: '#ff2a3d' },
    pedxing: { title: 'PED X-ING', color: '#d4ff00' },
    fiveo: { title: 'CHONX FIVE O', color: '#2b6bff' },
  };
  const ARCADE_URL = 'https://www.neonbreadent.com/';
  const NAME_LEN = 6;
  const CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const NAME_KEY = 'nb_name';

  // ---------------------------------------------------------------- name filter
  // Slurs are blocked; swearing is fine. Checked after undoing common letter swaps (0->O, 1->I ...).
  // The same lists live in the Firestore rules as a second line of defence.
  const SUB = ['nigg', 'nigr', 'niga', 'fagot', 'faggot', 'faggt', 'kike', 'kyke', 'trann', 'trany', 'retard', 'wetbac', 'beaner', 'raghea', 'chink'];
  const EXACT = ['nig', 'fag', 'fags', 'spic', 'spics', 'spick', 'coon', 'coons', 'gook', 'gooks', 'dyke', 'dykes', 'jap', 'japs', 'paki', 'pakis', 'wop', 'wops', 'kkk'];
  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '9': 'g' };
  function norm(s) { return s.toLowerCase().split('').map(c => LEET[c] || c).join(''); }
  function blocked(name) {
    const raw = name.toLowerCase(), n = norm(name), squeezed = n.replace(/(.)\1+/g, '$1');
    return [raw, n, squeezed].some(v => SUB.some(w => v.includes(w)) || EXACT.includes(v));
  }
  function clean(name) { return String(name || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_LEN); }

  // ---------------------------------------------------------------- weeks (reset Monday 00:00 Pacific)
  function weekKey(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' })
      .formatToParts(d || new Date()).forEach(x => { p[x.type] = x.value; });
    const back = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[p.weekday] || 0;
    const u = new Date(Date.UTC(+p.year, +p.month - 1, +p.day - back));
    return u.toISOString().slice(0, 10);
  }
  function weekLabel(k) {
    const [y, m, d] = k.split('-').map(Number);
    return 'WEEK OF ' + ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'][m - 1] + ' ' + d;
  }

  // ---------------------------------------------------------------- Firestore REST
  function req(path, body) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = ctl ? setTimeout(() => ctl.abort(), 9000) : 0;
    return fetch(BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(r => r.json().then(j => {
        clearTimeout(t);
        const err = j && (j.error || (Array.isArray(j) && j[0] && j[0].error));
        if (!r.ok || err) throw new Error((err && err.message) || ('HTTP ' + r.status));
        return j;
      }))
      .catch(e => { clearTimeout(t); throw e; });
  }
  const sv = v => ({ stringValue: v });
  const fEq = (f, v) => ({ fieldFilter: { field: { fieldPath: f }, op: 'EQUAL', value: sv(v) } });
  function whereFor(game, scope, above) {
    const fs = [fEq('game', game)];
    if (scope === 'week') fs.push(fEq('week', weekKey()));
    if (above != null) fs.push({ fieldFilter: { field: { fieldPath: 'score' }, op: 'GREATER_THAN', value: { integerValue: String(above) } } });
    return { compositeFilter: { op: 'AND', filters: fs } };
  }
  function newId() {
    const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; let s = '';
    const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(20)) : Array.from({ length: 20 }, () => Math.random() * 256);
    for (let i = 0; i < 20; i++) s += a[r[i] % a.length];
    return s;
  }
  function post(game, name, score, cheat) {
    const id = newId(), fields = { game: sv(game), name: sv(name), score: { integerValue: String(score) }, week: sv(weekKey()) };
    if (cheat) fields.cheat = { booleanValue: true };
    return req(':commit', {
      writes: [{
        update: {
          name: 'projects/' + PROJECT + '/databases/(default)/documents/scores/' + id,
          fields,
        },
        updateTransforms: [{ fieldPath: 'ts', setToServerValue: 'REQUEST_TIME' }],
        currentDocument: { exists: false },
      }],
    }).then(() => id);
  }
  function rowsOf(res) {
    return res.filter(r => r.document).map(r => {
      const f = r.document.fields || {};
      return { id: r.document.name.split('/').pop(), ref: r.document.name, name: (f.name && f.name.stringValue) || '???', score: +((f.score && f.score.integerValue) || 0), cheat: !!(f.cheat && f.cheat.booleanValue) };
    });
  }
  function top(game, scope, limit) {
    return req(':runQuery', {
      structuredQuery: {
        from: [{ collectionId: 'scores' }], where: whereFor(game, scope),
        orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit: limit || 100,
      },
    }).then(rowsOf);
  }
  // Every all-time score, PAGE at a time. `after` is the last row of the previous page (cursor, so skipped rows aren't billed).
  const PAGE = 100;
  function page(game, after) {
    const q = {
      from: [{ collectionId: 'scores' }], where: whereFor(game, 'all'),
      orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }, { field: { fieldPath: '__name__' }, direction: 'DESCENDING' }],
      limit: PAGE,
    };
    if (after) q.startAt = { values: [{ integerValue: String(after.score) }, { referenceValue: after.ref }], before: false };
    return req(':runQuery', { structuredQuery: q }).then(rowsOf);
  }
  function rank(game, scope, score) {
    return req(':runAggregationQuery', {
      structuredAggregationQuery: { structuredQuery: { from: [{ collectionId: 'scores' }], where: whereFor(game, scope, score) }, aggregations: [{ alias: 'n', count: {} }] },
    }).then(r => 1 + +(((r[0] || {}).result || {}).aggregateFields || {}).n.integerValue || 0);
  }

  // ---------------------------------------------------------------- tickets
  // One wallet per device, shared by every game on neonbreadent.com (they all share localStorage).
  // A run pays score / rate (aiming for ~20-40 on an average run, min 5, max 150) plus bonuses.
  // Party mode never calls submit(), so party runs earn nothing.
  const TK_KEY = 'nb_tickets_v1';
  const TK_RATE = { chonx: 1000, cheekyops: 2000, yeet: 600, gta: 1500, karen: 400, pedxing: 1500, fiveo: 1000 };
  const TK = { min: 5, max: 150, best: 25, top10: 50, firstToday: 10, golden: 500, goldenOdds: 1 / 40 };
  function pacificDay(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(d || new Date()).forEach(x => { p[x.type] = x.value; });
    return p.year + '-' + p.month + '-' + p.day;
  }
  function tkBlank() { return { v: 1, bal: 0, earned: 0, spent: 0, best: {}, day: {}, owned: {}, equip: {}, cheats: {}, chal: {}, golden: 0, runs: 0 }; }
  function tkLoad() {
    try { const w = JSON.parse(localStorage.getItem(TK_KEY) || 'null'); if (w && typeof w.bal === 'number') return Object.assign(tkBlank(), w); } catch (e) { }
    return tkBlank();
  }
  function tkSave(w) { try { localStorage.setItem(TK_KEY, JSON.stringify(w)); } catch (e) { } tkFire(w); }
  const tkListeners = [];
  function tkFire(w) { tkListeners.forEach(f => { try { f(w); } catch (e) { } }); }
  // other tabs (the arcade open in one tab, a game in another) see changes too
  window.addEventListener('storage', e => { if (e.key === TK_KEY) tkFire(tkLoad()); });
  const Tickets = {
    rates: TK_RATE, rules: TK, today: pacificDay,
    wallet: tkLoad,
    balance() { return tkLoad().bal; },
    onChange(f) { tkListeners.push(f); },
    add(n) { const w = tkLoad(); n = Math.max(0, Math.floor(n)); w.bal += n; w.earned += n; tkSave(w); return w.bal; },
    spend(n) { const w = tkLoad(); n = Math.max(0, Math.floor(n)); if (w.bal < n) return false; w.bal -= n; w.spent += n; tkSave(w); return true; },
    owns(id) { return !!tkLoad().owned[id]; },
    // buy a prize: takes the tickets and records it in one save
    buy(id, price) { const w = tkLoad(), it = Tickets.item(id); if (w.owned[id] || w.bal < price || (it && !Tickets.inSeason(it))) return false; w.bal -= price; w.spent += price; w.owned[id] = Date.now(); tkSave(w); return true; },
    equipped(game, slot) { const e = tkLoad().equip[game] || {}; return slot ? e[slot] || null : e; },
    setEquip(game, slot, id) { const w = tkLoad(); w.equip[game] = w.equip[game] || {}; if (id) w.equip[game][slot] = id; else delete w.equip[game][slot]; tkSave(w); },
    // ---- cheat cards: codes live in w.owned like any prize; w.cheats[id] = switched on
    cheatsFor(game) { return Tickets.catalog.filter(i => i.cheat && i.game === game); },
    envelopeLeft(game) { const w = tkLoad(); return Tickets.cheatsFor(game).filter(i => !i.perk && !w.owned[i.id]).length; },
    // buy an envelope: takes the tickets and reveals one code you don't have yet, at random
    openEnvelope(game) {
      const w = tkLoad(), env = Tickets.item('env.' + game), left = Tickets.cheatsFor(game).filter(i => !i.perk && !w.owned[i.id]);
      if (!env || !left.length || w.bal < env.price) return null;
      const got = left[Math.floor(Math.random() * left.length)];
      w.bal -= env.price; w.spent += env.price; w.owned[got.id] = Date.now(); tkSave(w); return got;
    },
    cheatOn(game, key) {
      const id = 'cheat.' + game + '.' + key, w = tkLoad();
      if (w.owned[id] && w.cheats && w.cheats[id]) return true;
      const it = Tickets.item(id); return !!(it && it.freeDay && it.freeDay === pacificDay());   // free for everyone that day
    },
    setCheat(id, on) {
      const w = tkLoad(), it = Tickets.item(id); w.cheats = w.cheats || {};
      if (on && it && it.group) Tickets.catalog.forEach(o => { if (o.group === it.group && o.id !== id) delete w.cheats[o.id]; });   // one of a group at a time (Five O starting guns)
      if (on) w.cheats[id] = 1; else delete w.cheats[id]; tkSave(w);
    },
    // a run with any gameplay (T) code switched on is tagged on the leaderboard
    tagged(game) { return Tickets.cheatsFor(game).some(i => i.tag && Tickets.cheatOn(game, i.id.split('.')[2])); },
    // work out what a finished run pays (doesn't save). A tagged run can't set a personal best.
    quote(game, score, ranks, feats, tagged, stats) {
      const w = tkLoad(), lines = [];
      const base = Math.max(TK.min, Math.min(TK.max, Math.round(score / (TK_RATE[game] || 1000))));
      lines.push({ t: 'RUN PAYOUT', n: base });
      if (!tagged && score > 0 && score > (w.best[game] || 0)) lines.push({ t: 'NEW PERSONAL BEST', n: TK.best });
      if (ranks && ranks.week && ranks.week <= 10) lines.push({ t: 'WEEKLY TOP 10', n: TK.top10 });
      if (w.day[game] !== pacificDay()) lines.push({ t: 'FIRST RUN TODAY', n: TK.firstToday });
      (feats || []).forEach(f => { if (f && f.n > 0) lines.push({ t: String(f.t), n: Math.floor(f.n) }); });
      const ch = Tickets.challenge(game);
      if (ch && !ch.done && !tagged) { let ok = false; try { ok = !!ch.ok(Object.assign({ score }, stats || {})); } catch (e) { } if (ok) lines.push({ t: 'DAILY CHALLENGE: ' + ch.t, n: ch.n, chal: true }); }
      if (Math.random() < TK.goldenOdds) lines.push({ t: 'GOLDEN TICKET!', n: TK.golden, gold: true });
      return { lines, total: lines.reduce((a, l) => a + l.n, 0) };
    },
    // pay it out: one save, so closing the page during the animation loses nothing
    payRun(game, score, q, tagged) {
      const w = tkLoad();
      w.bal += q.total; w.earned += q.total; w.runs++;
      if (!tagged) w.best[game] = Math.max(w.best[game] || 0, score); w.day[game] = pacificDay();
      if (q.lines.some(l => l.gold)) w.golden++;
      if (q.lines.some(l => l.chal)) w.chal[game] = pacificDay();
      tkSave(w); return w.bal;
    },
  };
  // ---- prize catalog (prices approved Nov 25 2026). Later stages add game cosmetics, cheat cards and seasonal items.
  // shelf: junk | collect | top. Every item here can be bought at the counter.
  Tickets.catalog = [
    { id: 'junk.spider', shelf: 'junk', name: 'SPIDER RING', price: 10 },
    { id: 'junk.trap', shelf: 'junk', name: 'FINGER TRAP', price: 15 },
    { id: 'junk.ball', shelf: 'junk', name: 'BOUNCY BALL', price: 20 },
    { id: 'junk.candy', shelf: 'junk', name: 'CANDY NECKLACE', price: 25 },
    { id: 'junk.pencil', shelf: 'junk', name: '"WORLD\'S OK-EST GAMER" PENCIL', price: 30 },
    { id: 'junk.sticky', shelf: 'junk', name: 'STICKY HAND', price: 35 },
    { id: 'junk.kazoo', shelf: 'junk', name: 'KAZOO', price: 40 },
    { id: 'junk.whoopee', shelf: 'junk', name: 'WHOOPEE CUSHION', price: 50 },
    { id: 'junk.slap', shelf: 'junk', name: 'SLAP BRACELET', price: 60 },
    { id: 'junk.mood', shelf: 'junk', name: 'MOOD RING', price: 75 },
    { id: 'junk.clanker', shelf: 'junk', name: 'MINI CLANKER KEYCHAIN', price: 120 },
    { id: 'junk.rat', shelf: 'junk', name: '6-7 RAT SQUISHY', price: 150 },
    { id: 'col.grandma', shelf: 'collect', name: 'GRANDMA KEYCHAIN', price: 400 },

function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      if (r && r.catch) r.catch(() => { });
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { });
    } else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  } catch (e) { }
}

const TOUCH_COL_MIN = 150;
function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let s = Math.min(vw / 1920, vh / 1080);
  if (isCoarse() && vw > vh) s = Math.min((vw - 2 * TOUCH_COL_MIN) / 1920, vh / 1080);
  $('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  document.documentElement.style.setProperty('--cw', Math.max(0, (vw - 1920 * s) / 2) + 'px');
  $('rotate').classList.toggle('on', isCoarse() && vh > vw);

}

function drawHead(p, sp, pal, cx, cy, opt = {}) {

// gang member, front-facing. 32x50 (heavy: 38x54). Returns {px, head:{x,y,w,h}} in sprite px.
function gangPX(sp, palI, outI, pose, opt = {}) {

    pawsAt = [[cx - 2, by + 9], [cx + 1, by + 9]]; gun = 'front';

    A(sL, [sL[0] - 5, by - 4]); A(sR, [sR[0] + 5, by - 4]); pawsAt = [[sL[0] - 6, by - 6], [sR[0] + 5, by - 6]];
  } else if (pose === 'throw') {
    A(sL, [sL[0] - 1, by + 12]); A(sR, [sR[0] + 4, by - 8]); pawsAt = [[sL[0] - 1, by + 13], [sR[0] + 4, by - 9]];

  } else if (opt.pipe) {

    p.line(cx - 12, by - 9 + run, cx + 12, by - 11 - run, '#8a9098', 2); p.line(cx - 12, by - 10 + run, cx + 12, by - 12 - run, '#c4cad2', 1);

    for (let a = 0; a < 8; a++) { const ang = a * Math.PI / 4; p.line(fx, fy, fx + Math.cos(ang) * R * (a % 2 ? .6 : 1), fy + Math.sin(ang) * R * (a % 2 ? .6 : 1), '#ffd23a'); }

  }

function enemyPose(e) {

  if (e.st === 'fire' || e.firing > 0) return 'fire';
  if (e.st === 'aim') return 'aim';
  if (e.st === 'run' || e.st === 'walk' || e.st === 'step') { e.walkT = (e.walkT || 0) + 1; return wf; }

    if (e.at === 'door') x = lerp(e.wallX, e.homeX, e.k || 1);

    { label: goreLabel, action: b => { toggleGore(); b.textContent = goreLabel(); }, cls: 'red' },
    { label: 'FULLSCREEN', action: toggleFullscreen, cls: 'red' },
    { label: 'EXIT TO ARCADE', action: exitToArcade, cls: 'red' },
  ]);
  const best = Best.get();
  $('titleBest').textContent = best ? 'BEST: ' + best.toLocaleString('en-US') : '';
  $('titleHint').innerHTML = isCoarse()
    ? 'LEFT PAD MOVES CHONX &middot; TAP THE SCREEN TO SHOOT &middot; RELOAD + COVER ON THE RIGHT'
    : 'KEYS: WASD MOVE &middot; MOUSE AIM &middot; CLICK FIRE &middot; R / RIGHT CLICK RELOAD &middot; HOLD C OR SPACE COVER &middot; ESC PAUSE<br>' + (Input.pad.on && !Input.pad.ps
      ? 'CONTROLLER: LEFT STICK MOVES &middot; RIGHT STICK AIMS &middot; RT FIRE &middot; X RELOAD &middot; HOLD B COVER &middot; MENU PAUSE'
      : 'CONTROLLER: LEFT STICK MOVES &middot; RIGHT STICK AIMS &middot; R2 FIRE &middot; SQUARE RELOAD &middot; HOLD CIRCLE COVER &middot; OPTIONS PAUSE');
}
function newRun() {
  G.run = { score: 0, cleared: {}, kills: 0, heads: 0, shots: 0, hits: 0, civs: 0, bosses: 0, mange: false, stages: 0 };
  Audio2.startMusic();
  storyPanel(STORY.intro[0], STORY.intro[1], 'TAKE THE CALLS', showSelect);
}
function storyPanel(title, html, btn, then) {
  G.state = 'menu';
  $('stTitle').textContent = title; $('stMsg').innerHTML = html;
  showMenu('story', 'stMenu', [{ label: btn, action: then }]);
}
function showSelect() {
  G.state = 'menu'; canvas.classList.remove('aim');
  const R = G.run, three = STAGES.filter(s => !s.final).every(s => R.cleared[s.id]);
  const card = s => {
    const done = R.cleared[s.id], locked = s.final && !three;
    return { label: '<small>' + s.rank + (done ? ' &middot; CLEARED' : '') + '</small><big>' + s.name + '</big><small>' + (locked ? 'CLEAR ALL 3 CALLS TO UNLOCK' : done ? 'DONE. PICK ANOTHER CALL.' : s.brief.replace(/<[^>]+>/g, '').split('.')[0] + '.') + '</small>',
      cls: done ? 'done' : locked ? 'dis' : (s.final ? 'red' : ''), dis: done || locked, action: () => briefStage(STAGES.indexOf(s)) };
  };
  showMenu('select', 'selMenu', STAGES.map(card), null, { box: 'selBack', items: [{ label: 'END SHIFT', cls: 'red', action: b => { if (G.confirm <= 0) { G.confirm = 180; b.textContent = 'SURE? ENDS THE RUN'; return; } endRun(false); } }] });
  Menu.grid = 1;
  const first = STAGES.findIndex(s => !R.cleared[s.id] && !(s.final && !three)); Menu.idx = first < 0 ? 4 : first; markMenu();
  $('selScore').textContent = 'SCORE ' + R.score.toLocaleString('en-US');
}
function briefStage(si) {
  const s = STAGES[si];
  storyPanel(s.name + (s.final ? '' : ' // ' + s.rank), s.brief, 'ROLL OUT', () => startStage(si));
}
function startStage(si) {
  refreshFX();
  hideScreens(); buildStage(si); PL = newPlayer();
  if (FX.armor) PL.armor = 100;                                     // loadout from the prize counter
  if (FX.gun) { PL.weapon = FX.gun; PL.ammo = WEAPONS[FX.gun].ammo; }
  Cam.x = PL.x + 0.55; Cam.z = PL.z - 1.3; Cam.h = 1.55;
  G.floaters = []; G.banner = null; G.hintT = 0; G.hurtFlash = 0;
  G.state = 'play'; Audio2.resumeMusic(); setTouchUI(true);
  if (Input.dev === 'mouse' || !isCoarse()) canvas.classList.add('aim');
  banner(STG.zones[0].name, '#7fa6ff', 120, STG.def.name + ' // ' + STG.def.rank);
}

// ---------------------------------------------------------------- pause
function pauseGame() {
  G.state = 'paused'; Audio2.pauseMusic(); releaseAllTouch(); canvas.classList.remove('aim');
  showMenu('pause', 'pauseMenu', [
    { label: 'RESUME', action: resumeGame },
    { label: muteLabel, action: b => { Audio2.setMuted(!Audio2.muted); b.textContent = muteLabel(); }, cls: 'red' },
    { label: goreLabel, action: b => { toggleGore(); b.textContent = goreLabel(); }, cls: 'red' },
    { label: 'FULLSCREEN', action: toggleFullscreen, cls: 'red' },
    { label: 'END SHIFT', action: b => { if (G.confirm <= 0) { G.confirm = 180; b.textContent = 'SURE? ENDS THE RUN'; return; } endRun(false); }, cls: 'red' },
  ], resumeGame);
}
function resumeGame() { hideScreens(); G.state = 'play'; Audio2.resumeMusic(); clearEdges(); setTouchUI(true); if (!isCoarse()) canvas.classList.add('aim'); }

// ---------------------------------------------------------------- stage end / run end
function foldStats() { const s = STG.stats, R = G.run; R.kills += s.kills; R.heads += s.heads; R.shots += s.shots; R.hits += s.hits; R.civs += s.civs; }
function stageClear() {
  const s = STG.stats, R = G.run, def = STG.def;
  const acc = s.shots ? s.hits / s.shots : 0, accB = Math.round(5000 * acc), hpB = PL.hp * 20;
  addScore(accB + hpB); foldStats(); R.cleared[def.id] = true; R.stages++;
  G.state = 'menu'; canvas.classList.remove('aim'); setTouchUI(false);
  const row = (a, b, c = '') => '<div class="row ' + c + '"><span>' + a + '</span><span>' + b + '</span></div>';
  $('rsTitle').textContent = def.final ? 'CASE CLOSED' : def.name + ' CLEARED';
  $('rsMsg').innerHTML = def.final ? '' : def.after;
  $('rsStats').innerHTML = row('TAKEDOWNS', s.kills) + row('HEADSHOTS', s.heads) + row('ACCURACY', Math.round(acc * 100) + '%') + (s.civs ? row('CIVILIANS HIT', s.civs, 'red') : '') +
    row('ACCURACY BONUS', '+' + accB.toLocaleString('en-US'), 'gold') + row('HP LEFT x20', '+' + hpB.toLocaleString('en-US'), 'gold') + '<div class="row tot"><span>SCORE</span><span>' + R.score.toLocaleString('en-US') + '</span></div>';
  showMenu('results', 'rsMenu', [{ label: 'CONTINUE', action: () => { if (def.final) storyPanel(STORY.ending[0], STORY.ending[1], 'END OF SHIFT', () => endRun(true)); else showSelect(); } }]);
  Audio2.sfx('clear');
}
function endRun(victory) {
  const R = G.run; if (!R) { showTitle(); return; }
  if (G.state === 'play' || G.state === 'paused') foldStats();
  G.state = 'menu'; canvas.classList.remove('aim'); setTouchUI(false);
  if (R.score > Best.get()) Best.set(R.score);
  const feats = [];
  const bossCount = R.bosses - (R.mange ? 1 : 0);
  if (bossCount > 0) feats.push({ t: 'BOSSES DOWN x' + bossCount, n: 20 * bossCount });
  if (R.mange) feats.push({ t: 'MANGE IN CUFFS', n: 100 });
  const done = () => { G.run = null; showTitle(); };
  if (window.NBScores && R.score > 0) NBScores.submit({ game: 'fiveo', score: R.score, stats: { stages: R.stages, kills: R.kills, heads: R.heads, mange: !!R.mange }, feats, onClose: done });
  else done();
  void victory;
}
function officerDown() {
  const R = G.run; foldStats();
  G.state = 'menu'; canvas.classList.remove('aim'); setTouchUI(false); Audio2.pauseMusic();
  const row = (a, b, c = '') => '<div class="row ' + c + '"><span>' + a + '</span><span>' + b + '</span></div>';
  $('ovTitle').textContent = 'OFFICER DOWN';
  $('ovMsg').innerHTML = '<i>SARGE:</i> "Get up, Chonx. ...Chonx?"';
  $('ovStats').innerHTML = row('CALLS CLEARED', R.stages + ' / 4') + row('TAKEDOWNS', R.kills) + row('HEADSHOTS', R.heads) + row('ACCURACY', (R.shots ? Math.round(R.hits / R.shots * 100) : 0) + '%') + '<div class="row tot"><span>FINAL SCORE</span><span>' + R.score.toLocaleString('en-US') + '</span></div>';
  showMenu('over', 'ovMenu', [{ label: 'CONTINUE', action: () => endRunNoFold() }]);
}
function endRunNoFold() { const s = G.state; G.state = 'menu'; endRun(false); void s; }

// ---------------------------------------------------------------- touch + chips
function setTouchUI(on) {
  const playing = on && G.state === 'play';
  $('touch').classList.toggle('on', playing && isCoarse() && !Input.pad.on);
  $('chips').classList.toggle('on', playing && !isCoarse());
  if (!playing) releaseAllTouch();
}
window.addEventListener('gamepadconnected', () => { setTouchUI(G.state === 'play'); if (G.state === 'title') setTimeout(() => { pollGamepad(); showTitle(); }, 50); });
window.addEventListener('gamepaddisconnected', () => setTouchUI(G.state === 'play'));
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pauseGame(); });

// ---------------------------------------------------------------- loop
function step() {
  if (window.NBScores && NBScores.active) { clearEdges(); return; }
  G.t++;
  if (G.confirm > 0 && --G.confirm === 0) { if (G.state === 'paused') pauseGame(); if ($('select').classList.contains('on')) showSelect(); }
  if (G.state === 'play') {
    if (Input.edge.pause) { pauseGame(); clearEdges(); return; }
    updateAim(); updatePlayer(); updateWaves(); updateEnemies(); updateCivs(); updateProjs();
    if (STG.boss) STG.boss.update();
    updateParts(); updateShells();
    for (let i = Impacts.length - 1; i >= 0; i--) if (--Impacts[i].life <= 0) Impacts.splice(i, 1);
    for (let i = G.floaters.length - 1; i >= 0; i--) if (--G.floaters[i].life <= 0) G.floaters.splice(i, 1);
    if (G.banner && --G.banner.t <= 0) G.banner = null;
    if (G.hintT > 0) G.hintT--;
    if (G.hurtFlash > 0) G.hurtFlash--;
    if (Input.mouse.moved > 0) Input.mouse.moved--;
    STG.zones.forEach(z => { if (z.cleared && z.tape > 0) z.tape = Math.max(0, z.tape - 0.02); });
    if (PL.dead) { PL.deadT++; Cam.h = Math.max(0.35, Cam.h - 0.012); if (PL.deadT > 150) officerDown(); }
    else if (STG.endT > 0 && --STG.endT === 0) stageClear();
  } else if (G.state === 'title') {
    // slow drive down Maple Ave behind the menu
    G.titleZ += 0.03; if (G.titleZ > 30) G.titleZ = 1;
    Cam.x = Math.sin(G.t * 0.004) * 1.5; Cam.z = G.titleZ; Cam.h = 1.6;
  }
  for (const k in Input.edge) Input.edge[k] = false;
}
function render() {
  const inGame = (G.state === 'play' || G.state === 'paused' || G.state === 'menu') && PL && STG && STG.si !== undefined && G.run;
  if (inGame) { renderWorld(); ctx.drawImage(world, 0, 0, 1920, 1080); if (G.state === 'play' || G.state === 'paused') drawHUD(); else { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, 1920, 1080); } }
  else if (STG) {
    renderFloor(G.t); renderWalls();
    const items = [];
    STG.objs.forEach(o => { const fz = o.z - o.d / 2; if (fz - Cam.z > 0.4) items.push({ dz: fz - Cam.z, fn: () => drawBill(o.def.spr(o), o.x, 0, fz) }); });
    STG.props.forEach(p => { if (p.z - Cam.z > 0.4) items.push({ dz: p.z - Cam.z, fn: () => drawBill(PROPS[p.k](), p.x, 0, p.z) }); });
    items.sort((a, b) => b.dz - a.dz).forEach(i => i.fn());
    ctx.drawImage(world, 0, 0, 1920, 1080);
    ctx.fillStyle = 'rgba(0,0,10,.5)'; ctx.fillRect(0, 0, 1920, 1080);
    // siren light sweep
    const a = (G.t % 60) / 60; ctx.fillStyle = a < 0.5 ? 'rgba(255,42,61,.10)' : 'rgba(43,107,255,.12)'; ctx.fillRect(0, 0, 1920, 1080);
  }
}
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  pollGamepad();
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  handleMenus();
  for (const k in Input.menu) Input.menu[k] = false;
  let n = 0;
  while (acc >= STEP && n < 6) { step(); acc -= STEP; n++; }
  if (n >= 6) acc = 0;
  render();
}
function boot() {
  try { Audio2.muted = localStorage.getItem(MUTE_KEY) === '1'; music.muted = Audio2.muted; G.gore = localStorage.getItem(GORE_KEY) === 'low' ? 'low' : 'max'; } catch (e) { }
  buildSprites(); refreshFX();
  const rc = $('rotateChonx'); rc.width = S.chonx.w; rc.height = S.chonx.h; rc.getContext('2d').drawImage(S.chonx.img, 0, 0);
  setupTouch();
  $('cPause').addEventListener('click', e => { e.preventDefault(); if (G.state === 'play') pauseGame(); });
  layout();
  showTitle();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const fontReady = document.fonts && document.fonts.load ? document.fonts.load('20px "Press Start 2P"').catch(() => { }) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 2500))]).then(boot);
</script>
