<!DOCTYPE html>
<html lang="en">
<head>

<title>Neon Bread Studios — Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2306010d'/%3E%3Crect x='3' y='4' width='10' height='9' rx='2' fill='%23ff2bd6'/%3E%3Crect x='5' y='6' width='6' height='5' fill='%2300e5ff'/%3E%3C/svg%3E">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#ff2bd6;--cyan:#00e5ff;--yellow:#ffe14d;--green:#39ff6a;--cw:260px}
html,body{min-height:100%;background:#06010d;color:#fff;font-family:'Press Start 2P',monospace}
body{overflow-x:hidden;-webkit-user-select:none;user-select:none}
body.land{overflow-x:hidden}

/* ---------- the room ---------- */
#room{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  background:radial-gradient(ellipse 80% 55% at 50% 20%,#2a0b4a 0%,#12042a 45%,#06010d 80%)}
#wall{position:absolute;inset:0 0 34% 0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,43,214,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(255,43,214,.06) 2px,transparent 2px);background-size:64px 32px}
#floor{position:absolute;left:-50%;right:-50%;bottom:-12%;height:52%;pointer-events:none;transform-origin:50% 0;transform:perspective(520px) rotateX(62deg);
  background-color:#0b0320;
  background-image:linear-gradient(var(--pink) 3px,transparent 3px),linear-gradient(90deg,var(--pink) 3px,transparent 3px),
    conic-gradient(rgba(0,229,255,.08) 25%,transparent 0 50%,rgba(0,229,255,.08) 0 75%,transparent 0);
  background-size:90px 90px,90px 90px,180px 180px;animation:floorrun 6s linear infinite;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 30%);mask-image:linear-gradient(to bottom,transparent 0%,#000 30%);opacity:.75}
@keyframes floorrun{to{background-position:0 90px,0 0,0 180px}}
#horizon{position:absolute;left:0;right:0;bottom:40%;height:2px;background:var(--pink);box-shadow:0 0 30px 8px rgba(255,43,214,.45);opacity:.6;pointer-events:none}
body.port #horizon,body.port #floor{position:fixed}
#scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}

/* ---------- neon sign ---------- */
#sign{position:relative;z-index:2;text-align:center;margin-top:clamp(18px,4vh,46px)}
#sign h1{font-weight:normal;line-height:1.15}
.tube{display:block;font-size:clamp(14px,4.6vw,72px);letter-spacing:.06em;color:#ffd3f6;
  text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 28px var(--pink),0 0 60px var(--pink)}
.tube.b{font-size:clamp(11px,2.3vw,36px);color:#c9fbff;margin-top:.45em;letter-spacing:.32em;
  text-shadow:0 0 4px #fff,0 0 12px var(--cyan),0 0 26px var(--cyan),0 0 52px var(--cyan)}
.tube .ch{display:inline-block;opacity:.08;text-shadow:none;transition:none}
.tube .ch.lit{opacity:1;text-shadow:inherit}
.tube .ch.lit.fl{animation:buzz 7s infinite}
@keyframes buzz{0%,91%,93%,95%,100%{opacity:1}92%,94%{opacity:.25}}
#tag{margin-top:1.2em;font-size:clamp(9px,1vw,14px);color:var(--yellow);letter-spacing:.12em;text-shadow:0 0 10px rgba(255,225,77,.6);opacity:0;transition:opacity .6s}
#tag.on{opacity:1}

/* ---------- cabinets ---------- */
/* 3D ring of cabinets: the selected one sits front and centre */
#ring{position:relative;z-index:3;flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:clamp(10px,2vh,28px) 0 0;touch-action:pan-y}
#row{position:relative;width:calc(var(--cw) * 1.2);height:calc(var(--cw) * 2.62);perspective:calc(var(--cw) * 6);perspective-origin:50% 40%}
.unit{position:absolute;left:0;top:0;width:calc(var(--cw) * 1.2);display:flex;flex-direction:column;align-items:center;gap:calc(var(--cw) * .05);outline:none;transform-origin:50% 50%;will-change:transform,opacity}
.unit:not(.sel) .tagline,.unit:not(.sel) .hs{opacity:0;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;font-family:inherit;font-size:calc(var(--cw) * .14);width:calc(var(--cw) * .34);height:calc(var(--cw) * .5);background:rgba(6,1,13,.7);color:var(--cyan);border:calc(var(--cw) * .014) solid var(--cyan);cursor:pointer;box-shadow:0 0 16px rgba(0,229,255,.5);display:flex;align-items:center;justify-content:center;padding:0}
.arrow:hover,.arrow:active{background:var(--cyan);color:#06010d}
#arL{left:max(10px,calc(50% - var(--cw) * 2.25))}
#arR{right:max(10px,calc(50% - var(--cw) * 2.25))}
body.port #ring{padding:24px 0 10px}
.cab{position:relative;width:var(--cw);cursor:pointer;transition:transform .18s;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6))}
.unit.sel .cab{transform:translateY(calc(var(--cw) * -.04)) scale(1.04)}
.cab-top{position:relative;height:calc(var(--cw) * .26);margin:0 calc(var(--cw) * .03);background:#120626;border:calc(var(--cw) * .018) solid var(--c);border-bottom:none;
  border-radius:calc(var(--cw) * .05) calc(var(--cw) * .05) 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 0 calc(var(--cw) * .06) var(--c),inset 0 0 calc(var(--cw) * .08) rgba(0,0,0,.8)}
.marq{width:94%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 0 6px var(--c))}
.cab-body{position:relative;background:linear-gradient(90deg,#1a0838 0%,#2a0e52 12%,#16062e 50%,#2a0e52 88%,#1a0838 100%);
  border:calc(var(--cw) * .018) solid var(--c);border-top-width:calc(var(--cw) * .012);padding:calc(var(--cw) * .07) calc(var(--cw) * .07) 0;
  box-shadow:0 0 calc(var(--cw) * .05) var(--c)}
.cab-body::before,.cab-body::after{content:'';position:absolute;top:0;bottom:0;width:calc(var(--cw) * .025);background:repeating-linear-gradient(180deg,var(--c) 0 6%,transparent 6% 12%);opacity:.35}
.cab-body::before{left:calc(var(--cw) * .015)}.cab-body::after{right:calc(var(--cw) * .015)}
.bezel{position:relative;background:#000;border-radius:calc(var(--cw) * .03);padding:calc(var(--cw) * .045);box-shadow:inset 0 0 0 calc(var(--cw) * .012) #3a2466,inset 0 0 calc(var(--cw) * .06) #000}
.scr{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:calc(var(--cw) * .025);background:#000}
.bezel::after{content:'';position:absolute;inset:calc(var(--cw) * .045);border-radius:calc(var(--cw) * .025);pointer-events:none;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.16),transparent 45%),repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 calc(var(--cw) * .05) rgba(0,0,0,.9)}
.panel{position:relative;height:calc(var(--cw) * .2);margin:calc(var(--cw) * .06) calc(var(--cw) * -.1) 0;background:linear-gradient(180deg,#3a1670,#1c0840);
  border:calc(var(--cw) * .014) solid var(--c);clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);display:flex;align-items:center;justify-content:center;gap:calc(var(--cw) * .07)}
.stick{position:relative;width:calc(var(--cw) * .1);height:calc(var(--cw) * .1)}
.stick::before{content:'';position:absolute;left:50%;bottom:20%;width:calc(var(--cw) * .025);height:calc(var(--cw) * .11);background:#ccc;transform:translateX(-50%)}
.stick::after{content:'';position:absolute;left:50%;top:-55%;width:calc(var(--cw) * .085);height:calc(var(--cw) * .085);border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#d1002a);transform:translateX(-50%);box-shadow:0 0 8px #ff2a4a}
.unit.sel .stick::after{animation:wiggle .9s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-80%)}75%{transform:translateX(-20%)}}
.pbtn{width:calc(var(--cw) * .07);height:calc(var(--cw) * .07);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--b));box-shadow:0 0 10px var(--b)}
.coin{height:calc(var(--cw) * .42);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .05)}
.slot{display:flex;gap:calc(var(--cw) * .06)}
.slot i{display:block;width:calc(var(--cw) * .1);height:calc(var(--cw) * .12);background:#0d0420;border:calc(var(--cw) * .01) solid #5a3a90;position:relative}
.slot i::after{content:'';position:absolute;left:44%;top:18%;width:12%;height:64%;background:#ff3b3b;box-shadow:0 0 6px #ff3b3b}
.ins{font-size:calc(var(--cw) * .045);color:var(--yellow);letter-spacing:.08em;opacity:.25;text-shadow:0 0 8px var(--yellow)}
.unit.sel .ins{opacity:1;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.cab-base{height:calc(var(--cw) * .07);margin:0 calc(var(--cw) * -.02);background:#0d0420;border:calc(var(--cw) * .014) solid var(--c);border-top:none;box-shadow:0 0 calc(var(--cw) * .05) var(--c)}
.unit.sel .cab-top,.unit.sel .cab-body,.unit.sel .cab-base{box-shadow:0 0 calc(var(--cw) * .14) var(--c)}
.tagline{width:calc(var(--cw) * 1.15);min-height:3.6em;text-align:center;font-size:calc(var(--cw) * .04);line-height:1.8;color:#d8ccff;text-shadow:0 0 8px rgba(0,0,0,.9)}
.unit.sel .tagline{color:#fff}
.hs{font-family:inherit;font-size:calc(var(--cw) * .045);padding:calc(var(--cw) * .04) calc(var(--cw) * .06);background:rgba(0,0,0,.55);color:var(--c);border:calc(var(--cw) * .012) solid var(--c);cursor:pointer;box-shadow:0 0 12px var(--c);letter-spacing:.06em}
.hs:hover,.hs:focus-visible{background:var(--c);color:#06010d;outline:none}
.hs.ghost{visibility:hidden}
.unit.soon .scr{filter:saturate(.7)}
.unit.shake .cab{animation:shk .35s}
/* ---------- prize counter screen ---------- */
#pc{position:fixed;inset:0;z-index:90;display:none;background:rgba(6,0,18,.92)}
#pc.on{display:block}
#pcP{position:absolute;left:50%;top:50%;transform-origin:50% 50%;display:flex;flex-direction:column;gap:22px;padding:34px 40px;background:#0b0620;border:6px solid #ffb13b;box-shadow:0 0 40px #ffb13b,inset 0 0 40px rgba(0,0,0,.6);font-family:'Press Start 2P',monospace;color:#fff}
#pcP *{box-sizing:border-box;font-family:inherit}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:20px}
.pc-h{font-size:40px;color:#fff1c9;text-shadow:0 0 6px #fff,0 0 18px #ffb13b,0 0 40px #ff8a2b}
.pc-bal{font-size:22px;color:#ffe14d;padding:14px 18px;border:4px solid #5a3a90;background:#0d0420;text-shadow:0 0 10px #ffb000;white-space:nowrap}
.pc-tabs{display:flex;gap:12px;flex-wrap:wrap}
.pc-tab{font-size:18px;padding:14px 18px;background:transparent;color:#a99be0;border:4px solid #3a2f78;cursor:pointer}
.pc-tab.on{color:#0b0620;background:#ffb13b;border-color:#ffb13b;box-shadow:0 0 16px #ffb13b}
.pc-body{display:flex;gap:28px;align-items:stretch;min-height:0;flex:1}
.pc-clerk{width:250px;flex:none;display:flex;flex-direction:column;align-items:center;gap:16px}
.pc-clerk canvas{width:250px;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #ffb13b}
.pc-say{position:relative;width:250px;min-height:96px;background:#fff;color:#1a0f08;font-size:14px;line-height:1.7;padding:12px 14px;border:4px solid #1a0f08}
.pc-say::before{content:'';position:absolute;top:-16px;left:40px;border:8px solid transparent;border-bottom-color:#1a0f08}
.pc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-content:start;overflow-y:auto;overscroll-behavior:contain;padding:6px;scrollbar-width:thin;scrollbar-color:#ffb13b transparent}
.pc-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 8px 12px;background:#140a32;border:4px solid #3a2f78;cursor:pointer;min-height:206px}
.pc-card canvas{width:80px;height:80px;image-rendering:pixelated;image-rendering:crisp-edges}
.pc-card .n{font-size:12px;line-height:1.6;text-align:center;color:#e6deff;min-height:40px}
.pc-card .pr{font-size:16px;color:#ffe14d}
.pc-card.own .pr{color:#5fe0b7}
.pc-card.poor .pr{color:#8a7bd8}
.pc-card.foc{border-color:#ffb13b;box-shadow:0 0 18px #ffb13b;background:#20104a}
.pc-card .tagn{position:absolute;top:8px;right:8px;font-size:10px;padding:4px 6px;background:#5fe0b7;color:#0b0620}
.pc-shelf{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px 10px;align-items:flex-end;padding:12px 14px 8px;background:linear-gradient(transparent calc(100% - 12px),#7a4a24 calc(100% - 12px),#7a4a24 calc(100% - 4px),#4a2810 calc(100% - 4px))}
.pc-shelf canvas{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges}
.pc-empty{grid-column:1/-1;font-size:18px;line-height:2;color:#a99be0;text-align:center;padding:40px 10px}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:20px}
.pc-hint{font-size:13px;color:#7d72b8;line-height:1.9}
.pc-b{font-size:20px;padding:16px 26px;background:rgba(0,0,0,.4);color:#00e5ff;border:5px solid #00e5ff;cursor:pointer;box-shadow:0 0 14px #00e5ff}
.pc-b:hover,.pc-b.foc{background:#00e5ff;color:#0b0620}
.pc-modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,0,18,.82)}
.pc-modal.on{display:flex}
.pc-mbox{display:flex;flex-direction:column;align-items:center;gap:24px;padding:36px 44px;background:#0b0620;border:6px solid #ffb13b;box-shadow:0 0 30px #ffb13b;text-align:center;max-width:820px}
.pc-mbox canvas{width:128px;height:128px;image-rendering:pixelated;image-rendering:crisp-edges}
.pc-mq{font-size:24px;line-height:1.7}
.pc-mrow{display:flex;gap:22px}
.pc-mb{font-size:24px;padding:18px 34px;background:transparent;color:#ffb13b;border:5px solid #ffb13b;cursor:pointer}
.pc-mb.foc,.pc-mb:hover{background:#ffb13b;color:#0b0620}
#pcP.portrait .pc-body{flex-direction:column}
#pcP.portrait .pc-clerk{width:100%;flex-direction:row;justify-content:center}
#pcP.portrait .pc-clerk canvas{width:170px}
#pcP.portrait .pc-say{width:auto;flex:1}
#pcP.portrait .pc-grid{grid-template-columns:repeat(3,1fr)}
#pcP.portrait .pc-top{flex-direction:column;align-items:flex-start}
.pc-shake{animation:shk .35s}

/* ---------- the prize counter (7th spot on the ring) ---------- */
.ctr{position:relative;width:var(--cw);cursor:pointer;transition:transform .18s;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6))}
.unit.sel .ctr{transform:translateY(calc(var(--cw) * -.04)) scale(1.04)}
.ctr-sign{height:calc(var(--cw) * .26);margin:0 calc(var(--cw) * .03);display:flex;align-items:center;justify-content:center;background:#120626;
  border:calc(var(--cw) * .018) solid var(--c);border-bottom:none;border-radius:calc(var(--cw) * .05) calc(var(--cw) * .05) 0 0;box-shadow:0 0 calc(var(--cw) * .06) var(--c)}
.ctr-sign b{font-weight:normal;font-size:calc(var(--cw) * .1);color:#fff6c2;letter-spacing:.08em;text-shadow:0 0 4px #fff,0 0 10px var(--c),0 0 24px var(--c),0 0 44px #ff8a2b}
.unit.sel .ctr-sign b{animation:buzz 6s infinite}
.ctr-scene{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;border:calc(var(--cw) * .018) solid var(--c);border-top-width:calc(var(--cw) * .012);box-shadow:0 0 calc(var(--cw) * .05) var(--c);background:#1b0b33}
.unit.sel .ctr-scene,.unit.sel .ctr-sign{box-shadow:0 0 calc(var(--cw) * .14) var(--c)}
.ctr-bal{margin:calc(var(--cw) * .04) auto 0;width:86%;text-align:center;font-size:calc(var(--cw) * .05);line-height:1.7;padding:calc(var(--cw) * .025) 0;color:var(--yellow);
  background:#0d0420;border:calc(var(--cw) * .012) solid #5a3a90;text-shadow:0 0 8px var(--yellow)}
.unit.sel .ctr-bal{border-color:var(--c)}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- top bar + footer ---------- */
#bar{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:60;display:flex;gap:10px}
.chip{font-family:inherit;font-size:11px;padding:10px 12px;background:rgba(6,1,13,.75);color:var(--cyan);border:3px solid var(--cyan);cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.5)}
.chip:hover{background:var(--cyan);color:#06010d}
#help{position:relative;z-index:3;font-size:clamp(8px,.75vw,11px);color:#8f82c9;line-height:2;text-align:center;padding:0 16px;margin-top:clamp(8px,2vh,20px)}
footer{position:relative;z-index:3;font-size:clamp(8px,.75vw,11px);color:#6b5fa3;padding:clamp(10px,2vh,22px) 0 max(14px,env(safe-area-inset-bottom));letter-spacing:.1em}
body.port #help{display:none}
body.port #arL{left:max(6px,env(safe-area-inset-left))}
body.port #arR{right:max(6px,env(safe-area-inset-right))}
body.port #sign{margin-top:calc(max(10px,env(safe-area-inset-top)) + 52px)}
.tagline span,#help span,footer span{background:rgba(6,1,13,.82);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 6px}
#flash{position:fixed;inset:0;z-index:70;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#flash.on{opacity:.9;transition:none}
#toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);z-index:65;font-size:14px;padding:14px 20px;background:#06010d;border:3px solid var(--pink);color:var(--pink);box-shadow:0 0 18px var(--pink);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
<script id="nb-scores">
/* NB-SCORES START v1 — Neon Bread Arcade global leaderboards.
   Canonical copy: LogicNerds/neonbread/shared/nb-scores.js. Each game inlines this block
   between the NB-SCORES START / END markers so every game stays one self-contained file.
   Backend: Firestore (project neon-bread-arcade) over its REST API. No sign-in, no SDK. */
(function () {
  'use strict';
  if (window.NBScores) return;
  const PROJECT = 'neon-bread-arcade';
  const BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
  const GAMES = {
    chonx: { title: "CHONX '26", color: '#39ff6a' },
    yeet: { title: 'YEET THE BABY', color: '#ff6b9d' },
    gta: { title: 'GRANDMA THEFT AUTOMATIC', color: '#ffcc4d' },
    karen: { title: 'BODY THE KAREN', color: '#00e5ff' },
    cheekyops: { title: 'CHONX: CHEEKY OPS', color: '#ff2a3d' },
    pedxing: { title: 'PED X-ING', color: '#d4ff00' },
  };
  const ARCADE_URL = 'https://www.neonbreadent.com/';
  const NAME_LEN = 6;
  const CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const NAME_KEY = 'nb_name';

  // ---------------------------------------------------------------- name filter
  // Slurs are blocked; swearing is fine. Checked after undoing common letter swaps (0->O, 1->I ...).
  // The same lists live in the Firestore rules as a second line of defence.
  const SUB = ['nigg', 'nigr', 'niga', 'fagot', 'faggot', 'faggt', 'kike', 'kyke', 'trann', 'trany', 'retard', 'wetbac', 'beaner', 'raghea', 'chink'];
  const EXACT = ['nig', 'fag', 'fags', 'spic', 'spics', 'spick', 'coon', 'coons', 'gook', 'gooks', 'dyke', 'dykes', 'jap', 'japs', 'paki', 'pakis', 'wop', 'wops', 'kkk'];

    if (!NB.active) return;
    const inp = e.target && e.target.id === 'nbsIn';
    if (inp && e.key !== 'Enter' && e.key !== 'Escape') return; // phone keyboard typing goes through the input event
    const k = e.code, map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyW: 'up', KeyS: 'down', Enter: 'start', NumpadEnter: 'start', Escape: 'b', Backspace: 'bs', Tab: 'tab', Space: 'a' };
    let act = map[k];
    if (NB._mode === 'enter') {
      if (/^Key[A-Z]$/.test(k) || /^Digit[0-9]$/.test(k) || /^Numpad[0-9]$/.test(k)) act = 'type:' + k.slice(-1);
      if (k === 'KeyW' || k === 'KeyS') act = 'type:' + k.slice(-1);
      if (k === 'Space') act = 'right';
    } else if (k === 'KeyA') act = 'left'; else if (k === 'KeyD') act = 'right';
    if (NB._mode === 'board' && (k === 'Enter' || k === 'NumpadEnter')) act = 'a'; // Enter presses the highlighted button
    setDev('key');
    e.preventDefault(); e.stopImmediatePropagation();
    if (act && !e.repeat || (act && /^(up|down|left|right|bs)$/.test(act))) NB._act(act);
  }, true);

  // a focused game button behind the overlay must not fire on Space/Enter release
  window.addEventListener('keyup', e => {
    if (NB.active && (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') && !(e.target && root && root.contains(e.target))) e.preventDefault();
  }, true);

  // ---------------------------------------------------------------- the overlay
  const NB = {
    active: false, _mode: null, _dev: null, _cache: {},
    GAMES, ARCADE_URL, weekKey, weekLabel, blocked, clean, post, top, page, rank, tickets: Tickets,
    exitToArcade() { location.href = ARCADE_URL; },

    // After every run: name entry -> post -> board. onClose fires when the player continues.
    submit(opt) {
      const game = opt.game, score = Math.max(0, Math.floor(+opt.score || 0));
      ensureDom(); open(game);
      let last = ''; try { last = clean(localStorage.getItem(NAME_KEY)); } catch (e) { }
      const chars = (last || '').padEnd(NAME_LEN, ' ').split('');
      // last name used on this device is pre-filled; typing a new letter first replaces it
      const st = { game, score, chars, cur: 0, onClose: opt.onClose, err: '', fresh: !!last, tk: opt.tickets !== false, feats: opt.feats || [] };
      NB._st = st; NB._mode = 'enter';
      renderEnter();
    },

    // View-only boards (used by the arcade page). onClose optional.
    showBoard(opt) {
      ensureDom(); open(opt.game);
      NB._st = { game: opt.game, score: null, myId: null, onClose: opt.onClose, scope: opt.scope || 'week', ranks: null };
      NB._mode = 'board';
      renderBoard();
    },

    _act(a) {
      const st = NB._st; if (!st) return;
      if (NB._mode === 'enter') return actEnter(a);
      if (NB._mode === 'board') return actBoard(a);
      if (NB._mode === 'error') return actError(a);
      if (NB._mode === 'tickets') return actTickets(a);
    },
  };
  window.NBScores = NB;

  function open(game) {
    const g = GAMES[game] || { color: '#ff4bd8' };
    root.style.setProperty('--nbc', g.color);
    root.classList.add('on'); NB.active = true; NB._cache = {};
    Ctl.prev = padState();
    const unfocus = () => { const a = document.activeElement; if (NB.active && a && a !== document.body && !root.contains(a) && a.blur) a.blur(); };
    unfocus(); setTimeout(unfocus, 60); setTimeout(unfocus, 200);
    if (!raf) raf = requestAnimationFrame(loop);
    fit();
  }
  function close() {
    const s0 = NB._st;
    if (s0 && s0.tk && !s0.tkShown && s0.score != null) { s0.tkShown = true; return showTickets(); }
    root.classList.remove('on'); NB.active = false; NB._mode = null;
    const cb = NB._st && NB._st.onClose; NB._st = null; panel.innerHTML = '';
    if (cb) setTimeout(cb, 0);
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => Number(n).toLocaleString('en-US');

  // ---- name entry
  function nameNow(st) { return st.chars.join('').replace(/\s+$/, '').replace(/ /g, ''); }
  function renderEnter() {
    const st = NB._st, g = GAMES[st.game];
    const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    let slots = '';
    for (let i = 0; i < NAME_LEN; i++) {
      slots += '<div class="nbs-slot"><button class="nbs-ar" data-up="' + i + '">&#9650;</button><div class="nbs-ch' + (i === st.cur ? ' cur' : '') + '" data-ch="' + i + '">' +
        (st.chars[i] === ' ' ? '&middot;' : esc(st.chars[i])) + '</div><button class="nbs-ar" data-dn="' + i + '">&#9660;</button></div>';
    }
    panel.innerHTML =
      '<div class="nbs-k">' + esc(g.title) + ' &middot; GLOBAL HIGH SCORES</div>' +
      '<div class="nbs-h">ENTER YOUR NAME</div>' +
      '<div class="nbs-s">' + fmt(st.score) + '</div>' +
      '<div class="nbs-slots">' + slots + '<input id="nbsIn" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>' +
      '<div class="nbs-e">' + esc(st.err) + '</div>' +
      '<div class="nbs-row"><button class="nbs-b sel" data-ok="1">POST SCORE</button></div>' +
      '<div class="nbs-hint">' + hintFor('enter') + '</div>';
    panel.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { st.cur = +b.dataset.up; cycle(1); });
    panel.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { st.cur = +b.dataset.dn; cycle(-1); });
    const inp = panel.querySelector('#nbsIn');
    panel.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
      st.cur = +b.dataset.ch; renderEnter();
      if (touch) { const i2 = panel.querySelector('#nbsIn'); i2.value = nameNow(st); try { i2.focus({ preventScroll: true }); } catch (e) { i2.focus(); } }
    });
    // phone keyboard: update the letters in place so the input keeps focus (and the keyboard stays up)
    inp.addEventListener('input', () => {
      const v = clean(inp.value); if (inp.value !== v) inp.value = v;
      st.chars = v.padEnd(NAME_LEN, ' ').split(''); st.cur = Math.min(v.length, NAME_LEN - 1); st.err = ''; st.fresh = false;
      panel.querySelectorAll('[data-ch]').forEach((el, i) => { el.innerHTML = st.chars[i] === ' ' ? '&middot;' : esc(st.chars[i]); el.classList.toggle('cur', i === st.cur); });
      panel.querySelector('.nbs-e').textContent = '';
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); submitName(); } });
    panel.querySelector('[data-ok]').onclick = submitName;
    fit();
  }
  function cycle(d) {
    const st = NB._st; st.fresh = false; let i = CHARS.indexOf(st.chars[st.cur]); if (i < 0) i = 0;
    st.chars[st.cur] = CHARS[(i + d + CHARS.length) % CHARS.length]; st.err = ''; blip(660, 0.04); renderEnter();
  }
  function actEnter(a) {
    const st = NB._st;
    if (a.indexOf('type:') !== 0 && a !== 'start') st.fresh = false;
    if (a === 'up') return cycle(1);
    if (a === 'down') return cycle(-1);
    if (a === 'left') { st.cur = Math.max(0, st.cur - 1); blip(520, 0.04); return renderEnter(); }
    if (a === 'right') { st.cur = Math.min(NAME_LEN - 1, st.cur + 1); blip(520, 0.04); return renderEnter(); }
    if (a === 'a') { if (st.cur === NAME_LEN - 1) return submitName(); st.cur++; blip(520, 0.04); return renderEnter(); }
    if (a === 'b' || a === 'bs') {
      if (a === 'bs' && st.chars[st.cur] === ' ' && st.cur > 0) st.cur--;
      if (a === 'bs') st.chars[st.cur] = ' ';
      else st.cur = Math.max(0, st.cur - 1);
      return renderEnter();
    }
    if (a === 'start') return submitName();
    if (a.indexOf('type:') === 0 && st.fresh) { st.chars = ' '.repeat(NAME_LEN).split(''); st.cur = 0; }
    if (a.indexOf('type:') === 0) { st.fresh = false; st.chars[st.cur] = a.slice(5); st.err = ''; st.cur = Math.min(NAME_LEN - 1, st.cur + 1); blip(700, 0.04); return renderEnter(); }
  }
  function submitName() {
    const st = NB._st; if (!st || NB._mode !== 'enter') return;
    const name = clean(nameNow(st));
    if (!name) { st.err = 'PICK AT LEAST ONE LETTER'; blip(180, 0.15); return renderEnter(); }
    if (blocked(name)) { st.err = 'THAT NAME IS NOT ALLOWED'; blip(180, 0.15); return renderEnter(); }
    try { localStorage.setItem(NAME_KEY, name); } catch (e) { }
    st.name = name; doPost();
  }
  function doPost() {
    const st = NB._st;
    NB._mode = 'posting';
    panel.innerHTML = '<div class="nbs-h">POSTING...</div><div class="nbs-m">' + esc(st.name) + ' &middot; ' + fmt(st.score) + '</div>';
    fit(); blip(880, 0.08);
    post(st.game, st.name, st.score).then(id => {
      st.myId = id; st.scope = 'week'; st.view = 'top'; NB._cache = {};
      return Promise.all([rank(st.game, 'week', st.score).catch(() => null), rank(st.game, 'all', st.score).catch(() => null)]);
    }).then(r => {
      if (!NB._st) return;
      st.ranks = { week: r[0], all: r[1] }; NB._mode = 'board'; blip(1040, 0.12);
      renderBoard();
    }).catch(err => {
      if (!NB._st) return;
      NB._mode = 'error'; st.errMsg = String(err && err.message || err);
      panel.innerHTML = '<div class="nbs-h">NO SIGNAL</div><div class="nbs-m">COULDN\'T REACH THE LEADERBOARD.<br>YOUR SCORE WASN\'T POSTED.</div>' +
        '<div class="nbs-row"><button class="nbs-b sel" data-r="1">TRY AGAIN</button><button class="nbs-b alt" data-c="1">CONTINUE</button></div>';
      panel.querySelector('[data-r]').onclick = doPost;
      panel.querySelector('[data-c]').onclick = close;
      st.errSel = 0; fit();
    });
  }
  function actError(a) {
    const st = NB._st, bs = panel.querySelectorAll('.nbs-b');
    if (a === 'left' || a === 'right' || a === 'up' || a === 'down' || a === 'tab') { st.errSel = 1 - (st.errSel || 0); bs.forEach((b, i) => b.classList.toggle('sel', i === st.errSel)); }
    if (a === 'a' || a === 'start') bs[st.errSel || 0].click();
    if (a === 'b') close();
  }

  // ---- boards
  // Both tabs show the top 100. ALL SCORES lists every all-time score, 100 more each time the list nears the bottom.
  // Lists are kept for as long as the overlay is open, so flipping tabs doesn't re-read them.
  // Controls in highlight order: THIS WEEK, ALL-TIME, ALL SCORES / TOP 100, CONTINUE.
  function renderBoard() {
    const st = NB._st, g = GAMES[st.game];
    st.view = st.view || 'top'; if (st.foc == null) st.foc = 3;
    const posted = st.score != null, every = st.view === 'every';
    let rk = '';
    if (posted && st.ranks) rk = 'YOU PLACED ' + (st.ranks.week ? '#' + st.ranks.week : '?') + ' THIS WEEK &middot; ' + (st.ranks.all ? '#' + st.ranks.all : '?') + ' ALL-TIME';
    const sub = st.scope === 'week' ? weekLabel(weekKey()) + ' &middot; TOP 100 &middot; RESETS MONDAY'
      : every ? 'EVERY SCORE &middot; SINCE THE DOORS OPENED' : 'TOP 100 &middot; SINCE THE DOORS OPENED';
    panel.innerHTML =
      '<div class="nbs-k">' + esc(g.title) + '</div>' +
      '<div class="nbs-h">HIGH SCORES</div>' +
      (rk ? '<div class="nbs-m nbs-rk">' + rk + '</div>' : '') +
      '<div class="nbs-tabs"><button class="nbs-tab nbs-c' + (st.scope === 'week' ? ' on' : '') + '" data-t="week">THIS WEEK</button><button class="nbs-tab nbs-c' + (st.scope === 'all' ? ' on' : '') + '" data-t="all">ALL-TIME</button></div>' +
      '<div class="nbs-m" style="font-size:16px;color:#7d72b8">' + sub + '</div>' +
      '<div class="nbs-list"><div class="nbs-m">LOADING...</div></div>' +
      '<div class="nbs-row"><button class="nbs-b alt nbs-c" data-x="1">' + (every ? 'TOP 100' : 'ALL SCORES') + '</button><button class="nbs-b nbs-c" data-c="1">CONTINUE</button></div>' +
      '<div class="nbs-hint">' + hintFor('board') + '</div>';
    panel.querySelectorAll('[data-t]').forEach((b, i) => b.onclick = () => { st.foc = i; pickTab(b.dataset.t); });
    panel.querySelector('[data-x]').onclick = () => { st.foc = 2; toggleEvery(); };
    panel.querySelector('[data-c]').onclick = close;
    const list = panel.querySelector('.nbs-list');
    list.addEventListener('scroll', maybeMore, { passive: true });
    paintFoc(); fit();
    loadList();
  }
  function paintFoc() {
    const st = NB._st;
    panel.querySelectorAll('.nbs-c').forEach((el, i) => { el.classList.toggle('nbs-foc', i === st.foc); if (el.classList.contains('nbs-b')) el.classList.toggle('sel', i === st.foc); });
  }
  function pickTab(scope) { const st = NB._st; st.scope = scope; st.view = 'top'; blip(520, 0.04); renderBoard(); }
  function toggleEvery() {
    const st = NB._st; blip(620, 0.05);
    if (st.view === 'every') st.view = 'top'; else { st.view = 'every'; st.scope = 'all'; }
    renderBoard();
  }
  function rowHtml(r, i) {
    const st = NB._st;
    return '<div class="nbs-li' + (r.id === st.myId ? ' me' : i < 3 ? ' r' + (i + 1) : '') + '"><span>' + (i + 1) + '.</span><span>' + esc(r.name) + '</span><span>' + fmt(r.score) + '</span></div>';
  }
  function current() { const st = NB._st; return st.view === 'every' ? 'every' : st.scope; }
  function loadList() {
    const st = NB._st, key = current(), C = NB._cache;
    if (key === 'every') {
      const E = C.every = C.every || { rows: [], done: false, loading: false, err: false };
      if (E.rows.length || E.done) return drawList(true);
      return more();
    }
    if (C[key]) return drawList(true);
    top(st.game, key, 100).then(rows => {
      C[key] = rows;
      if (NB._st === st && NB._mode === 'board' && current() === key) drawList(true);
    }).catch(() => {
      if (NB._st !== st || NB._mode !== 'board' || current() !== key) return;
      panel.querySelector('.nbs-list').innerHTML = '<div class="nbs-m">COULDN\'T LOAD SCORES.</div>';
    });
  }
  function drawList(first) {
    const st = NB._st, key = current(), list = panel.querySelector('.nbs-list'); if (!list) return;
    const every = key === 'every', E = NB._cache.every;
    const rows = every ? E.rows : NB._cache[key] || [];
    if (!rows.length && (!every || E.done)) { list.innerHTML = '<div class="nbs-m">NO SCORES YET. BE THE FIRST.</div>'; return; }
    const keep = list.scrollTop;
    let foot = '';
    if (every) foot = '<div class="nbs-more">' + (E.loading ? 'LOADING MORE...' : E.err ? 'COULDN\'T LOAD MORE &middot; SCROLL TO RETRY' : E.done ? 'END OF LIST &middot; ' + fmt(rows.length) + ' SCORES' : '&#9660; MORE BELOW') + '</div>';
    list.innerHTML = rows.map(rowHtml).join('') + foot;
    if (first) { list.scrollTop = 0; const me = list.querySelector('.me'); if (me) me.scrollIntoView({ block: 'nearest' }); }
    else list.scrollTop = keep;
  }
  function more() {
    const st = NB._st, E = NB._cache.every;
    if (!E || E.loading || E.done) return;
    E.loading = true; E.err = false;
    if (E.rows.length) drawList(false); else panel.querySelector('.nbs-list').innerHTML = '<div class="nbs-m">LOADING...</div>';
    page(st.game, E.rows[E.rows.length - 1]).then(rows => {
      if (NB._cache.every !== E) return;
      E.loading = false; E.rows = E.rows.concat(rows); if (rows.length < PAGE) E.done = true;
      if (NB._st === st && NB._mode === 'board' && current() === 'every') { drawList(E.rows.length === rows.length); maybeMore(); }
    }).catch(() => {
      if (NB._cache.every !== E) return;
      E.loading = false; E.err = true;
      if (NB._st !== st || NB._mode !== 'board' || current() !== 'every') return;
      if (E.rows.length) drawList(false); else panel.querySelector('.nbs-list').innerHTML = '<div class="nbs-m">COULDN\'T LOAD SCORES.</div>';
    });
  }
  // load the next 100 once the list is scrolled near its bottom (or is too short to scroll)
  function maybeMore() {
    if (!NB._st || NB._mode !== 'board' || current() !== 'every') return;
    const l = panel.querySelector('.nbs-list'); if (!l) return;
    if (l.scrollTop + l.clientHeight >= l.scrollHeight - 260) more();
  }
  function actBoard(a) {
    const st = NB._st;
    if (a === 'left' || a === 'right') { st.foc = (st.foc + (a === 'right' ? 1 : 3)) % 4; blip(520, 0.04); return paintFoc(); }
    if (a === 'lb' || a === 'rb') return pickTab(st.scope === 'week' ? 'all' : 'week');
    if (a === 'up' || a === 'down') { const l = panel.querySelector('.nbs-list'); if (l) { l.scrollTop += a === 'down' ? 120 : -120; maybeMore(); } return; }
    if (a === 'tab' || a === 'y' || a === 'x') return toggleEvery();
    if (a === 'a') { const c = panel.querySelectorAll('.nbs-c')[st.foc]; if (c) c.click(); return; }
    if (a === 'b') { if (st.view === 'every') return toggleEvery(); return close(); }
    if (a === 'start') return close();
  }

  // ---- ticket payout: a strip pours out of the slot while the counter ticks up
  function tkSound(kind) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t = actx.currentTime;
      if (kind === 'tick') { // printer: a short burst of filtered noise
        const len = Math.floor(actx.sampleRate * 0.035), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
        f.type = 'bandpass'; f.frequency.value = 2400; g.gain.value = 0.09; src.buffer = buf;
        src.connect(f); f.connect(g); g.connect(actx.destination); src.start(t);
      } else {
        const seq = kind === 'gold' ? [784, 988, 1175, 1568, 1976] : kind === 'done' ? [880, 1319] : [1047];
        seq.forEach((fr, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = fr; g.gain.setValueAtTime(0.05, t + i * 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.08 + 0.14); o.connect(g); g.connect(actx.destination); o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.16); });
      }
    } catch (e) { }
  }
  function showTickets() {
    const st = NB._st;
    let q;
    try { q = Tickets.quote(st.game, st.score, st.ranks, st.feats); } catch (e) { st.tk = false; return close(); }
    const before = Tickets.balance();
    Tickets.payRun(st.game, st.score, q);
    const gold = q.lines.some(l => l.gold);
    st.tq = { q, before, shown: 0, line: 0, t0: performance.now(), done: false };
    NB._mode = 'tickets';
    panel.innerHTML =
      '<div class="nbs-k">' + esc((GAMES[st.game] || {}).title || '') + '</div>' +
      '<div class="nbs-h">TICKETS!</div>' +
      '<div class="nbt-wrap"><div class="nbt-mach"><div class="nbt-slot"></div><div class="nbt-strip' + (gold ? ' gold' : '') + '"></div></div>' +
      '<div class="nbt-side"><div class="nbt-count">0</div><div class="nbt-lines">' +
      q.lines.map(l => '<div class="nbt-l' + (l.gold ? ' gold' : '') + '"><span>' + esc(l.t) + '</span><b>+' + fmt(l.n) + '</b></div>').join('') +
      '</div><div class="nbt-bal">TICKETS ON THIS DEVICE: ' + fmt(before) + '</div></div></div>' +
      '<div class="nbs-row"><button class="nbs-b sel" data-c="1">SKIP</button></div>' +
      '<div class="nbs-hint">' + tkHint() + '</div>';
    const strip = panel.querySelector('.nbt-strip');
    strip.innerHTML = Array.from({ length: 40 }, () => '<span>NEON BREAD</span>').join('');
    panel.querySelector('[data-c]').onclick = () => actTickets('a');
    fit(); tkSound('start');
    requestAnimationFrame(tkStep);
  }
  function tkHint() { const d = dev(); return d === 'pad' ? P('CROSS', 'A') + ' SKIP / CONTINUE' : d === 'touch' ? 'TAP TO SKIP / CONTINUE' : 'ENTER SKIP / CONTINUE'; }
  // lines appear one after another; the counter runs up to the running total of the lines shown so far
  function tkStep(now) {
    const st = NB._st; if (!st || NB._mode !== 'tickets' || !st.tq || st.tq.done) return;
    const tq = st.tq, lines = tq.q.lines, el = panel.querySelectorAll('.nbt-l');
    const per = 650, k = Math.max(0, (now - tq.t0) / per);  // a frame's timestamp can be a hair before t0
    const li = Math.min(lines.length, Math.floor(k) + 1);
    for (let i = 0; i < li; i++) if (!el[i].classList.contains('on')) { el[i].classList.add('on'); if (lines[i].gold) tkSound('gold'); }
    let target = 0; for (let i = 0; i < li; i++) target += lines[i].n;
    const prevTarget = target - lines[li - 1].n, frac = Math.min(1, (k - (li - 1)) * 1.6);
    const val = Math.round(prevTarget + (target - prevTarget) * frac);
    if (val !== tq.shown) { if (now - (tq.tick || 0) > 45) { tq.tick = now; tkSound('tick'); } tq.shown = val; tkPaint(val); }
    if (li === lines.length && frac >= 1) return tkFinish();
    requestAnimationFrame(tkStep);
  }
  function tkPaint(val) {
    const st = NB._st, c = panel.querySelector('.nbt-count'), strip = panel.querySelector('.nbt-strip');
    if (c) c.textContent = fmt(val);
    if (strip) strip.style.height = Math.min(480, 12 + val * 6) + 'px';
  }
  function tkFinish() {
    const st = NB._st, tq = st.tq; tq.done = true;
    panel.querySelectorAll('.nbt-l').forEach(e => e.classList.add('on'));
    tkPaint(tq.q.total);
    const bal = panel.querySelector('.nbt-bal'); if (bal) bal.textContent = 'TICKETS ON THIS DEVICE: ' + fmt(tq.before + tq.q.total);
    const b = panel.querySelector('[data-c]'); if (b) b.textContent = 'CONTINUE';
    tkSound('done');
  }
  function actTickets(a) {
    const st = NB._st; if (!st || !st.tq) return;
    if (!(a === 'a' || a === 'start' || a === 'b')) return;
    if (!st.tq.done) return tkFinish();
    close();
  }
})();

// A button only counts when it goes from up to down while this page is watching. Whenever the page
// first sees the controller (fresh load, back button, tab shown again, controller reconnected),
// buttons already held are recorded and ignored until they're released, so a Cross held from
// EXIT TO ARCADE, or a stale/stuck reading, can't insert a coin.
let padPrev = { block: true };
const padReset = () => { padPrev = { block: true }; };
function pollPad() {
  if (window.NBScores && NBScores.active) { padReset(); return; }
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null; for (const p of pads || []) if (p && p.connected) { gp = p; break; }
  if (!gp) { padReset(); return; }
  const b = i => { const x = gp.buttons[i]; return !!x && (x.pressed || x.value > .5); };
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const s = { l: b(14) || ax < -.5, r: b(15) || ax > .5, u: b(12) || ay < -.5, d: b(13) || ay > .5, a: b(0) || b(9), y: b(3) || b(2), b: b(1), lb: b(4), rb: b(5) };
  if (padPrev.block) { padPrev = s; return; }   // just closed the scores overlay: ignore buttons still held
  const hit = k => s[k] && !padPrev[k];
  if (PC.open) {
    ['l', 'r', 'u', 'd', 'lb', 'rb'].forEach(k => { if (hit(k)) pcAct(k); });
    if (hit('a')) pcAct('a'); if (hit('b')) pcAct('b');
    padPrev = s; return;
  }
  const port = document.body.classList.contains('port');
  if (hit('r')) rot(1);
  if (hit('l')) rot(-1);
  if (hit('a')) { Snd.unlock(); insertCoin(); }
  if (hit('y')) { Snd.unlock(); openScores(); }
  padPrev = s;
}

// ---------------------------------------------------------------- sound (quiet ambient arcade hum + blips)
const Snd = {
  ctx: null, master: null, on: true, started: false,
  init() { try { this.on = localStorage.getItem('nb_arcade_sound') !== '0'; } catch (e) { } this.label(); },
  label() { $('snd').textContent = 'SOUND: ' + (this.on ? 'ON' : 'OFF'); },
  unlock() {
    if (!this.on) return;
    try {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.05; this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      if (!this.started) { this.started = true; this.ambient(); }
    } catch (e) { }
  },
  toggle() {
    this.on = !this.on; try { localStorage.setItem('nb_arcade_sound', this.on ? '1' : '0'); } catch (e) { }
    this.label();
    if (this.on) { this.unlock(); if (this.master) this.master.gain.value = 0.05; }
    else if (this.master) this.master.gain.value = 0;
  },
  tone(f, d, type = 'square', v = .5, when = 0, slide = 0) {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .05);
  },
  blip(f, d, v = .4) { this.tone(f, d, 'square', v); },
  coin() { this.tone(988, .08, 'square', .9); this.tone(1319, .5, 'square', .9, .08); },
  ambient() {
    // a slow minor arpeggio pad, plus far-off cabinet bleeps now and then
    const c = this.ctx, lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(this.master);
    const notes = [110, 130.81, 164.81, 196, 164.81, 130.81, 98, 123.47, 146.83, 196, 146.83, 123.47];
    let i = 0;
    const tick = () => {
      if (!this.ctx) return;
      if (this.on && !document.hidden) {
        const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.value = notes[i % notes.length] * 2;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.35, t + .05); g.gain.exponentialRampToValueAtTime(0.0001, t + .9);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t + 1);
        if (i % 4 === 0) { const b = c.createOscillator(), bg = c.createGain(); b.type = 'sine'; b.frequency.value = notes[i % notes.length] / 2; bg.gain.setValueAtTime(.4, t); bg.gain.exponentialRampToValueAtTime(.0001, t + 1.6); b.connect(bg); bg.connect(lp); b.start(t); b.stop(t + 1.7); }
        if (Math.random() < .12) { const f = [523, 659, 784, 1047, 392][(Math.random() * 5) | 0]; this.tone(f, .06, 'square', .12, Math.random() * .3); this.tone(f * 1.5, .06, 'square', .1, .1 + Math.random() * .3); }
        i++;
      }

    };

  },
};

// swipe left / right on the ring
let swipe = null;
$('ring').addEventListener('pointerdown', e => { if (e.target.closest('.arrow')) return; swipe = { x: e.clientX, y: e.clientY, id: e.pointerId }; swiped = false; });
$('ring').addEventListener('pointermove', e => {
  if (!swipe || swipe.id !== e.pointerId) return;
  const dx = e.clientX - swipe.x;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(e.clientY - swipe.y)) { Snd.unlock(); rot(dx < 0 ? 1 : -1); swiped = true; swipe = null; }
});
const endSwipe = () => { swipe = null; setTimeout(() => { swiped = false; }, 50); };
$('ring').addEventListener('pointerup', endSwipe); $('ring').addEventListener('pointercancel', endSwipe);
['pointerdown', 'touchend'].forEach(ev => addEventListener(ev, () => Snd.unlock(), { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) padReset(); if (!Snd.ctx) return; if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume(); });
// coming back with the browser's back button: reset the coin animation
addEventListener('pageshow', () => { paintBalance(); padReset(); leaving = false; $('flash').classList.remove('on'); units.forEach(u => u.credit = 0); refreshScores(); });

// ---------------------------------------------------------------- layout
function layout() {
  const vw = innerWidth, vh = innerHeight, port = vh > vw * 1.05 || vw < 640;
  document.body.classList.toggle('port', port); document.body.classList.toggle('land', !port);
  let cw;
  if (port) cw = Math.min(vw * .52, 300, (vh - 220) / 2.75);
  else {
    // cabinet height is about 2.05 x its width, plus tagline and button; the ring is about 5 cabinets wide
    const byW = (vw - 40) / 5.2, byH = (vh - Math.min(vh * .3, 250)) / 2.75;
    cw = Math.max(110, Math.min(byW, byH, 330));
  }
  document.documentElement.style.setProperty('--cw', cw.toFixed(1) + 'px');
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));

// ---------------------------------------------------------------- neon sign flicker-on
function lightSign() {
  ['tubeA', 'tubeB'].forEach(id => { const el = $(id); el.innerHTML = [...el.textContent].map(ch => ch === ' ' ? ' ' : '<span class="ch">' + ch + '</span>').join(''); });
  const chars = [...document.querySelectorAll('.tube .ch')];
  chars.forEach((c, i) => {
    const base = 150 + Math.random() * 900;
    setTimeout(() => c.classList.add('lit'), base);
    setTimeout(() => c.classList.remove('lit'), base + 70);
    setTimeout(() => { c.classList.add('lit'); if (i % 5 === 2) c.classList.add('fl'); }, base + 160 + Math.random() * 200);
  });
  setTimeout(() => $('tag').classList.add('on'), 1500);
}

// ---------------------------------------------------------------- boot
function boot() {
  Snd.init();
  layout();
  buildRow();
  setSel(); units[0].el.classList.add('sel');
  lightSign();
  refreshScores();
  setInterval(() => { if (!document.hidden) refreshScores(); }, 120000);
  requestAnimationFrame(render);
}
const fontReady = document.fonts && document.fonts.load ? document.fonts.load('20px "Press Start 2P"').catch(() => { }) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 2500))]).then(boot);
</script>
