<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06010d">
<meta name="description" content="Neon Bread Studios arcade: Chonx '26, Chonx: Cheeky Ops, Yeet The Baby, Grandma Theft Automatic, Body The Karen and Ped X-ing. Free browser games with global high scores.">
<title>Neon Bread Studios — Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2306010d'/%3E%3Crect x='3' y='4' width='10' height='9' rx='2' fill='%23ff2bd6'/%3E%3Crect x='5' y='6' width='6' height='5' fill='%2300e5ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#ff2bd6;--cyan:#00e5ff;--yellow:#ffe14d;--green:#39ff6a;--cw:260px}
html,body{min-height:100%;background:#06010d;color:#fff;font-family:'Press Start 2P',monospace}
body{overflow-x:hidden;-webkit-user-select:none;user-select:none}
body.land{overflow-x:hidden}

/* ---------- the room ---------- */
#room{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow:hidden;
  background:radial-gradient(ellipse 80% 55% at 50% 20%,#2a0b4a 0%,#12042a 45%,#06010d 80%)}
#wall{position:absolute;inset:0 0 34% 0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,43,214,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(255,43,214,.06) 2px,transparent 2px);background-size:64px 32px}
#floor{position:absolute;left:-50%;right:-50%;bottom:-12%;height:52%;pointer-events:none;transform-origin:50% 0;transform:perspective(520px) rotateX(62deg);
  background-color:#0b0320;
  background-image:linear-gradient(var(--pink) 3px,transparent 3px),linear-gradient(90deg,var(--pink) 3px,transparent 3px),
    conic-gradient(rgba(0,229,255,.08) 25%,transparent 0 50%,rgba(0,229,255,.08) 0 75%,transparent 0);
  background-size:90px 90px,90px 90px,180px 180px;animation:floorrun 6s linear infinite;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 30%);mask-image:linear-gradient(to bottom,transparent 0%,#000 30%);opacity:.75}
@keyframes floorrun{to{background-position:0 90px,0 0,0 180px}}
#horizon{position:absolute;left:0;right:0;bottom:40%;height:2px;background:var(--pink);box-shadow:0 0 30px 8px rgba(255,43,214,.45);opacity:.6;pointer-events:none}
body.port #horizon,body.port #floor{position:fixed}
#scan{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}

/* ---------- neon sign ---------- */
#sign{position:relative;z-index:4;text-align:center;margin-top:clamp(18px,4vh,46px)}
#sign h1{font-weight:normal;line-height:1.15}
.tube{display:block;font-size:clamp(14px,4.6vw,72px);letter-spacing:.06em;color:#ffd3f6;
  text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 28px var(--pink),0 0 60px var(--pink)}
.tube.b{font-size:clamp(11px,2.3vw,36px);color:#c9fbff;margin-top:.45em;letter-spacing:.32em;
  text-shadow:0 0 4px #fff,0 0 12px var(--cyan),0 0 26px var(--cyan),0 0 52px var(--cyan)}
.tube .ch{display:inline-block;opacity:.08;text-shadow:none;transition:none}
.tube .ch.lit{opacity:1;text-shadow:inherit}
.tube .ch.lit.fl{animation:buzz 7s infinite}
@keyframes buzz{0%,91%,93%,95%,100%{opacity:1}92%,94%{opacity:.25}}
#tag{margin-top:1.2em;font-size:clamp(9px,1vw,14px);color:var(--yellow);letter-spacing:.12em;text-shadow:0 0 10px rgba(255,225,77,.6);opacity:0;transition:opacity .6s}
#tag.on{opacity:1}

/* ---------- cabinets ---------- */
/* 3D ring of cabinets: the selected one sits front and centre */
#ring{position:relative;z-index:3;flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:clamp(28px,6vh,72px) 0 0;touch-action:pan-y}
#row{position:relative;width:calc(var(--cw) * 1.2);height:calc(var(--cw) * 2.62);perspective:calc(var(--cw) * 6);perspective-origin:50% 40%}
.unit{position:absolute;left:0;top:0;width:calc(var(--cw) * 1.2);display:flex;flex-direction:column;align-items:center;gap:calc(var(--cw) * .05);outline:none;transform-origin:50% 50%;will-change:transform,opacity}
.unit:not(.sel) .tagline,.unit:not(.sel) .hs{opacity:0;pointer-events:none}
.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:20;font-family:inherit;font-size:calc(var(--cw) * .14);width:calc(var(--cw) * .34);height:calc(var(--cw) * .5);background:rgba(6,1,13,.7);color:var(--cyan);border:calc(var(--cw) * .014) solid var(--cyan);cursor:pointer;box-shadow:0 0 16px rgba(0,229,255,.5);display:flex;align-items:center;justify-content:center;padding:0}
.arrow:hover,.arrow:active{background:var(--cyan);color:#06010d}
#arL{left:max(10px,calc(50% - var(--cw) * 2.25))}
#arR{right:max(10px,calc(50% - var(--cw) * 2.25))}
body.port #ring{padding:24px 0 10px}
.cab{position:relative;width:var(--cw);cursor:pointer;transition:transform .18s;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6))}
.unit.sel .cab{transform:translateY(calc(var(--cw) * -.04)) scale(1.04)}
.cab-top{position:relative;height:calc(var(--cw) * .26);margin:0 calc(var(--cw) * .03);background:#120626;border:calc(var(--cw) * .018) solid var(--c);border-bottom:none;
  border-radius:calc(var(--cw) * .05) calc(var(--cw) * .05) 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 0 calc(var(--cw) * .06) var(--c),inset 0 0 calc(var(--cw) * .08) rgba(0,0,0,.8)}
.marq{width:94%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 0 6px var(--c))}
.cab-body{position:relative;background:linear-gradient(90deg,#1a0838 0%,#2a0e52 12%,#16062e 50%,#2a0e52 88%,#1a0838 100%);
  border:calc(var(--cw) * .018) solid var(--c);border-top-width:calc(var(--cw) * .012);padding:calc(var(--cw) * .07) calc(var(--cw) * .07) 0;
  box-shadow:0 0 calc(var(--cw) * .05) var(--c)}
.cab-body::before,.cab-body::after{content:'';position:absolute;top:0;bottom:0;width:calc(var(--cw) * .025);background:repeating-linear-gradient(180deg,var(--c) 0 6%,transparent 6% 12%);opacity:.35}
.cab-body::before{left:calc(var(--cw) * .015)}.cab-body::after{right:calc(var(--cw) * .015)}
.bezel{position:relative;background:#000;border-radius:calc(var(--cw) * .03);padding:calc(var(--cw) * .045);box-shadow:inset 0 0 0 calc(var(--cw) * .012) #3a2466,inset 0 0 calc(var(--cw) * .06) #000}
.scr{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:calc(var(--cw) * .025);background:#000}
.bezel::after{content:'';position:absolute;inset:calc(var(--cw) * .045);border-radius:calc(var(--cw) * .025);pointer-events:none;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.16),transparent 45%),repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 calc(var(--cw) * .05) rgba(0,0,0,.9)}
.panel{position:relative;height:calc(var(--cw) * .2);margin:calc(var(--cw) * .06) calc(var(--cw) * -.1) 0;background:linear-gradient(180deg,#3a1670,#1c0840);
  border:calc(var(--cw) * .014) solid var(--c);clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);display:flex;align-items:center;justify-content:center;gap:calc(var(--cw) * .07)}
.stick{position:relative;width:calc(var(--cw) * .1);height:calc(var(--cw) * .1)}
.stick::before{content:'';position:absolute;left:50%;bottom:20%;width:calc(var(--cw) * .025);height:calc(var(--cw) * .11);background:#ccc;transform:translateX(-50%)}
.stick::after{content:'';position:absolute;left:50%;top:-55%;width:calc(var(--cw) * .085);height:calc(var(--cw) * .085);border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#d1002a);transform:translateX(-50%);box-shadow:0 0 8px #ff2a4a}
.unit.sel .stick::after{animation:wiggle .9s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-80%)}75%{transform:translateX(-20%)}}
.pbtn{width:calc(var(--cw) * .07);height:calc(var(--cw) * .07);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--b));box-shadow:0 0 10px var(--b)}
.coin{height:calc(var(--cw) * .42);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw) * .05)}
.slot{display:flex;gap:calc(var(--cw) * .06)}
.slot i{display:block;width:calc(var(--cw) * .1);height:calc(var(--cw) * .12);background:#0d0420;border:calc(var(--cw) * .01) solid #5a3a90;position:relative}
.slot i::after{content:'';position:absolute;left:44%;top:18%;width:12%;height:64%;background:#ff3b3b;box-shadow:0 0 6px #ff3b3b}
.ins{font-size:calc(var(--cw) * .045);color:var(--yellow);letter-spacing:.08em;opacity:.25;text-shadow:0 0 8px var(--yellow)}
.unit.sel .ins{opacity:1;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.cab-base{height:calc(var(--cw) * .07);margin:0 calc(var(--cw) * -.02);background:#0d0420;border:calc(var(--cw) * .014) solid var(--c);border-top:none;box-shadow:0 0 calc(var(--cw) * .05) var(--c)}
.unit.sel .cab-top,.unit.sel .cab-body,.unit.sel .cab-base{box-shadow:0 0 calc(var(--cw) * .14) var(--c)}
.tagline{width:calc(var(--cw) * 1.15);min-height:3.6em;text-align:center;font-size:calc(var(--cw) * .04);line-height:1.8;color:#d8ccff;text-shadow:0 0 8px rgba(0,0,0,.9)}
.unit.sel .tagline{color:#fff}
.daily{margin-top:.5em;font-size:.85em;color:#ffb13b;letter-spacing:.06em}
.daily.done{color:#5fe0b7}
.hs{font-family:inherit;font-size:calc(var(--cw) * .045);padding:calc(var(--cw) * .04) calc(var(--cw) * .06);background:rgba(0,0,0,.55);color:var(--c);border:calc(var(--cw) * .012) solid var(--c);cursor:pointer;box-shadow:0 0 12px var(--c);letter-spacing:.06em}
.hs:hover,.hs:focus-visible{background:var(--c);color:#06010d;outline:none}
.hs.ghost{visibility:hidden}
.unit.soon .scr{filter:saturate(.7)}
.unit.shake .cab{animation:shk .35s}
/* ---------- prize counter screen (smooth refresh: rounded glass panels, drawn-in-code icons) ---------- */
#pc{position:fixed;inset:0;z-index:90;display:none;background:rgba(6,0,18,.84);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
#pc.on{display:block}
#pcP{position:absolute;left:50%;top:50%;transform-origin:50% 50%;display:flex;flex-direction:column;gap:20px;padding:30px 36px;border-radius:30px;background:linear-gradient(180deg,rgba(40,16,78,.97),rgba(12,4,30,.98));border:3px solid #ffb13b;box-shadow:0 0 50px rgba(255,177,59,.55),0 0 0 1px rgba(255,255,255,.06) inset,0 30px 80px rgba(0,0,0,.6);font-family:'Press Start 2P',monospace;color:#fff;overflow:hidden}
#pcP *{box-sizing:border-box;font-family:inherit}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex:none}
.pc-h{font-size:38px;color:#fff1c9;text-shadow:0 0 6px #fff,0 0 18px #ffb13b,0 0 40px #ff8a2b;white-space:nowrap}
.pc-bal{font-size:20px;color:#ffe14d;padding:14px 20px;border-radius:16px;border:2px solid #6a4aa8;background:linear-gradient(180deg,rgba(30,12,60,.9),rgba(10,3,24,.9));text-shadow:0 0 10px #ffb000;white-space:nowrap;box-shadow:0 0 18px -6px #ffb13b}
.pc-bal.tick{animation:pcTick .7s}
@keyframes pcTick{0%{transform:scale(1)}20%{transform:scale(1.08);box-shadow:0 0 28px #ffb13b}100%{transform:scale(1)}}
.pc-tabs{display:flex;gap:10px;flex-wrap:wrap;flex:none}
.pc-tab{font-size:16px;padding:13px 18px;border-radius:14px;background:rgba(20,8,42,.75);color:#b8acec;border:2px solid #3a2f78;cursor:pointer;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.pc-tab.on{color:#1a0a08;background:linear-gradient(180deg,#ffd27a,#ff9f1f);border-color:#ffd27a;box-shadow:0 0 18px #ffb13b}
.pc-tab.kfoc{outline:3px solid #fff;outline-offset:2px}
.pc-body{display:flex;gap:24px;align-items:stretch;min-height:0;flex:1}
.pc-clerk{position:relative;width:270px;flex:none;display:flex;flex-direction:column;gap:14px;min-height:0;padding:14px;border-radius:22px;background:linear-gradient(180deg,rgba(60,26,104,.6),rgba(20,8,42,.75));border:2px solid #5a3a90}
.pc-chonx{display:block;width:100%;flex:1;min-height:0;border-radius:14px}
.pc-say{position:relative;flex:none;min-height:118px;background:#fffaf0;color:#1a0f08;font-size:13px;line-height:1.75;padding:12px 14px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.pc-say::after{content:'';position:absolute;bottom:-14px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fffaf0;border-bottom:0}
.pc-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;align-content:start;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 12px;scrollbar-width:thin;scrollbar-color:#ffb13b transparent}
.pc-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 14px;border-radius:20px;background:linear-gradient(180deg,rgba(40,18,82,.95),rgba(16,6,38,.95));border:2px solid #3a2f78;cursor:pointer;min-height:220px;transition:transform .15s,box-shadow .15s,border-color .15s}
.pc-card canvas{width:96px;height:96px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.pc-card .n{font-size:12px;line-height:1.65;text-align:center;color:#ece6ff;min-height:40px}
.pc-card .n small{display:block;font-size:10px;color:#a99be0}
.pc-card .n small.sea{color:#ffb13b}
.pc-card .pr{font-size:16px;color:#ffe14d;margin-top:auto}
.pc-card.own .pr{color:#5fe0b7}
.pc-card.poor .pr{color:#8a7bd8}
.pc-card.poor canvas{opacity:.7}
.pc-card.foc{border-color:#ffb13b;box-shadow:0 0 22px rgba(255,177,59,.7),0 10px 24px rgba(0,0,0,.4);transform:translateY(-5px)}
.pc-card.just{animation:pcJust .9s}
@keyframes pcJust{0%{box-shadow:0 0 0 0 #5fe0b7}30%{box-shadow:0 0 34px 6px #5fe0b7;transform:translateY(-8px) scale(1.04)}100%{box-shadow:0 0 22px rgba(255,177,59,.7)}}
.pc-card .tagn{position:absolute;top:10px;right:10px;font-size:9px;padding:5px 7px;border-radius:8px;background:#5fe0b7;color:#0b0620}
.pc-card.mine{cursor:default;min-height:200px}
.pc-count{grid-column:1/-1;font-size:14px;color:#ffe14d;text-align:center;padding:4px 0 2px}
.pc-empty{grid-column:1/-1;font-size:16px;line-height:2;color:#b8acec;text-align:center;padding:40px 10px}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;flex:none}
.pc-hint{font-size:12px;color:#8d82c8;line-height:1.9}
.pc-b{font-size:18px;padding:16px 24px;border-radius:16px;background:rgba(0,40,52,.5);color:#00e5ff;border:2px solid #00e5ff;cursor:pointer;box-shadow:0 0 16px rgba(0,229,255,.5);white-space:nowrap}
.pc-b:hover,.pc-b.foc{background:linear-gradient(180deg,#7ff4ff,#00c4dc);color:#0b0620}
.pc-modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,0,18,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:3}
.pc-modal.on{display:flex}
.pc-mbox{display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 42px;border-radius:26px;background:linear-gradient(180deg,rgba(44,18,86,.98),rgba(14,5,34,.98));border:3px solid #ffb13b;box-shadow:0 0 40px rgba(255,177,59,.6);text-align:center;max-width:820px;animation:pcIn .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pcIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.pc-mbox canvas{width:150px;height:150px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.pc-mq{font-size:22px;line-height:1.7}
.pc-mrow{display:flex;gap:20px}
.pc-mb{font-size:22px;padding:18px 32px;border-radius:16px;background:rgba(40,20,10,.5);color:#ffb13b;border:2px solid #ffb13b;cursor:pointer}
.pc-mb.foc,.pc-mb:hover{background:linear-gradient(180deg,#ffd27a,#ff9f1f);color:#1a0a08;box-shadow:0 0 18px #ffb13b}
/* the purchase moment: the prize pops up, sparkles fly */
.pc-pop{position:absolute;left:50%;top:50%;width:0;height:0;z-index:4;pointer-events:none}
.pc-pop canvas{position:absolute;left:-110px;top:-110px;width:220px;height:220px;filter:drop-shadow(0 0 24px rgba(255,225,77,.8));animation:pcPop 1.3s cubic-bezier(.2,1.3,.4,1) forwards}
.pc-pop b{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:pcSpark .9s ease-out forwards}
.pc-pop i{position:absolute;left:-200px;top:96px;width:400px;font-style:normal;text-align:center;font-size:26px;color:#5fe0b7;text-shadow:0 2px 0 #0b0620,0 0 6px #0b0620,0 0 14px #5fe0b7;animation:pcPop 1.3s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes pcPop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.12);opacity:1}55%{transform:scale(1);opacity:1}100%{transform:translateY(-60px) scale(.9);opacity:0}}
@keyframes pcSpark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* phone portrait and short landscape: one swipeable strip of shelves, bigger text */
#pcP.portrait,#pcP.short{gap:14px;padding:18px 16px;border-radius:22px}
#pcP.portrait .pc-h,#pcP.short .pc-h{font-size:20px}
#pcP.portrait .pc-bal,#pcP.short .pc-bal{font-size:13px;padding:10px 12px;border-radius:12px}
#pcP.portrait .pc-tabs,#pcP.short .pc-tabs{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior:contain;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 2px 6px;margin:0 -4px}
#pcP.portrait .pc-tabs::-webkit-scrollbar,#pcP.short .pc-tabs::-webkit-scrollbar{display:none}
#pcP.portrait .pc-tab,#pcP.short .pc-tab{font-size:12px;padding:11px 13px;border-radius:12px;scroll-snap-align:center;flex:none}
#pcP.portrait .pc-body{flex-direction:column;gap:14px}
#pcP.portrait .pc-clerk{width:100%;flex-direction:row-reverse;align-items:center;padding:10px;gap:14px;flex:none}
#pcP.portrait .pc-chonx{width:110px;height:110px;flex:none}
#pcP.portrait .pc-say{flex:1;min-height:0;font-size:11px;padding:10px 12px}
#pcP.portrait .pc-say::after{bottom:auto;top:50%;left:-14px;margin:-10px 0 0;border:10px solid transparent;border-right-color:#fffaf0;border-left:0}
#pcP.portrait .pc-grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:6px 4px 10px}
#pcP.portrait .pc-card,#pcP.short .pc-card{min-height:190px;padding:12px 8px;border-radius:16px}
#pcP.portrait .pc-card canvas,#pcP.short .pc-card canvas{width:78px;height:78px}
#pcP.portrait .pc-card .n{font-size:11px}
#pcP.short .pc-card .n{font-size:14px}
#pcP.short .pc-card .n small{font-size:11px}
#pcP.short .pc-card .pr{font-size:17px}
#pcP.short .pc-tab{font-size:14px}
#pcP.short .pc-hint{font-size:12px}
#pcP.portrait .pc-card .n small,#pcP.short .pc-card .n small{font-size:9px}
#pcP.portrait .pc-card .pr,#pcP.short .pc-card .pr{font-size:13px}
#pcP.portrait .pc-foot{flex-direction:column-reverse;align-items:stretch;gap:10px}
#pcP.portrait .pc-hint,#pcP.short .pc-hint{font-size:10px;text-align:center}
#pcP.portrait .pc-b,#pcP.short .pc-b{font-size:14px;padding:14px 16px;text-align:center}
#pcP.portrait .pc-mbox,#pcP.short .pc-mbox{padding:24px 20px;gap:16px;margin:0 14px}
#pcP.portrait .pc-mq,#pcP.short .pc-mq{font-size:14px}

<script id="nb-scores">
/* NB-SCORES START v1 — Neon Bread Arcade global leaderboards.
   Canonical copy: LogicNerds/neonbread/shared/nb-scores.js. Each game inlines this block
   between the NB-SCORES START / END markers so every game stays one self-contained file.
   Backend: Firestore (project neon-bread-arcade) over its REST API. No sign-in, no SDK. */
(function () {
  'use strict';
  if (window.NBScores) return;
  const PROJECT = 'neon-bread-arcade';
  const BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
  const GAMES = {
    chonx: { title: "CHONX '26", color: '#39ff6a' },
    yeet: { title: 'YEET THE BABY', color: '#ff6b9d' },
    gta: { title: 'GRANDMA THEFT AUTOMATIC', color: '#ffcc4d' },
    karen: { title: 'BODY THE KAREN', color: '#00e5ff' },
    cheekyops: { title: 'CHONX: CHEEKY OPS', color: '#ff2a3d' },
    pedxing: { title: 'PED X-ING', color: '#d4ff00' },
  };
  const ARCADE_URL = 'https://www.neonbreadent.com/';
  const NAME_LEN = 6;
  const CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const NAME_KEY = 'nb_name';

  // ---------------------------------------------------------------- name filter
  // Slurs are blocked; swearing is fine. Checked after undoing common letter swaps (0->O, 1->I ...).
  // The same lists live in the Firestore rules as a second line of defence.
  const SUB = ['nigg', 'nigr', 'niga', 'fagot', 'faggot', 'faggt', 'kike', 'kyke', 'trann', 'trany', 'retard', 'wetbac', 'beaner', 'raghea', 'chink'];
  const EXACT = ['nig', 'fag', 'fags', 'spic', 'spics', 'spick', 'coon', 'coons', 'gook', 'gooks', 'dyke', 'dykes', 'jap', 'japs', 'paki', 'pakis', 'wop', 'wops', 'kkk'];
  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '9': 'g' };
  function norm(s) { return s.toLowerCase().split('').map(c => LEET[c] || c).join(''); }
  function blocked(name) {
    const raw = name.toLowerCase(), n = norm(name), squeezed = n.replace(/(.)\1+/g, '$1');
    return [raw, n, squeezed].some(v => SUB.some(w => v.includes(w)) || EXACT.includes(v));
  }
  function clean(name) { return String(name || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_LEN); }

  // ---------------------------------------------------------------- weeks (reset Monday 00:00 Pacific)
  function weekKey(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' })
      .formatToParts(d || new Date()).forEach(x => { p[x.type] = x.value; });
    const back = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[p.weekday] || 0;
    const u = new Date(Date.UTC(+p.year, +p.month - 1, +p.day - back));
    return u.toISOString().slice(0, 10);
  }
  function weekLabel(k) {
    const [y, m, d] = k.split('-').map(Number);
    return 'WEEK OF ' + ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'][m - 1] + ' ' + d;
  }

  // ---------------------------------------------------------------- Firestore REST
  function req(path, body) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = ctl ? setTimeout(() => ctl.abort(), 9000) : 0;
    return fetch(BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(r => r.json().then(j => {
        clearTimeout(t);
        const err = j && (j.error || (Array.isArray(j) && j[0] && j[0].error));
        if (!r.ok || err) throw new Error((err && err.message) || ('HTTP ' + r.status));
        return j;
      }))
      .catch(e => { clearTimeout(t); throw e; });
  }
  const sv = v => ({ stringValue: v });
  const fEq = (f, v) => ({ fieldFilter: { field: { fieldPath: f }, op: 'EQUAL', value: sv(v) } });
  function whereFor(game, scope, above) {
    const fs = [fEq('game', game)];
    if (scope === 'week') fs.push(fEq('week', weekKey()));
    if (above != null) fs.push({ fieldFilter: { field: { fieldPath: 'score' }, op: 'GREATER_THAN', value: { integerValue: String(above) } } });
    return { compositeFilter: { op: 'AND', filters: fs } };
  }
  function newId() {
    const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; let s = '';
    const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(20)) : Array.from({ length: 20 }, () => Math.random() * 256);
    for (let i = 0; i < 20; i++) s += a[r[i] % a.length];
    return s;
  }
  function post(game, name, score, cheat) {
    const id = newId(), fields = { game: sv(game), name: sv(name), score: { integerValue: String(score) }, week: sv(weekKey()) };
    if (cheat) fields.cheat = { booleanValue: true };
    return req(':commit', {
      writes: [{
        update: {
          name: 'projects/' + PROJECT + '/databases/(default)/documents/scores/' + id,
          fields,
        },
        updateTransforms: [{ fieldPath: 'ts', setToServerValue: 'REQUEST_TIME' }],
        currentDocument: { exists: false },
      }],
    }).then(() => id);
  }
  function rowsOf(res) {
    return res.filter(r => r.document).map(r => {
      const f = r.document.fields || {};
      return { id: r.document.name.split('/').pop(), ref: r.document.name, name: (f.name && f.name.stringValue) || '???', score: +((f.score && f.score.integerValue) || 0), cheat: !!(f.cheat && f.cheat.booleanValue) };
    });
  }
  function top(game, scope, limit) {
    return req(':runQuery', {
      structuredQuery: {
        from: [{ collectionId: 'scores' }], where: whereFor(game, scope),
        orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit: limit || 100,
      },
    }).then(rowsOf);
  }
  // Every all-time score, PAGE at a time. `after` is the last row of the previous page (cursor, so skipped rows aren't billed).
  const PAGE = 100;
  function page(game, after) {
    const q = {
      from: [{ collectionId: 'scores' }], where: whereFor(game, 'all'),
      orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }, { field: { fieldPath: '__name__' }, direction: 'DESCENDING' }],
      limit: PAGE,
    };
    if (after) q.startAt = { values: [{ integerValue: String(after.score) }, { referenceValue: after.ref }], before: false };
    return req(':runQuery', { structuredQuery: q }).then(rowsOf);
  }
  function rank(game, scope, score) {
    return req(':runAggregationQuery', {
      structuredAggregationQuery: { structuredQuery: { from: [{ collectionId: 'scores' }], where: whereFor(game, scope, score) }, aggregations: [{ alias: 'n', count: {} }] },
    }).then(r => 1 + +(((r[0] || {}).result || {}).aggregateFields || {}).n.integerValue || 0);
  }

  // ---------------------------------------------------------------- tickets
  // One wallet per device, shared by every game on neonbreadent.com (they all share localStorage).
  // A run pays score / rate (aiming for ~20-40 on an average run, min 5, max 150) plus bonuses.
  // Party mode never calls submit(), so party runs earn nothing.
  const TK_KEY = 'nb_tickets_v1';
  const TK_RATE = { chonx: 1000, cheekyops: 2000, yeet: 600, gta: 1500, karen: 400, pedxing: 1500 };
  const TK = { min: 5, max: 150, best: 25, top10: 50, firstToday: 10, golden: 500, goldenOdds: 1 / 40 };
  function pacificDay(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(d || new Date()).forEach(x => { p[x.type] = x.value; });
    return p.year + '-' + p.month + '-' + p.day;
  }
  function tkBlank() { return { v: 1, bal: 0, earned: 0, spent: 0, best: {}, day: {}, owned: {}, equip: {}, cheats: {}, chal: {}, golden: 0, runs: 0 }; }
  function tkLoad() {
    try { const w = JSON.parse(localStorage.getItem(TK_KEY) || 'null'); if (w && typeof w.bal === 'number') return Object.assign(tkBlank(), w); } catch (e) { }
    return tkBlank();
  }
  function tkSave(w) { try { localStorage.setItem(TK_KEY, JSON.stringify(w)); } catch (e) { } tkFire(w); }
  const tkListeners = [];
  function tkFire(w) { tkListeners.forEach(f => { try { f(w); } catch (e) { } }); }
  // other tabs (the arcade open in one tab, a game in another) see changes too
  window.addEventListener('storage', e => { if (e.key === TK_KEY) tkFire(tkLoad()); });
  const Tickets = {
    rates: TK_RATE, rules: TK, today: pacificDay,
    wallet: tkLoad,
    balance() { return tkLoad().bal; },
    onChange(f) { tkListeners.push(f); },
    add(n) { const w = tkLoad(); n = Math.max(0, Math.floor(n)); w.bal += n; w.earned += n; tkSave(w); return w.bal; },
    spend(n) { const w = tkLoad(); n = Math.max(0, Math.floor(n)); if (w.bal < n) return false; w.bal -= n; w.spent += n; tkSave(w); return true; },
    owns(id) { return !!tkLoad().owned[id]; },
    // buy a prize: takes the tickets and records it in one save
    buy(id, price) { const w = tkLoad(), it = Tickets.item(id); if (w.owned[id] || w.bal < price || (it && !Tickets.inSeason(it))) return false; w.bal -= price; w.spent += price; w.owned[id] = Date.now(); tkSave(w); return true; },
    equipped(game, slot) { const e = tkLoad().equip[game] || {}; return slot ? e[slot] || null : e; },
    setEquip(game, slot, id) { const w = tkLoad(); w.equip[game] = w.equip[game] || {}; if (id) w.equip[game][slot] = id; else delete w.equip[game][slot]; tkSave(w); },
    // ---- cheat cards: codes live in w.owned like any prize; w.cheats[id] = switched on
    cheatsFor(game) { return Tickets.catalog.filter(i => i.cheat && i.game === game); },
    envelopeLeft(game) { const w = tkLoad(); return Tickets.cheatsFor(game).filter(i => !w.owned[i.id]).length; },
    // buy an envelope: takes the tickets and reveals one code you don't have yet, at random
    openEnvelope(game) {
      const w = tkLoad(), env = Tickets.item('env.' + game), left = Tickets.cheatsFor(game).filter(i => !w.owned[i.id]);
      if (!env || !left.length || w.bal < env.price) return null;
      const got = left[Math.floor(Math.random() * left.length)];
      w.bal -= env.price; w.spent += env.price; w.owned[got.id] = Date.now(); tkSave(w); return got;
    },
    cheatOn(game, key) {
      const id = 'cheat.' + game + '.' + key, w = tkLoad();
      if (w.owned[id] && w.cheats && w.cheats[id]) return true;
      const it = Tickets.item(id); return !!(it && it.freeDay && it.freeDay === pacificDay());   // free for everyone that day
    },
    setCheat(id, on) { const w = tkLoad(); w.cheats = w.cheats || {}; if (on) w.cheats[id] = 1; else delete w.cheats[id]; tkSave(w); },
    // a run with any gameplay (T) code switched on is tagged on the leaderboard
    tagged(game) { return Tickets.cheatsFor(game).some(i => i.tag && Tickets.cheatOn(game, i.id.split('.')[2])); },
    // work out what a finished run pays (doesn't save). A tagged run can't set a personal best.
    quote(game, score, ranks, feats, tagged, stats) {
      const w = tkLoad(), lines = [];
      const base = Math.max(TK.min, Math.min(TK.max, Math.round(score / (TK_RATE[game] || 1000))));
      lines.push({ t: 'RUN PAYOUT', n: base });
      if (!tagged && score > 0 && score > (w.best[game] || 0)) lines.push({ t: 'NEW PERSONAL BEST', n: TK.best });
      if (ranks && ranks.week && ranks.week <= 10) lines.push({ t: 'WEEKLY TOP 10', n: TK.top10 });
      if (w.day[game] !== pacificDay()) lines.push({ t: 'FIRST RUN TODAY', n: TK.firstToday });
      (feats || []).forEach(f => { if (f && f.n > 0) lines.push({ t: String(f.t), n: Math.floor(f.n) }); });
      const ch = Tickets.challenge(game);
      if (ch && !ch.done && !tagged) { let ok = false; try { ok = !!ch.ok(Object.assign({ score }, stats || {})); } catch (e) { } if (ok) lines.push({ t: 'DAILY CHALLENGE: ' + ch.t, n: ch.n, chal: true }); }
      if (Math.random() < TK.goldenOdds) lines.push({ t: 'GOLDEN TICKET!', n: TK.golden, gold: true });
      return { lines, total: lines.reduce((a, l) => a + l.n, 0) };
    },
    // pay it out: one save, so closing the page during the animation loses nothing
    payRun(game, score, q, tagged) {
      const w = tkLoad();
      w.bal += q.total; w.earned += q.total; w.runs++;
      if (!tagged) w.best[game] = Math.max(w.best[game] || 0, score); w.day[game] = pacificDay();
      if (q.lines.some(l => l.gold)) w.golden++;
      if (q.lines.some(l => l.chal)) w.chal[game] = pacificDay();
      tkSave(w); return w.bal;
    },
  };
  // ---- prize catalog (prices approved Nov 25 2026). Later stages add game cosmetics, cheat cards and seasonal items.
  // shelf: junk | collect | top. Every item here can be bought at the counter.
  Tickets.catalog = [
    { id: 'junk.spider', shelf: 'junk', name: 'SPIDER RING', price: 10 },
    { id: 'junk.trap', shelf: 'junk', name: 'FINGER TRAP', price: 15 },
    { id: 'junk.ball', shelf: 'junk', name: 'BOUNCY BALL', price: 20 },
    { id: 'junk.candy', shelf: 'junk', name: 'CANDY NECKLACE', price: 25 },
    { id: 'junk.pencil', shelf: 'junk', name: '"WORLD\'S OK-EST GAMER" PENCIL', price: 30 },
    { id: 'junk.sticky', shelf: 'junk', name: 'STICKY HAND', price: 35 },
    { id: 'junk.kazoo', shelf: 'junk', name: 'KAZOO', price: 40 },
    { id: 'junk.whoopee', shelf: 'junk', name: 'WHOOPEE CUSHION', price: 50 },
    { id: 'junk.slap', shelf: 'junk', name: 'SLAP BRACELET', price: 60 },
    { id: 'junk.mood', shelf: 'junk', name: 'MOOD RING', price: 75 },
    { id: 'junk.clanker', shelf: 'junk', name: 'MINI CLANKER KEYCHAIN', price: 120 },
    { id: 'junk.rat', shelf: 'junk', name: '6-7 RAT SQUISHY', price: 150 },
    { id: 'col.grandma', shelf: 'collect', name: 'GRANDMA KEYCHAIN', price: 400 },
    { id: 'col.brain', shelf: 'collect', name: 'BRAYN BRAIN STRESS BALL', price: 500 },
    { id: 'col.babybob', shelf: 'collect', name: 'BABY BOBBLEHEAD', price: 600 },
    { id: 'col.karenbob', shelf: 'collect', name: 'KAREN BOBBLEHEAD', price: 600 },
    { id: 'col.chonx', shelf: 'collect', name: 'CHONX PLUSH', price: 800 },
    { id: 'col.gerb', shelf: 'collect', name: 'GERB PLUSH', price: 900 },
    { id: 'col.mittens', shelf: 'collect', name: 'CHAIRMAN MITTENS PLUSH', price: 1200 },
    { id: 'top.giant', shelf: 'top', name: 'GIANT CHONX PLUSH', price: 10000 },
    { id: 'top.token', shelf: 'top', name: 'GOLD ARCADE TOKEN', price: 25000 },
  ];
  // game cosmetics: shelf = game id, slot = where it goes (one item per slot)
  const add = (game, slot, list) => list.forEach(([key, name, price]) => Tickets.catalog.push({ id: game + '.' + slot + '.' + key, shelf: game, game, slot, name, price }));
  add('yeet', 'hat', [['party', 'PARTY HAT', 150], ['beanie', 'PROPELLER BEANIE', 200], ['cap', 'BACKWARDS CAP', 200], ['helmet', 'BIKE HELMET', 250], ['chef', 'CHEF HAT', 300], ['cowboy', 'COWBOY HAT', 300], ['viking', 'VIKING HELMET', 600], ['crown', 'CROWN', 1000]]);

.nbs-tabs{display:flex;gap:14px}
.nbs-tab{font-size:22px;padding:14px 22px;background:transparent;color:#8a7bd8;border:4px solid #3a2f78;cursor:pointer}
.nbs-tab.on{color:#0b0620;background:#00e5ff;border-color:#00e5ff;box-shadow:0 0 18px #00e5ff}
.nbs-list{width:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--nbc) transparent}
.nbs-li{display:grid;grid-template-columns:110px 1fr auto;gap:20px;font-size:26px;line-height:1.95;padding:0 14px;text-align:left}
.nbs-li span:last-child{text-align:right;color:#ffe14d}
.nbs-li.me{background:var(--nbc);color:#0b0620}
.nbs-li.me span:last-child{color:#0b0620}
.nbs-tag{font-style:normal;font-size:13px;line-height:1;vertical-align:middle;margin-left:16px;padding:4px 6px 3px;border:2px solid #ff2bd6;color:#ff2bd6;background:#1a0630}
.nbs-li.me .nbs-tag{color:#0b0620;border-color:#0b0620;background:transparent}
.nbs-li.r1{color:#ffe14d}.nbs-li.r2{color:#e6e6ff}.nbs-li.r3{color:#ffa45c}
.nbs-hint{font-size:16px;color:#7d72b8;line-height:1.9}
.nbs-foc{outline:5px solid #fff;outline-offset:5px}
.nbs-more{font-size:18px;color:#7d72b8;text-align:center;line-height:2.4}
.nbt-wrap{display:flex;gap:44px;align-items:flex-start;justify-content:center;width:100%}
.nbt-mach{display:flex;flex-direction:column;align-items:center;width:250px}
.nbt-slot{width:230px;height:34px;background:#05010e;border:6px solid #3a2f78;border-radius:8px;box-shadow:inset 0 6px 10px #000}
.nbt-strip{width:150px;height:0;overflow:hidden;margin-top:-10px;position:relative;border-left:4px dotted #06010d;border-right:4px dotted #06010d;
  background:repeating-linear-gradient(180deg,#ff8a2b 0 54px,#06010d 54px 56px,#ff8a2b 56px 60px)}
.nbt-strip span{display:block;height:60px;line-height:56px;font-size:13px;color:#5a1f00;letter-spacing:1px;text-align:center}
.nbt-strip.gold{background:repeating-linear-gradient(180deg,#ffe14d 0 54px,#06010d 54px 56px,#ffe14d 56px 60px)}
.nbt-side{display:flex;flex-direction:column;gap:18px;min-width:520px;text-align:left}
.nbt-count{font-size:84px;color:#ffe14d;text-shadow:0 0 22px #ffb000;text-align:left}
.nbt-lines{display:flex;flex-direction:column;gap:12px;min-height:260px}
.nbt-l{display:flex;justify-content:space-between;gap:24px;font-size:22px;color:#d9d0ff;opacity:0;transform:translateX(-20px);transition:opacity .2s,transform .2s}
.nbt-l.on{opacity:1;transform:none}
.nbt-l b{color:#ffe14d;font-weight:normal}
.nbt-l.gold{color:#ffe14d;text-shadow:0 0 14px #ffb000;font-size:26px}
.nbt-bal{font-size:20px;color:#00e5ff}
.nbp-list{width:100%;max-height:520px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:18px;text-align:left;scrollbar-width:thin;scrollbar-color:var(--nbc) transparent}
.nbp-t{font-size:18px;color:#00e5ff;margin-bottom:10px}
.nbp-items{display:flex;flex-wrap:wrap;gap:12px}
.nbp-i{display:flex;flex-direction:column;align-items:center;gap:8px;width:170px;padding:12px 8px;background:#140a32;border:4px solid #3a2f78;color:#e6deff;cursor:pointer;font-size:11px;line-height:1.6;text-align:center}
.nbp-i canvas{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges}
.nbp-i.on{border-color:#5fe0b7;background:#10302a}
.nbp-i b{font-weight:normal;font-size:10px;color:#5fe0b7}
.nbp-i b.off{color:#7d72b8}
.nbp-i em{font-style:normal;font-size:9px;color:#a99be0}
#nbsP.portrait .nbp-list{max-height:820px}
#nbsP.portrait .nbt-wrap{flex-direction:column;align-items:center;gap:24px}
#nbsP.portrait .nbt-side{min-width:0;width:100%}

        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.35, t + .05); g.gain.exponentialRampToValueAtTime(0.0001, t + .9);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t + 1);
        if (i % 4 === 0) { const b = c.createOscillator(), bg = c.createGain(); b.type = 'sine'; b.frequency.value = notes[i % notes.length] / 2; bg.gain.setValueAtTime(.4, t); bg.gain.exponentialRampToValueAtTime(.0001, t + 1.6); b.connect(bg); bg.connect(lp); b.start(t); b.stop(t + 1.7); }
        if (Math.random() < .12) { const f = [523, 659, 784, 1047, 392][(Math.random() * 5) | 0]; this.tone(f, .06, 'square', .12, Math.random() * .3); this.tone(f * 1.5, .06, 'square', .1, .1 + Math.random() * .3); }
        i++;
      }
      setTimeout(tick, 300);
    };
    tick();
  },
};
$('snd').addEventListener('click', e => { e.stopPropagation(); Snd.toggle(); });
$('arL').addEventListener('click', e => { e.stopPropagation(); Snd.unlock(); rot(-1); });
$('arR').addEventListener('click', e => { e.stopPropagation(); Snd.unlock(); rot(1); });
// swipe left / right on the ring
let swipe = null;
$('ring').addEventListener('pointerdown', e => { if (e.target.closest('.arrow')) return; swipe = { x: e.clientX, y: e.clientY, id: e.pointerId }; swiped = false; });
$('ring').addEventListener('pointermove', e => {
  if (!swipe || swipe.id !== e.pointerId) return;
  const dx = e.clientX - swipe.x;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(e.clientY - swipe.y)) { Snd.unlock(); rot(dx < 0 ? 1 : -1); swiped = true; swipe = null; }
});
const endSwipe = () => { swipe = null; setTimeout(() => { swiped = false; }, 50); };
$('ring').addEventListener('pointerup', endSwipe); $('ring').addEventListener('pointercancel', endSwipe);
['pointerdown', 'touchend'].forEach(ev => addEventListener(ev, () => Snd.unlock(), { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) padReset(); if (!Snd.ctx) return; if (document.hidden) Snd.ctx.suspend(); else if (Snd.on) Snd.ctx.resume(); });
// coming back with the browser's back button: reset the coin animation
addEventListener('pageshow', () => { paintBalance(); paintDaily(); padReset(); leaving = false; $('flash').classList.remove('on'); units.forEach(u => u.credit = 0); refreshScores(); });

// ---------------------------------------------------------------- layout
function layout() {
  const vw = innerWidth, vh = innerHeight, port = vh > vw * 1.05 || vw < 640;
  document.body.classList.toggle('port', port); document.body.classList.toggle('land', !port);
  let cw;
  if (port) cw = Math.min(vw * .52, 300, (vh - 220) / 2.75);
  else {
    // cabinet height is about 2.05 x its width, plus tagline and button; the ring is about 5 cabinets wide
    const byW = (vw - 40) / 5.2, byH = (vh - Math.min(vh * .36, 310)) / 2.75;   // room for the sign above the ring
    cw = Math.max(110, Math.min(byW, byH, 330));
  }
  document.documentElement.style.setProperty('--cw', cw.toFixed(1) + 'px');
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));

// ---------------------------------------------------------------- neon sign flicker-on
function lightSign() {
  ['tubeA', 'tubeB'].forEach(id => { const el = $(id); el.innerHTML = [...el.textContent].map(ch => ch === ' ' ? ' ' : '<span class="ch">' + ch + '</span>').join(''); });
  const chars = [...document.querySelectorAll('.tube .ch')];
  chars.forEach((c, i) => {
    const base = 150 + Math.random() * 900;
    setTimeout(() => c.classList.add('lit'), base);
    setTimeout(() => c.classList.remove('lit'), base + 70);
    setTimeout(() => { c.classList.add('lit'); if (i % 5 === 2) c.classList.add('fl'); }, base + 160 + Math.random() * 200);
  });
  setTimeout(() => $('tag').classList.add('on'), 1500);
}

// ---------------------------------------------------------------- boot
function boot() {
  Snd.init();
  layout();
  buildRow();
  setSel(); units[0].el.classList.add('sel');
  lightSign();
  refreshScores();
  setInterval(() => { if (!document.hidden) refreshScores(); }, 120000);
  requestAnimationFrame(render);
}
const fontReady = document.fonts && document.fonts.load ? document.fonts.load('20px "Press Start 2P"').catch(() => { }) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 2500))]).then(boot);
</script>
