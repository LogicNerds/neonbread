<script id="nb-scores">
/* NB-SCORES START v1 — Neon Bread Arcade global leaderboards.
   Canonical copy: LogicNerds/neonbread/shared/nb-scores.js. Each game inlines this block
   between the NB-SCORES START / END markers so every game stays one self-contained file.
   Backend: Firestore (project neon-bread-arcade) over its REST API. No sign-in, no SDK. */
(function () {
  'use strict';
  if (window.NBScores) return;
  const PROJECT = 'neon-bread-arcade';
  const BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
  const GAMES = {
    chonx: { title: "CHONX '26", color: '#39ff6a' },
    yeet: { title: 'YEET THE BABY', color: '#ff6b9d' },
    gta: { title: 'GRANDMA THEFT AUTOMATIC', color: '#ffcc4d' },
    karen: { title: 'BODY THE KAREN', color: '#00e5ff' },
    cheekyops: { title: 'CHONX: CHEEKY OPS', color: '#ff2a3d' },
    pedxing: { title: 'PED X-ING', color: '#d4ff00' },
  };
  const ARCADE_URL = 'https://www.neonbreadent.com/';
  const NAME_LEN = 6;
  const CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const NAME_KEY = 'nb_name';

  // ---------------------------------------------------------------- name filter
  // Slurs are blocked; swearing is fine. Checked after undoing common letter swaps (0->O, 1->I ...).
  // The same lists live in the Firestore rules as a second line of defence.
  const SUB = ['nigg', 'nigr', 'niga', 'fagot', 'faggot', 'faggt', 'kike', 'kyke', 'trann', 'trany', 'retard', 'wetbac', 'beaner', 'raghea', 'chink'];
  const EXACT = ['nig', 'fag', 'fags', 'spic', 'spics', 'spick', 'coon', 'coons', 'gook', 'gooks', 'dyke', 'dykes', 'jap', 'japs', 'paki', 'pakis', 'wop', 'wops', 'kkk'];
  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '9': 'g' };
  function norm(s) { return s.toLowerCase().split('').map(c => LEET[c] || c).join(''); }
  function blocked(name) {
    const raw = name.toLowerCase(), n = norm(name), squeezed = n.replace(/(.)\1+/g, '$1');
    return [raw, n, squeezed].some(v => SUB.some(w => v.includes(w)) || EXACT.includes(v));
  }
  function clean(name) { return String(name || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_LEN); }

  // ---------------------------------------------------------------- weeks (reset Monday 00:00 Pacific)
  function weekKey(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' })
      .formatToParts(d || new Date()).forEach(x => { p[x.type] = x.value; });
    const back = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[p.weekday] || 0;
    const u = new Date(Date.UTC(+p.year, +p.month - 1, +p.day - back));
    return u.toISOString().slice(0, 10);
  }
  function weekLabel(k) {
    const [y, m, d] = k.split('-').map(Number);
    return 'WEEK OF ' + ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'][m - 1] + ' ' + d;
  }

  // ---------------------------------------------------------------- Firestore REST
  function req(path, body) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = ctl ? setTimeout(() => ctl.abort(), 9000) : 0;
    return fetch(BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(r => r.json().then(j => {
        clearTimeout(t);
        const err = j && (j.error || (Array.isArray(j) && j[0] && j[0].error));
        if (!r.ok || err) throw new Error((err && err.message) || ('HTTP ' + r.status));
        return j;
      }))
      .catch(e => { clearTimeout(t); throw e; });
  }
  const sv = v => ({ stringValue: v });
  const fEq = (f, v) => ({ fieldFilter: { field: { fieldPath: f }, op: 'EQUAL', value: sv(v) } });
  function whereFor(game, scope, above) {
    const fs = [fEq('game', game)];
    if (scope === 'week') fs.push(fEq('week', weekKey()));
    if (above != null) fs.push({ fieldFilter: { field: { fieldPath: 'score' }, op: 'GREATER_THAN', value: { integerValue: String(above) } } });
    return { compositeFilter: { op: 'AND', filters: fs } };
  }
  function newId() {
    const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; let s = '';
    const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(20)) : Array.from({ length: 20 }, () => Math.random() * 256);
    for (let i = 0; i < 20; i++) s += a[r[i] % a.length];
    return s;
  }
  function post(game, name, score) {
    const id = newId();
    return req(':commit', {
      writes: [{
        update: {
          name: 'projects/' + PROJECT + '/databases/(default)/documents/scores/' + id,
          fields: { game: sv(game), name: sv(name), score: { integerValue: String(score) }, week: sv(weekKey()) },
        },
        updateTransforms: [{ fieldPath: 'ts', setToServerValue: 'REQUEST_TIME' }],
        currentDocument: { exists: false },
      }],
    }).then(() => id);
  }
  function rowsOf(res) {
    return res.filter(r => r.document).map(r => {
      const f = r.document.fields || {};
      return { id: r.document.name.split('/').pop(), ref: r.document.name, name: (f.name && f.name.stringValue) || '???', score: +((f.score && f.score.integerValue) || 0) };
    });
  }
  function top(game, scope, limit) {
    return req(':runQuery', {
      structuredQuery: {
        from: [{ collectionId: 'scores' }], where: whereFor(game, scope),
        orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit: limit || 100,
      },
    }).then(rowsOf);
  }
  // Every all-time score, PAGE at a time. `after` is the last row of the previous page (cursor, so skipped rows aren't billed).
  const PAGE = 100;
  function page(game, after) {
    const q = {
      from: [{ collectionId: 'scores' }], where: whereFor(game, 'all'),
      orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }, { field: { fieldPath: '__name__' }, direction: 'DESCENDING' }],
      limit: PAGE,
    };
    if (after) q.startAt = { values: [{ integerValue: String(after.score) }, { referenceValue: after.ref }], before: false };
    return req(':runQuery', { structuredQuery: q }).then(rowsOf);
  }
  function rank(game, scope, score) {
    return req(':runAggregationQuery', {
      structuredAggregationQuery: { structuredQuery: { from: [{ collectionId: 'scores' }], where: whereFor(game, scope, score) }, aggregations: [{ alias: 'n', count: {} }] },
    }).then(r => 1 + +(((r[0] || {}).result || {}).aggregateFields || {}).n.integerValue || 0);
  }

  // ---------------------------------------------------------------- tickets
  // One wallet per device, shared by every game on neonbreadent.com (they all share localStorage).
  // A run pays score / rate (aiming for ~20-40 on an average run, min 5, max 150) plus bonuses.
  // Party mode never calls submit(), so party runs earn nothing.
  const TK_KEY = 'nb_tickets_v1';
  const TK_RATE = { chonx: 1000, cheekyops: 2000, yeet: 600, gta: 1500, karen: 400, pedxing: 1500 };
  const TK = { min: 5, max: 150, best: 25, top10: 50, firstToday: 10, golden: 500, goldenOdds: 1 / 40 };
  function pacificDay(d) {
    const p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(d || new Date()).forEach(x => { p[x.type] = x.value; });
    return p.year + '-' + p.month + '-' + p.day;
  }
  function tkBlank() { return { v: 1, bal: 0, earned: 0, spent: 0, best: {}, day: {}, owned: {}, equip: {}, golden: 0, runs: 0 }; }
  function tkLoad() {
    try { const w = JSON.parse(localStorage.getItem(TK_KEY) || 'null'); if (w && typeof w.bal === 'number') return Object.assign(tkBlank(), w); } catch (e) { }
    return tkBlank();
  }
  function tkSave(w) { try { localStorage.setItem(TK_KEY, JSON.stringify(w)); } catch (e) { } tkFire(w); }
  const tkListeners = [];
  function tkFire(w) { tkListeners.forEach(f => { try { f(w); } catch (e) { } }); }
  // other tabs (the arcade open in one tab, a game in another) see changes too
  window.addEventListener('storage', e => { if (e.key === TK_KEY) tkFire(tkLoad()); });
  const Tickets = {
    rates: TK_RATE, rules: TK, today: pacificDay,
    wallet: tkLoad,
    balance() { return tkLoad().bal; },
    onChange(f) { tkListeners.push(f); },
    add(n) { const w = tkLoad(); n = Math.max(0, Math.floor(n)); w.bal += n; w.earned += n; tkSave(w); return w.bal; },
    spend(n) { const w = tkLoad(); n = Math.max(0, Math.floor(n)); if (w.bal < n) return false; w.bal -= n; w.spent += n; tkSave(w); return true; },
    owns(id) { return !!tkLoad().owned[id]; },
    // buy a prize: takes the tickets and records it in one save
    buy(id, price) { const w = tkLoad(); if (w.owned[id] || w.bal < price) return false; w.bal -= price; w.spent += price; w.owned[id] = Date.now(); tkSave(w); return true; },
    equipped(game, slot) { const e = tkLoad().equip[game] || {}; return slot ? e[slot] || null : e; },
    setEquip(game, slot, id) { const w = tkLoad(); w.equip[game] = w.equip[game] || {}; if (id) w.equip[game][slot] = id; else delete w.equip[game][slot]; tkSave(w); },
    // work out what a finished run pays (doesn't save)
    quote(game, score, ranks, feats) {
      const w = tkLoad(), lines = [];
      const base = Math.max(TK.min, Math.min(TK.max, Math.round(score / (TK_RATE[game] || 1000))));
      lines.push({ t: 'RUN PAYOUT', n: base });
      if (score > 0 && score > (w.best[game] || 0)) lines.push({ t: 'NEW PERSONAL BEST', n: TK.best });
      if (ranks && ranks.week && ranks.week <= 10) lines.push({ t: 'WEEKLY TOP 10', n: TK.top10 });
      if (w.day[game] !== pacificDay()) lines.push({ t: 'FIRST RUN TODAY', n: TK.firstToday });
      (feats || []).forEach(f => { if (f && f.n > 0) lines.push({ t: String(f.t), n: Math.floor(f.n) }); });
      if (Math.random() < TK.goldenOdds) lines.push({ t: 'GOLDEN TICKET!', n: TK.golden, gold: true });
      return { lines, total: lines.reduce((a, l) => a + l.n, 0) };
    },
    // pay it out: one save, so closing the page during the animation loses nothing
    payRun(game, score, q) {
      const w = tkLoad();
      w.bal += q.total; w.earned += q.total; w.runs++;
      w.best[game] = Math.max(w.best[game] || 0, score); w.day[game] = pacificDay();
      if (q.lines.some(l => l.gold)) w.golden++;
      tkSave(w); return w.bal;
    },
  };
  window.NBTickets = Tickets;

  // ---------------------------------------------------------------- styles
  const CSS = `
#nbs{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;background:rgba(6,0,18,.9);font-family:'Press Start 2P',monospace;color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#nbs.on{display:flex}
#nbs *{box-sizing:border-box;margin:0;padding:0;font-family:inherit}
#nbsP{position:absolute;left:50%;top:50%;transform-origin:50% 50%;display:flex;flex-direction:column;align-items:center;gap:26px;padding:44px 50px;background:#0b0620;border:6px solid var(--nbc);box-shadow:0 0 40px var(--nbc),inset 0 0 40px rgba(0,0,0,.6);text-align:center}
#nbsP::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px)}
.nbs-k{font-size:22px;color:#00e5ff;text-shadow:0 0 12px #00e5ff;letter-spacing:2px}
.nbs-h{font-size:46px;color:var(--nbc);text-shadow:0 0 18px var(--nbc);line-height:1.3}
.nbs-s{font-size:56px;color:#ffe14d;text-shadow:0 0 18px #ffb000}
.nbs-m{font-size:20px;color:#d9d0ff;line-height:1.9}
.nbs-e{font-size:20px;color:#ff4b6e;min-height:24px}
.nbs-slots{display:flex;gap:16px;position:relative}
.nbs-slot{display:flex;flex-direction:column;align-items:center;gap:10px}
.nbs-ar{width:96px;height:52px;font-size:24px;background:transparent;color:#8a7bd8;border:4px solid #3a2f78;cursor:pointer}
.nbs-ar:active{background:#3a2f78;color:#fff}
.nbs-ch{width:96px;height:112px;display:flex;align-items:center;justify-content:center;font-size:64px;border:5px solid #3a2f78;background:#120a30;cursor:pointer}
.nbs-ch.cur{border-color:var(--nbc);box-shadow:0 0 24px var(--nbc);animation:nbsb 1s steps(2) infinite}
@keyframes nbsb{50%{color:var(--nbc)}}
#nbsIn{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0;font-size:16px;border:0}
.nbs-row{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.nbs-b{font-size:26px;padding:20px 34px;background:rgba(0,0,0,.4);color:var(--nbc);border:5px solid var(--nbc);cursor:pointer;box-shadow:0 0 16px var(--nbc)}
.nbs-b.sel,.nbs-b:hover{background:var(--nbc);color:#0b0620}
.nbs-b.alt{--nbc:#00e5ff}
.nbs-tabs{display:flex;gap:14px}
.nbs-tab{font-size:22px;padding:14px 22px;background:transparent;color:#8a7bd8;border:4px solid #3a2f78;cursor:pointer}
.nbs-tab.on{color:#0b0620;background:#00e5ff;border-color:#00e5ff;box-shadow:0 0 18px #00e5ff}
.nbs-list{width:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--nbc) transparent}
.nbs-li{display:grid;grid-template-columns:110px 1fr auto;gap:20px;font-size:26px;line-height:1.95;padding:0 14px;text-align:left}
.nbs-li span:last-child{text-align:right;color:#ffe14d}
.nbs-li.me{background:var(--nbc);color:#0b0620}
.nbs-li.me span:last-child{color:#0b0620}

.nbs-foc{outline:5px solid #fff;outline-offset:5px}
.nbs-more{font-size:18px;color:#7d72b8;text-align:center;line-height:2.4}
.nbt-wrap{display:flex;gap:44px;align-items:flex-start;justify-content:center;width:100%}
.nbt-mach{display:flex;flex-direction:column;align-items:center;width:250px}
.nbt-slot{width:230px;height:34px;background:#05010e;border:6px solid #3a2f78;border-radius:8px;box-shadow:inset 0 6px 10px #000}
.nbt-strip{width:150px;height:0;overflow:hidden;margin-top:-10px;position:relative;border-left:4px dotted #06010d;border-right:4px dotted #06010d;
  background:repeating-linear-gradient(180deg,#ff8a2b 0 54px,#06010d 54px 56px,#ff8a2b 56px 60px)}
.nbt-strip span{display:block;height:60px;line-height:56px;font-size:13px;color:#5a1f00;letter-spacing:1px;text-align:center}
.nbt-strip.gold{background:repeating-linear-gradient(180deg,#ffe14d 0 54px,#06010d 54px 56px,#ffe14d 56px 60px)}
.nbt-side{display:flex;flex-direction:column;gap:18px;min-width:520px;text-align:left}
.nbt-count{font-size:84px;color:#ffe14d;text-shadow:0 0 22px #ffb000;text-align:left}
.nbt-lines{display:flex;flex-direction:column;gap:12px;min-height:260px}
.nbt-l{display:flex;justify-content:space-between;gap:24px;font-size:22px;color:#d9d0ff;opacity:0;transform:translateX(-20px);transition:opacity .2s,transform .2s}
.nbt-l.on{opacity:1;transform:none}
.nbt-l b{color:#ffe14d;font-weight:normal}
.nbt-l.gold{color:#ffe14d;text-shadow:0 0 14px #ffb000;font-size:26px}
.nbt-bal{font-size:20px;color:#00e5ff}
#nbsP.portrait .nbt-wrap{flex-direction:column;align-items:center;gap:24px}
#nbsP.portrait .nbt-side{min-width:0;width:100%}

// =====================================================================
// GORE — shared particles + blood decals (map, side-scroll and scope)
// Particles fly, then land and stamp themselves onto a decal canvas that
// stays for the rest of that visit.
// =====================================================================
function goreMax() { return G.gore !== 'low'; }
// p: { x, y, z, vx, vy, vz, g, floor, c, s, life, chunk }
function stepParts(list, dctx, top) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    p.life--;
    if (top) {
      p.x += p.vx; p.y += p.vy; p.z += p.vz; p.vz -= p.g; p.vx *= 0.97; p.vy *= 0.97;
      if (p.z <= 0) { if (dctx && p.stain !== false) stamp(dctx, p); list.splice(i, 1); continue; }
    } else {
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.985;
      if (p.floor !== undefined && p.y >= p.floor) { if (dctx && p.stain !== false) stamp(dctx, p, p.floor); list.splice(i, 1); continue; }
    }
    if (p.life <= 0) list.splice(i, 1);
  }
}
function stamp(dctx, p, fy) {
  dctx.fillStyle = p.c;
  const y = fy !== undefined ? Math.min(p.y, fy) : p.y;
  const s = Math.max(1, Math.round(p.s));
  dctx.fillRect(Math.round(p.x), Math.round(y), s + (p.chunk ? 1 : 0), s);
  if (p.chunk && goreMax()) { dctx.fillStyle = BLOOD[1]; dctx.fillRect(Math.round(p.x) - 1, Math.round(y), 1, 1); }
}
// blood spray: dir is the bullet direction (unit vector), spread in radians
function spray(list, x, y, n, dx, dy, spd, opt = {}) {
  if (!goreMax()) n = Math.ceil(n * 0.25);
  const base = Math.atan2(dy, dx), spread = opt.spread !== undefined ? opt.spread : 0.9;
  for (let i = 0; i < n; i++) {
    const a = base + rand(-spread, spread), s = spd * rand(0.3, 1.2);
    list.push({ x, y, z: opt.z || 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s + (opt.up || 0) * rand(0.5, 1), vz: opt.vz !== undefined ? rand(0.4, 1) * opt.vz : 0,
      g: opt.g || 0.08, floor: opt.floor !== undefined ? opt.floor + rand(-2, 3) : undefined, c: opt.c || BLOOD[i % 3], s: opt.s || rand(1, 2), life: opt.life || 400, chunk: false });
  }
}
// chunks: meat, fur and bone bits
function chunks(list, x, y, n, fur, opt = {}) {
  if (!goreMax()) n = Math.ceil(n * 0.2);
  const cols = [fur, BLOOD[0], BLOOD[3], '#f4e8d8', fur, BLOOD[1]];
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = (opt.spd || 1.6) * rand(0.4, 1.3);
    list.push({ x, y, z: opt.z || 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (opt.up || 0) * rand(0.4, 1.1), vz: opt.vz !== undefined ? rand(0.6, 1.4) * opt.vz : 0,
      g: opt.g || 0.09, floor: opt.floor !== undefined ? opt.floor + rand(-3, 4) : undefined, c: cols[i % cols.length], s: rand(1, opt.big || 2.4), life: 500, chunk: true });
  }
}
// a pool that grows under a corpse
function pool(dctx, x, y, r, flat = 1) {
  if (!dctx) return;
  if (!goreMax()) r *= 0.5;
  dctx.fillStyle = BLOOD[1];
  for (let j = -r; j <= r; j++) for (let i = -r * 1.4; i <= r * 1.4; i++) {
    const d = (i * i) / (r * r * 1.96) + (j * j) / (r * r);
    if (d <= 1 && Math.random() < 1.15 - d * 0.6) dctx.fillRect(Math.round(x + i), Math.round(y + j * flat), 1, 1);
  }
  dctx.fillStyle = BLOOD[3];
  for (let k = 0; k < r * 2; k++) dctx.fillRect(Math.round(x + rand(-r, r)), Math.round(y + rand(-r, r) * 0.6 * flat), 1, 1);
}
function drawParts(c, list, ox, oy, top) {
  for (const p of list) {
    c.fillStyle = p.c;
    const s = Math.max(1, Math.round(p.s));
    c.fillRect(Math.round(p.x - ox), Math.round(p.y - (top ? p.z : 0) - oy), s, s);
  }
}

// =====================================================================
// CITY MAP — top-down, free roam. 4 districts side by side.
// =====================================================================
const TS = 8, MW = 200, MH = 40;
const T = { ROAD: 0, WALK: 1, BLD: 2, WATER: 3, GRASS: 4, BUSH: 5, DUMP: 6, GATE: 7, DOCK: 8, WALL: 9, DOOR: 10, CRATE: 11 };
const SOLID = new Set([T.BLD, T.WATER, T.GATE, T.WALL, T.CRATE]);
const OPAQUE = new Set([T.BLD, T.WALL, T.CRATE]);
const DISTRICTS = [
  { name: 'HARBOR', x0: 0, roof: ['#2a2f3a', '#323848', '#28303a'], neon: ['#00e5ff', '#ff2a3d'] },
  { name: 'DOWNTOWN', x0: 50, roof: ['#2a2238', '#33284a', '#2c2440'], neon: ['#ff2bd6', '#ffd23a', '#00e5ff'] },
  { name: 'TECH PARK', x0: 100, roof: ['#1f3036', '#24404a', '#1c2c34'], neon: ['#39ff6a', '#00e5ff'] },
  { name: 'C.L.A.W. ISLAND', x0: 150, roof: ['#3a2020', '#4a2626', '#331c1c'], neon: ['#ff2a3d', '#ffd23a'] },
];
let tiles = new Uint8Array(MW * MH);
const tget = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? T.BLD : tiles[y * MW + x];
const tset = (x, y, v) => { if (x >= 0 && y >= 0 && x < MW && y < MH) tiles[y * MW + x] = v; };
const districtOf = px => clamp(Math.floor(px / TS / 50), 0, 3);
const walkable = t => !SOLID.has(t);

const MAP = {
  ground: null, gctx: null, decal: null, dctx: null,
  safe: [], marks: [], camX: 0, camY: 0,
  guards: [], cams: [], bullets: [], pickups: [], corpses: [], parts: [],
  alarm: false, alarmClear: 0, reinfT: 0, downT: 0, rain: [],
};

function buildCity() {
  const r = seeded(4471);
  tiles.fill(T.BLD);
  const HROWS = [8, 20, 31];
  // ---- districts 0..2: a grid of streets
  for (let d = 0; d < 3; d++) {
    const x0 = d * 50;
    for (const ry of HROWS) for (let x = x0; x < x0 + 50; x++) for (let k = 0; k < 3; k++) tset(x, ry + k, T.ROAD);
    for (const vx of [3, 15, 27, 39]) for (let y = 2; y < 37; y++) for (let k = 0; k < 3; k++) tset(x0 + vx + k, y, T.ROAD);
    // alleys and small parks inside blocks
    for (const bx of [9, 21, 33, 45]) for (const [y0, y1] of [[2, 8], [11, 20], [23, 31], [34, 37]]) {
      if (r() < 0.6) for (let y = y0; y < y1; y++) tset(x0 + bx, y, T.WALK);
    }
    const parks = d === 2 ? 4 : d === 1 ? 1 : 1;
    for (let k = 0; k < parks; k++) {
      const px = x0 + [7, 19, 31, 43][Math.floor(r() * 4)], py = [12, 24][Math.floor(r() * 2)];
      for (let y = py; y < py + 6; y++) for (let x = px; x < px + 6; x++) tset(x, y, T.GRASS);
      for (let i = 0; i < 4; i++) tset(px + 1 + Math.floor(r() * 4), py + 1 + Math.floor(r() * 4), T.BUSH);
    }
  }
  // ---- harbor waterfront
  for (let x = 0; x < 50; x++) { for (let y = 35; y < MH; y++) tset(x, y, T.WATER); tset(x, 34, T.DOCK); }
  for (const px of [6, 18, 30, 42]) for (let y = 35; y < 39; y++) { tset(px, y, T.DOCK); tset(px + 1, y, T.DOCK); }
  for (const [cx, cy] of [[10, 24], [11, 24], [10, 25], [22, 13], [23, 13], [34, 25], [35, 25], [35, 24]]) tset(cx, cy, T.CRATE);
  // ---- C.L.A.W. island: channel, bridge, walled compound
  for (let x = 150; x < 200; x++) for (let y = 0; y < MH; y++) tset(x, y, T.WATER);
  for (let x = 160; x < 198; x++) for (let y = 4; y < 36; y++) tset(x, y, T.GRASS);
  for (let x = 150; x < 162; x++) for (let k = 0; k < 3; k++) tset(x, 20 + k, T.ROAD);
  for (let x = 162; x < 196; x++) for (let k = 0; k < 3; k++) tset(x, 20 + k, T.ROAD);
  for (const vx of [170, 186]) for (let y = 6; y < 34; y++) for (let k = 0; k < 3; k++) tset(vx + k, y, T.ROAD);
  for (let x = 160; x < 198; x++) { tset(x, 4, T.WALL); tset(x, 35, T.WALL); }
  for (let y = 4; y < 36; y++) { tset(160, y, T.WALL); tset(197, y, T.WALL); }
  for (let k = 0; k < 3; k++) tset(160, 20 + k, T.ROAD);
  for (const [bx, by, bw, bh] of [[164, 7, 5, 6], [175, 7, 9, 8], [190, 8, 6, 9], [164, 25, 5, 7], [175, 25, 9, 7], [190, 25, 6, 8]]) for (let y = by; y < by + bh; y++) for (let x = bx; x < bx + bw; x++) tset(x, y, T.BLD);
  for (let i = 0; i < 14; i++) { const x = 161 + Math.floor(r() * 36), y = 5 + Math.floor(r() * 30); if (tget(x, y) === T.GRASS) tset(x, y, T.BUSH); }
  // ---- sidewalks around every road
  const copy = tiles.slice();
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (copy[y * MW + x] !== T.BLD) continue;
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const v = (x + dx < 0 || y + dy < 0 || x + dx >= MW || y + dy >= MH) ? T.BLD : copy[(y + dy) * MW + x + dx]; return v === T.ROAD; });
    if (nb && x < 150) tiles[y * MW + x] = T.WALK;
  }
  // ---- hiding spots: bushes on sidewalks, dumpsters in alleys
  for (let y = 0; y < MH; y++) for (let x = 0; x < 150; x++) {
    const t = tget(x, y);
    if (t === T.WALK && r() < 0.045) tset(x, y, T.BUSH);
    else if (t === T.WALK && tget(x - 1, y) === T.BLD && tget(x + 1, y) === T.BLD && r() < 0.18) tset(x, y, T.DUMP);
  }
  // ---- district gates (closed barricades until the district opens)

// ---------------------------------------------------------------- menus (mouse, touch, keys and controller)
const Menu = { items: [], idx: 0, onBack: null };
const SCREENS = ['title', 'pause', 'brief', 'debrief', 'shop', 'ending'];
function hideScreens() { SCREENS.forEach(s => $(s).classList.remove('on')); Menu.items = []; Menu.onBack = null; }
function mkButtons(box, items, startIdx) {
  return items.map((it, k) => {
    const b = document.createElement('button'); b.className = 'btn' + (it.cls ? ' ' + it.cls : '');
    b.innerHTML = typeof it.label === 'function' ? it.label() : it.label;
    const i = startIdx + k;
    b.addEventListener('click', e => { e.preventDefault(); Audio2.unlock(); Audio2.sfx('select'); it.action(b); });
    b.addEventListener('mouseenter', () => { Menu.idx = i; markMenu(); });
    box.appendChild(b); return { el: b, action: it.action };
  });
}
function showMenu(screen, boxId, items, onBack, extra) {
  hideScreens(); releaseLock();
  $(screen).classList.add('on');
  let all = [];
  if (extra) { const box = $(extra.box); box.innerHTML = ''; all = mkButtons(box, extra.items, 0); }
  const box = $(boxId); box.innerHTML = '';
  all = all.concat(mkButtons(box, items, all.length));
  Menu.items = all; Menu.idx = extra && extra.start !== undefined ? extra.start : 0; Menu.onBack = onBack || null; markMenu();
  setTouchUI(false);
}
function markMenu() { Menu.items.forEach((m, i) => m.el.classList.toggle('sel', i === Menu.idx)); const m = Menu.items[Menu.idx]; if (m && m.el.scrollIntoView && $('shop').classList.contains('on')) { } }
function handleMenus() {
  if (window.NBScores && NBScores.active) return;
  if (!Menu.items.length || G.state === 'play') return;
  const M = Input.menu, n = Menu.items.length;
  const grid = $('shop').classList.contains('on') ? 2 : 1;
  if (M.up) { Menu.idx = (Menu.idx + n - grid) % n; markMenu(); Audio2.sfx('select'); }
  if (M.down) { Menu.idx = (Menu.idx + grid) % n; markMenu(); Audio2.sfx('select'); }
  if (grid === 2 && M.left) { Menu.idx = (Menu.idx + n - 1) % n; markMenu(); Audio2.sfx('select'); }
  if (grid === 2 && M.right) { Menu.idx = (Menu.idx + 1) % n; markMenu(); Audio2.sfx('select'); }
  if (M.ok) { Audio2.sfx('select'); const it = Menu.items[Menu.idx]; it && it.action(it.el); clearEdges(); return; }
  if ((M.back || (G.state === 'paused' && Input.edge.pause)) && Menu.onBack) { Menu.onBack(); clearEdges(); }
}
function clearEdges() {
  for (const k in Input.edge) Input.edge[k] = false;
  for (const k in Input.menu) Input.menu[k] = false;
}

  items.push({ label: muteLabel, action: b => { Audio2.setMuted(!Audio2.muted); b.textContent = muteLabel(); }, cls: 'mint' });

  G.state = 'menu'; Audio2.duck(false);
  st.attempts++;
  const dbEl = $('debrief');
  if (S.win) {
    const pts = { base: 1000, kills: S.killPts || 0, rounds: S.rounds * 100, time: S.timeLeft * 10, stealth: G.mission.alarmed ? 0 : 500, attempt: st.attempts === 1 ? 1000 : st.attempts === 2 ? 500 : 0 };
    let total = pts.base + pts.kills + pts.rounds + pts.time + pts.stealth + pts.attempt;
    const isBoss = i === 9;
    if (isBoss) total += 10000;
    st.done = true; st.best = Math.max(st.best, total);
    const cash = Math.round(total / 10);
    G.save.score += total; G.save.cash += cash;
    dbEl.className = 'screen';
    $('dbTitle').textContent = 'MISSION COMPLETE';
    $('dbMsg').textContent = S.reason;
    $('dbStats').innerHTML = `MISSION COMPLETE: 1000<br>KILLS + HEADSHOTS: ${pts.kills}<br>UNUSED ROUNDS (${S.rounds} &times; 100): ${pts.rounds}<br>TIME LEFT (${S.timeLeft}s &times; 10): ${pts.time}<br>STEALTH (NO ALARM): ${pts.stealth}<br>ATTEMPT ${st.attempts} BONUS: ${pts.attempt}` + (isBoss ? '<br>CHAIRMAN MITTENS: 10000' : '') + `<br><span class="gold">MISSION: ${total} &middot; CASH +$${cash}</span><br>TOTAL SCORE: ${G.save.score}`;
    saveGame();
    showMenu('debrief', 'dbMenu', [{ label: isBoss ? 'FINISH' : 'BACK TO THE CITY', action: () => isBoss ? ending(true) : backToCity(i) }]);
  } else {
    const left = 3 - st.attempts;
    if (left <= 0) st.locked = true;
    saveGame();
    dbEl.className = 'screen fail';
    $('dbTitle').textContent = left > 0 ? 'MISSION FAILED' : 'MISSION LOCKED';
    $('dbMsg').textContent = S.reason;
    $('dbStats').innerHTML = left > 0 ? `ATTEMPTS LEFT: ${left} / 3` : 'NO ATTEMPTS LEFT. C.L.A.W. KEEPS THIS ONE.<br>YOU CAN STILL PLAY THE OTHER MISSIONS.';
    const items = [];
    if (left > 0) items.push({ label: 'RETRY FROM THE PERCH', action: () => { hideScreens(); G.state = 'play'; startScope(); setTouchUI(true); } });
    items.push({ label: i === 9 && left <= 0 ? 'FINISH' : 'BACK TO THE CITY', action: () => (i === 9 && left <= 0) ? ending(false) : backToCity(i), cls: left > 0 ? 'mint' : '' });
    showMenu('debrief', 'dbMenu', items);
  }
}
function backToCity(i) {
  hideScreens(); G.state = 'play'; G.mission = null;
  const wasOpen = [0, 1, 2, 3].map(d => districtOpen(d));
  enterMap(MISSIONS[i].d, false);
  const mk = MAP.marks[i], p = snapTo(mk.x, mk.y + 1, [T.WALK, T.ROAD, T.DOCK, T.GRASS]);
  PL.x = p.x * TS + 4; PL.y = p.y * TS + 4; PL.hp = Math.max(PL.hp, 1);
  setTouchUI(true);
  const opened = [1, 2, 3].find(d => districtOpen(d) && !wasOpen[d]);
  if (opened) banner(DISTRICTS[opened].name + ' IS OPEN', '#39ff6a', 200, opened === 3 ? 'THE CHAIRMAN IS WAITING' : 'THE BARRICADES ARE DOWN');
  saveGame();
}
function ending(good) {
  G.state = 'menu'; Audio2.stopMusic(); Audio2.sfx(good ? 'win' : 'fail');
  if (good) G.save.score += 5000;
  G.save.ended = true; saveGame();
  const done = G.save.missions.filter(m => m.done).length;
  const best = Best.get(), nb = G.save.score > best;
  if (nb) Best.set(G.save.score);
  $('ending').className = 'screen' + (good ? '' : ' bad');
  $('endTitle').textContent = good ? 'OPERATION HAIRBALL: CANCELLED' : 'MITTENS GOT AWAY';
  $('endMsg').innerHTML = good
    ? "Chairman Mittens is down. C.L.A.W. is finished. The city's screens stay ours.<br><span style='color:#00e5ff'>GERB:</span> \"Not bad, kid. Not bad at all.\"<br><b style='color:#ffd23a'>ONE SHOT. ONE CHEEK.</b>"
    : "Mittens made it off the island. Somewhere, a jet full of cat is laughing.<br>Operation Hairball goes live at midnight.<br><span style='color:#00e5ff'>GERB:</span> \"We'll get him next time, kid.\"";
  $('endStats').innerHTML = (good ? 'GOOD ENDING BONUS: 5000<br>' : '') + `MISSIONS COMPLETE: ${done} / 10<br>HEADSHOTS: ${G.run.heads} &middot; TAKEDOWNS: ${G.run.takedowns}<br><span class="gold">FINAL SCORE: ${G.save.score}</span><br>` + (nb && G.save.score > 0 ? '<span class="gold">NEW BEST!</span>' : 'BEST: ' + Math.max(best, G.save.score));
  showMenu('ending', 'endMenu', [
    { label: 'PLAY AGAIN', action: newGame },
    { label: 'QUIT TO TITLE', action: showTitle, cls: 'mint' },
  ]);
  if (window.NBScores) NBScores.submit({ game: 'cheekyops', score: G.save.score, feats: good ? [{ t: 'MITTENS DOWN', n: 100 }, { t: 'GOOD ENDING', n: 100 }] : [] });
}

// ---------------------------------------------------------------- safehouse shop
const UPGRADES = [
  { k: 'steady', name: 'STEADY PAWS', desc: 'LESS SCOPE SWAY', prices: [150, 300, 500] },
  { k: 'cheeks', name: 'BIG CHEEKS', desc: 'HOLD BREATH LONGER', prices: [150, 300, 500] },
  { k: 'scope', name: 'SCOPE', desc: 'EXTRA ZOOM LEVEL', prices: [250, 500] },
  { k: 'silencer', name: 'SILENCER', desc: 'TARGETS SPOOK LESS, QUIET PISTOL', prices: [400] },
  { k: 'mag', name: 'EXTENDED MAG', desc: '+1 RIFLE ROUND PER ATTEMPT', prices: [300, 600] },
  { k: 'armor', name: 'ARMOR', desc: 'MORE HP', prices: [120, 250, 400] },
  { k: 'pammo', name: 'PISTOL AMMO', desc: 'CARRY MORE PISTOL AMMO', prices: [100, 200] },
  { k: 'quiet', name: 'QUIET FEET', desc: 'HARDER TO SPOT WHILE SNEAKING', prices: [250] },
];
const MED_PRICE = 60;
function openShop(d, keepIdx) {
  G.state = 'menu'; releaseAllTouch();
  G.save.district = d;
  PL.hp = maxHp(); G.ammo = pistolMax();          // resting at the safehouse heals and reloads
  MAP.alarm = false; MAP.guards.forEach(g => { if (g.state === 'chase') { g.state = 'patrol'; g.meter = 0; } });
  saveGame();
  $('shopTitle').textContent = DISTRICTS[d].name + ' SAFEHOUSE';
  $('shopCash').textContent = 'CASH: $' + G.save.cash + '  ·  HP AND AMMO RESTORED  ·  GAME SAVED';
  const up = G.save.upg;
  const list = UPGRADES.map(u => {
    const tier = up[u.k], max = u.prices.length, price = u.prices[tier];
    const label = `${u.name} ${'■'.repeat(tier)}${'□'.repeat(max - tier)}<small>${u.desc} · ${tier >= max ? 'MAXED' : '$' + price}</small>`;
    return { label, cls: tier >= max || G.save.cash < price ? 'dis' : '', action: () => buy(u, d) };
  });
  list.push({ label: `MED KIT ${G.save.med}/3<small>AUTO-USED BELOW 30% HP · ${G.save.med >= 3 ? 'FULL' : '$' + MED_PRICE}</small>`, cls: G.save.med >= 3 || G.save.cash < MED_PRICE ? 'dis' : '', action: () => buyMed(d) });
  const menu = [{ label: 'LEAVE', action: () => { hideScreens(); G.state = 'play'; setTouchUI(true); } }];
  for (let k = 0; k < 4; k++) if (k !== d && districtOpen(k)) menu.push({ label: 'TRAVEL: ' + DISTRICTS[k].name, cls: 'mint', action: () => { hideScreens(); G.state = 'play'; G.save.district = k; enterMap(k, true); setTouchUI(true); banner(DISTRICTS[k].name, '#00e5ff'); saveGame(); } });
  showMenu('shop', 'shopMenu', menu, menu[0].action, { box: 'shopList', items: list, start: keepIdx || 0 });
}
function buy(u, d) {
  const tier = G.save.upg[u.k], price = u.prices[tier];
  if (tier >= u.prices.length || G.save.cash < price) { Audio2.sfx('deny'); return; }
  G.save.cash -= price; G.save.upg[u.k]++; Audio2.sfx('buy');
  openShop(d, Menu.idx);
}
function buyMed(d) {
  if (G.save.med >= 3 || G.save.cash < MED_PRICE) { Audio2.sfx('deny'); return; }
  G.save.cash -= MED_PRICE; G.save.med++; Audio2.sfx('buy'); openShop(d, Menu.idx);
}

// ---------------------------------------------------------------- touch + chips
function setTouchUI(on) {
  const playing = on && G.state === 'play';
  $('touch').classList.toggle('on', playing && isCoarse() && !Input.pad.on);
  $('chips').classList.toggle('on', playing && !isCoarse());
  if (!playing) releaseAllTouch();
}
window.addEventListener('gamepadconnected', () => { setTouchUI(G.state === 'play'); if (G.state === 'title') setTimeout(() => { pollGamepad(); showTitle(); }, 50); });
window.addEventListener('gamepaddisconnected', () => setTouchUI(G.state === 'play'));
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pauseGame(); });
// Esc while the mouse is grabbed releases it without a key event, so losing the lock pauses
document.addEventListener('pointerlockchange', () => { if (!document.pointerLockElement && G.state === 'play' && (G.mode === 'scope' || G.mode === 'bcam')) pauseGame(); });

// ---------------------------------------------------------------- HUD + text
function txt(s, x, y, size, color, align = 'left', outline = true) {
  size = Math.round(size * HUDK);
  ctx.font = size + 'px "Press Start 2P", monospace'; ctx.textAlign = align;
  if (outline) { ctx.fillStyle = '#000'; ctx.fillText(s, x + Math.max(2, size / 8), y + Math.max(2, size / 8)); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.textAlign = 'left';
}
function txtW(c, s, x, y, col) { c.font = '8px monospace'; c.fillStyle = '#000'; c.fillText(s, Math.round(x - 1), Math.round(y + 1)); c.fillStyle = col; c.fillText(s, Math.round(x - 2), Math.round(y)); }
function txtTiny(c, s, x, y) {
  const F = { P: ['111', '101', '111', '100', '100'], E: ['111', '100', '110', '100', '111'], R: ['110', '101', '110', '101', '101'], C: ['111', '100', '100', '100', '111'], H: ['101', '101', '111', '101', '101'] };
  let cx = x; for (const ch of s) { const g = F[ch]; if (g) for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (g[j][i] === '1') c.fillRect(cx + i, y + j, 1, 1); cx += 4; }
}
function drawHUD() {
  if (G.mode === 'scope') { drawScopeHUD(); }
  else if (G.mode === 'bcam') {
    if (BC.t > 90) txt('TARGET DOWN', 960, 1030, 40, '#ffd23a', 'center');
    txt('BULLET CAM', 60, 70, 24, '#ff2a3d');
  } else {
    const P = PL;
    ctx.fillStyle = '#000'; ctx.fillRect(36, 36, 420, 36);
    const k = clamp(P.hp / maxHp(), 0, 1); ctx.fillStyle = k > 0.5 ? '#39ff6a' : k > 0.25 ? '#ffd23a' : '#ff2a3d'; ctx.fillRect(42, 42, Math.round(408 * k), 24);
    txt('HP', 470, 66, 20, '#fff');
    txt('PISTOL ' + G.ammo + '/' + pistolMax() + (G.save.upg.silencer ? ' (SILENCED)' : ''), 40, 116, 20, '#ffd23a');
    txt('MED KITS ' + G.save.med, 40, 152, 18, '#39ff6a');
    if (P.crouch) txt('SNEAKING', 40, 192, 18, '#00e5ff');
    if (G.mode === 'map' && P.hidden) txt('HIDDEN', 40, 228, 18, '#7affc8');
    txt('$' + G.save.cash, 1880, 140, 26, '#39ff6a', 'right');
    txt('SCORE ' + G.save.score, 1880, 184, 20, '#fff', 'right');
    if (G.mode === 'map') {
      txt(DISTRICTS[districtOf(P.x)].name, 960, 60, 22, '#00e5ff', 'center');
      const done = G.save.missions.filter(m => m.done || m.locked).length;
      txt('MISSIONS ' + done + '/10', 1880, 222, 18, '#ffd23a', 'right');
      drawMarkerArrows();
    } else {
      txt('MISSION ' + (G.mission.i + 1) + ': ' + MISSIONS[G.mission.i].name, 960, 60, 22, '#ffd23a', 'center');
      // progress bar to the perch
      ctx.fillStyle = '#000'; ctx.fillRect(760, 80, 400, 12); ctx.fillStyle = '#ffd23a'; ctx.fillRect(762, 82, Math.round(396 * clamp(P.x / SIDE.perch, 0, 1)), 8);
    }
    if ((MAP.alarm && G.mode === 'map') || (SIDE.alarm && G.mode === 'side')) {
      const c = G.mode === 'map' ? MAP.alarmClear : SIDE.alarmClear;
      txt('ALARM  ' + Math.ceil((600 - c) / 60) + 's', 960, 136, 24, Math.floor(G.t / 15) % 2 ? '#ff2a3d' : '#fff', 'center');
    }
    if (G.hint) { ctx.font = '22px "Press Start 2P", monospace'; const w = ctx.measureText(G.hint).width + 50; ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(960 - w / 2, 968, w, 52); txt(G.hint, 960, 1004, 22, '#fff', 'center', false); }
  }
  // floaters
  for (const f of G.floaters) {
    if (f.world !== G.mode && !(f.world === 'scope' && G.mode === 'bcam')) continue;
    let sx, sy;
    if (f.world === 'map') { sx = (f.x - MAP.camX) * SCALE; sy = (f.y - MAP.camY) * SCALE; }
    else if (f.world === 'side') { sx = (f.x - SIDE.camX) * SCALE; sy = f.y * SCALE; }
    else { if (G.mode !== 'scope' || !SC.view) continue; const Z = SC.zooms[SC.zi]; sx = (VW / 2 + (f.x - SC.view.x) * Z) * SCALE; sy = (VH / 2 + (f.y - SC.view.y) * Z) * SCALE; }
    ctx.globalAlpha = Math.min(1, f.life / 20);
    txt(f.text, sx, sy - (f.max - f.life) * 0.6, 22, f.color, 'center');
    ctx.globalAlpha = 1;
  }
  // banner
  if (G.banner) {
    const b = G.banner, k = Math.min(1, (b.max - b.t) / 8, b.t / 12);
    ctx.save(); ctx.globalAlpha = k;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 400, 1920, b.sub ? 190 : 140);
    txt(b.text, 960, 490, 54, b.color, 'center');
    if (b.sub) txt(b.sub, 960, 556, 24, '#fff', 'center');
    ctx.restore();
  }
  if (G.hurtFlash > 0) { ctx.fillStyle = `rgba(255,0,20,${G.hurtFlash / 40})`; ctx.fillRect(0, 0, 1920, 1080); }
}
function drawMarkerArrows() {
  const cx = MAP.camX, cy = MAP.camY;
  MAP.marks.forEach(mk => {
    const st = G.save.missions[mk.i];
    if (st.done || st.locked || !districtOpen(MISSIONS[mk.i].d)) return;
    const x = mk.x * TS + 4 - cx, y = mk.y * TS + 4 - cy;
    if (x >= 0 && x <= VW && y >= 0 && y <= VH) return;
    const a = Math.atan2(y - VH / 2, x - VW / 2);
    const ex = clamp(VW / 2 + Math.cos(a) * 400, 12, VW - 12) * SCALE, ey = clamp(VH / 2 + Math.sin(a) * 400, 12, VH - 12) * SCALE;
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
    ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(-10, -18); ctx.lineTo(-10, 18); ctx.fill();
    ctx.restore();
    txt(String(mk.i + 1), ex - Math.cos(a) * 40, ey - Math.sin(a) * 40 + 10, 20, '#ffd23a', 'center');
  });
}

// ---------------------------------------------------------------- render + loop
function render() {
  if (Cam.shake > 0.1) { Cam.sx = rand(-Cam.shake, Cam.shake); Cam.sy = rand(-Cam.shake, Cam.shake); Cam.shake *= 0.86; } else { Cam.sx = Cam.sy = 0; Cam.shake = 0; }
  const inGame = G.state === 'play' || G.state === 'paused' || (G.state === 'menu' && PL);
  if (inGame) {
    if (G.mode === 'map') renderMap(); else if (G.mode === 'side') renderSide(); else if (G.mode === 'scope') renderScope(); else if (G.mode === 'bcam') renderBulletCam();
    ctx.drawImage(world, 0, 0, 1920, 1080);
    if (G.state === 'play' || G.state === 'paused') drawHUD();
  } else renderTitleBg();
}
function renderTitleBg() {
  if (!MAP.ground) return;
  const t = G.t, ox = Math.round((t * 0.25) % (MW * TS - VW)), oy = 60;
  wctx.drawImage(MAP.ground, -ox, -oy);
  rain(wctx);
  ctx.drawImage(world, 0, 0, 1920, 1080);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, 1920, 1080);
  // a scope circle drifting over the city
  const sx = 960 + Math.sin(t * 0.01) * 500, sy = 540 + Math.cos(t * 0.013) * 220;
  ctx.strokeStyle = 'rgba(255,42,61,.5)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(sx, sy, 150, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,42,61,.5)'; ctx.fillRect(sx - 150, sy - 2, 300, 4); ctx.fillRect(sx - 2, sy - 150, 4, 300);
}
function step() {
  if (window.NBScores && NBScores.active) { clearEdges(); return; }
  G.t++;
  if (G.confirm > 0 && --G.confirm === 0 && G.state === 'title') showTitle();
  if (G.state === 'play') {
    if (Input.edge.pause) { pauseGame(); clearEdges(); return; }
    if (G.mode === 'map') updateMap(); else if (G.mode === 'side') updateSide(); else if (G.mode === 'scope') updateScope(); else if (G.mode === 'bcam') updateBulletCam();
    for (let i = G.floaters.length - 1; i >= 0; i--) if (--G.floaters[i].life <= 0) G.floaters.splice(i, 1);
    if (G.banner && --G.banner.t <= 0) G.banner = null;
    if (G.hurtFlash > 0) G.hurtFlash--;
    if (Input.mouse.moved > 0) Input.mouse.moved--;
  }
  for (const k in Input.edge) Input.edge[k] = false;
}
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  pollGamepad();
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  handleMenus();
  for (const k in Input.menu) Input.menu[k] = false;
  let n = 0;
  while (acc >= STEP && n < 8) { step(); acc -= STEP; n++; }
  if (n >= 8) acc = 0;
  render();
}
function boot() {
  try { Audio2.muted = localStorage.getItem(MUTE_KEY) === '1'; music.muted = Audio2.muted; G.gore = localStorage.getItem(GORE_KEY) === 'low' ? 'low' : 'max'; } catch (e) { }
  buildSprites();
  G.save = newSave(); G.run = G.save.run;      // placeholder so the city can be drawn behind the title
  buildCity(); applyGates(); renderGround();
  const rc = $('rotateChonx').getContext('2d'); rc.drawImage(S.chonx.idle.img, 0, 0);
  $('rotateChonx').width = 22; rc.drawImage(S.chonx.idle.img, 0, 0);
  setupPad();
  $('tPause').addEventListener('pointerdown', e => { e.preventDefault(); Input.edge.pause = true; });
  $('cPause').addEventListener('click', e => { e.preventDefault(); if (G.state === 'play') pauseGame(); });
  layout();
  showTitle();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const fontReady = document.fonts && document.fonts.load ? document.fonts.load('20px "Press Start 2P"').catch(() => { }) : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 2500))]).then(boot);

</script>
