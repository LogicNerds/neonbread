name: Sync games
# Copies the latest Chonx '26, Yeet The Baby and Grandma Theft Automatic builds
# from their own repos into this site. Runs every hour, or by hand from the Actions tab.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-games
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull the latest game builds
        run: python3 tools/sync-games.py
      - name: Commit if anything changed
        run: |
          git config user.name "neon-bread-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chonx26 yeet gta
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Sync games from their repos" && git push; fi
